<style>
:root {
  --bg: #f4f4f7; --surface: #ffffff; --line: #e2e1e9; --ink: #1d1b26; --muted: #6a6778;
  --accent: #54347e; --accent-ink: #ffffff; --accent-soft: #eee8f6;
  --bad: #b3261e; --bad-soft: #fbe9e7; --warn: #8a5a00; --warn-soft: #fbf0d9; --good: #1f6b4a; --good-soft: #e3f2ea; --info: #1d5fa8; --info-soft: #e4eefa;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-num: "Jost", "IBM Plex Sans JP", "Hiragino Sans", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15141b; --surface: #1f1d28; --line: #33303f; --ink: #efedf5; --muted: #a29eb2;
  --accent: #c4a6ea; --accent-ink: #1d1529; --accent-soft: #2f2740;
  --bad: #ff9b90; --bad-soft: #3f2220; --warn: #eec26e; --warn-soft: #3a2e16; --good: #7fd3ab; --good-soft: #1b3429; --info: #8cbcf2; --info-soft: #1b2a3d;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15141b; --surface: #1f1d28; --line: #33303f; --ink: #efedf5; --muted: #a29eb2;
  --accent: #c4a6ea; --accent-ink: #1d1529; --accent-soft: #2f2740;
  --bad: #ff9b90; --bad-soft: #3f2220; --warn: #eec26e; --warn-soft: #3a2e16; --good: #7fd3ab; --good-soft: #1b3429; --info: #8cbcf2; --info-soft: #1b2a3d;
  color-scheme: dark }
* { box-sizing: border-box }
html { padding: env(safe-area-inset-top, 0px) 0 0; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; }
.brand { font-family: var(--font-num); font-size: 20px; letter-spacing: .08em; display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand small { font-family: var(--font-body); font-size: 12px; letter-spacing: .04em; color: var(--muted); }
.who { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 5px 12px; font-size: 13px; white-space: nowrap; }
main { padding-block: 16px 104px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h3 { margin: 0; font-size: 16px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.big { font-family: var(--font-num); font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1; }
.big small { font-size: 14px; color: var(--muted); margin-left: 4px; }
.field, select.field, textarea.field { width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
textarea.field { min-height: 72px; resize: vertical; }
label.lbl { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 99px; font-size: 13px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.group { display: flex; flex-direction: column; gap: 6px; }
.group h2 { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin: 0; display: flex; justify-content: space-between; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 11px 14px; width: 100%; text-align: left; border: 0; background: transparent; }
.row + .row { border-top: 1px solid var(--line); }
button.row:hover { background: var(--bg); }
.name { font-weight: 500; overflow-wrap: anywhere; }
.sub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.p-none { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.p-lectured, .p-redo { background: var(--info-soft); color: var(--info); }
.p-requested { background: var(--warn-soft); color: var(--warn); }
.p-passed { background: var(--good-soft); color: var(--good); }
.p-late { background: var(--bad-soft); color: var(--bad); }
.p-std { background: var(--accent-soft); color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 8px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.good { background: var(--good); border-color: var(--good); color: var(--surface); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions .btn { flex: 1 1 140px; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }
.note { padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
.err { color: var(--bad); font-size: 13px; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 3.6em; gap: 10px; align-items: center; font-size: 13px; border: 0; background: none; padding: 0; text-align: left; }
.bar { height: 10px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar i.g { background: var(--good); } .bar i.w { background: var(--warn); } .bar i.b { background: var(--info); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: 0; }
.legend .lg::before { background: var(--good); } .legend .lw::before { background: var(--warn); } .legend .lb::before { background: var(--info); }
.tbl-wrap { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
table.mx { border-collapse: collapse; font-size: 12px; min-width: 100%; }
table.mx th, table.mx td { padding: 7px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: center; }
table.mx th:first-child, table.mx td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
table.mx thead th { color: var(--muted); font-weight: 500; }
table.mx td.cell { font-family: var(--font-num); }
table.mx td.full { color: var(--good); font-weight: 700; }
table.mx tr.click { cursor: pointer; }
table.mx tr.click:hover td { background: var(--bg); }
.kv { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 6px 10px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.log { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(10, 8, 20, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet h3 { margin: 0; font-size: 18px; }
.sheet .x { position: sticky; top: 0; align-self: flex-end; margin-bottom: -40px; }
.prac { display: flex; align-items: center; gap: 12px; }
.prac .big { min-width: 2.2em; text-align: center; }
nav { position: fixed; inset: auto 0 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); }
.tabs button { position: relative; border: 0; background: transparent; padding: 15px 0; font-size: 14px; color: var(--muted); }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; box-shadow: inset 0 2px 0 var(--accent); }
.badge { position: absolute; top: 6px; margin-left: 4px; background: var(--bad); color: #fff; font-size: 10px; border-radius: 99px; padding: 0 6px; font-weight: 700; }
#toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px); }
.login { max-width: 420px; margin: 24px auto; }
.rank { display: inline-block; vertical-align: middle; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; white-space: nowrap; letter-spacing: .02em; }
.rk0 { background: #eceaf2; color: #5d5a6b; } .rk1 { background: #e4eefa; color: #1d5fa8; } .rk2 { background: #e3f2ea; color: #1f6b4a; }
.rk3 { background: #fbf0d9; color: #8a5a00; } .rk4 { background: #f6e3ef; color: #9a2f6c; } .rk5 { background: #54347e; color: #fff; }
.hero .rank { font-size: 12px; background: #fff; color: #54347e; }
.rk-t { font-size: 10px; opacity: .75; margin-left: 2px; }
table.mx .rank { font-size: 10px; padding: 0 6px; }

.sec-t { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.crit { list-style: none; padding: 0; margin: -6px 0 0; display: flex; flex-direction: column; gap: 6px; }
.crit li { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.crit .cn { font-family: var(--font-num); color: var(--accent); font-weight: 500; min-width: 1em; }
.crit label { display: flex; gap: 10px; align-items: flex-start; width: 100%; cursor: pointer; }
.crit input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--good); flex: none; margin: 1px 0 0; }
.guide { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.guide summary { cursor: pointer; font-weight: 500; font-size: 14px; color: var(--accent); }
.g-body { white-space: pre-wrap; font-size: 13px; margin-top: 8px; overflow-wrap: anywhere; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: -6px; }
.links .btn { text-decoration: none; color: var(--accent); }
.hist { display: flex; flex-direction: column; gap: 6px; margin-top: -6px; }
.h-row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.h-note { width: 100%; color: var(--ink); font-size: 13px; }

.hero { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #1a6e8e)); color: #fff; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.hero-top { display: flex; align-items: center; gap: 16px; }
.ring-box { position: relative; width: 88px; height: 88px; flex: none; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; }
.ring-bg { stroke: rgba(255,255,255,.22); }
.ring-fg { stroke: #fff; }
.ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-num); }
.ring-num b { font-size: 28px; font-weight: 500; } .ring-num small { font-size: 12px; margin-left: 1px; opacity: .8; }
.hero-txt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.hero-name { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
.hero .sub { color: rgba(255,255,255,.8); }
.stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: rgba(255,255,255,.85); }
.stats b { font-family: var(--font-num); font-size: 18px; font-weight: 500; color: #fff; margin-right: 3px; }
.next { background: rgba(255,255,255,.12); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.next-h { font-size: 11px; letter-spacing: .1em; opacity: .85; }
.next-it { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 8px; align-items: center; background: none; border: 0; color: #fff; padding: 5px 0; text-align: left; }
.next-t { font-weight: 500; overflow-wrap: anywhere; } .next-s { font-size: 11px; opacity: .8; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.5); }
.dot.d-lectured, .dot.d-redo { background: #9cc8ff; } .dot.d-requested { background: #ffd27a; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { display: flex; flex-direction: column; gap: 8px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.tile-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.tile-h { font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.tile-n { font-family: var(--font-num); font-size: 13px; color: var(--muted); } .tile-n b { font-size: 20px; color: var(--ink); font-weight: 500; margin-right: 2px; }
.tile.done .tile-n b { color: var(--good); }
.list-head { display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 80px; }
.list-head .btn { align-self: flex-start; }
.seg2 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; background: var(--surface); border: 1px solid var(--line); padding: 3px; border-radius: 10px; }
.seg2 button { border: 0; background: transparent; padding: 7px 2px; border-radius: 7px; font-size: 13px; color: var(--muted); }
.seg2 button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 500; }
.row.item { grid-template-columns: auto minmax(0, 1fr) auto; }
.it-body { min-width: 0; }
.ico { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; }
.ico.i-lectured, .ico.i-redo { border-color: var(--info); background: linear-gradient(90deg, var(--info) 50%, transparent 50%); }
.ico.i-requested { border-color: var(--warn); background: var(--warn); color: var(--surface); }
.ico.i-passed { border-color: var(--good); background: var(--good); color: var(--surface); }
.st { font-size: 11px; font-weight: 700; white-space: nowrap; color: var(--muted); }
.st.t-passed { color: var(--good); } .st.t-requested { color: var(--warn); } .st.t-lectured, .st.t-redo { color: var(--info); }
.row.item.s-passed .name { color: var(--muted); }
.group h2 { position: sticky; top: calc(57px + env(safe-area-inset-top, 0px)); background: var(--bg); padding-block: 6px; z-index: 2; }
table.mx td.cell { position: relative; }
table.mx td.h0 { color: var(--muted); }
table.mx td.h1 { background: color-mix(in srgb, var(--good) 12%, transparent); }
table.mx td.h2 { background: color-mix(in srgb, var(--good) 26%, transparent); }
table.mx td.h3 { background: color-mix(in srgb, var(--good) 42%, transparent); }
table.mx td.full { background: var(--good); color: var(--surface); }

</style>
</head>

</div></header>

<script>
const STORES = [['hair', 'hair design'], ['liss', 'Liss'], ['till', 'till']];
const CATS = ['基礎スキル', 'SP.SPA', 'COLOR', '縮毛矯正', 'HAIR SET , MAKE', 'CUT', 'MODEL', 'KITSUKE', 'ソムリエ'];

    b.push('<button type="button" class="btn" data-act="saveNote">ふり返りを保存</button>');
  } else if (S.tab === 'me') {
    b.push('<div class="sub">自分以外の記録は見るだけです。</div>');
  }
  return b.join('');
}

/* ---- 書き込み ---- */
async function upd(sid, iid, patch, logMsg) {
  const id = sid + '_' + iid, cur = pOf(sid, iid);
  const log = (cur.log || []).slice(-30);
  if (logMsg) log.push({ t: Date.now(), a: logMsg });
  const data = Object.assign({ staffId: sid, itemId: iid, state: cur.state || 'none', practice: cur.practice || [] }, patch, { log, at: Date.now() });
  S.prog[id] = Object.assign({}, cur, data);
  render();
  try { await db.doc('cur_prog/' + id).set(data, { merge: true }); } catch (e) { toast('保存できませんでした：' + e.message); }
}
async function checkPin(v) {
  if (S.pin == null) { const d = await db.doc('settings/app').get(); S.pin = d.exists ? String(d.data().pin || '') : ''; }
  return !!S.pin && String(v).trim() === S.pin;
}
async function seed(pin) {
  if (!(await checkPin(pin))) { toast('PINが違います'); return; }
  const b = db.batch(); let n = 0, ord = 0;
  SEED_ITEMS.forEach(d => { ord++; b.set(db.collection('cur_items').doc('i' + String(ord).padStart(3, '0')), Object.assign({}, d, { year: yNum(d.yearLabel), order: ord })); n++; });
  SEED_STAFF.forEach((name, i) => b.set(db.collection('cur_staff').doc('s' + String(i + 1).padStart(2, '0')), { name, store: '', start: '', order: i + 1, hidden: false }));
  await b.commit(); toast(`${n}項目と${SEED_STAFF.length}名を登録しました`);
}

/* ---- 操作 ---- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'close' && ev.target.closest('[data-stop]') && !ev.target.closest('.x')) return;
  const a = el.dataset.act, id = el.dataset.id;
  const o = S.open;
  switch (a) {
    case 'tab': S.tab = id; S.open = null; S.viewStaff = ''; S.cat = ''; S.sf = ''; render(); window.scrollTo(0, 0); break;
    case 'pickMe': S.pickingMe = true; S.tab = 'me'; render(); break;
    case 'cancelPick': S.pickingMe = false; render(); break;
    case 'setMe': S.me = id; S.pickingMe = false; lsSet('cur.me', id); render(); window.scrollTo(0, 0); break;
    case 'cat': S.cat = S.cat === id ? '' : id; render(); { const g = document.querySelector('.list-head'); if (g && S.cat) g.scrollIntoView({ block: 'start', behavior: 'smooth' }); } break;
    case 'sf': S.sf = id; render(); break;
    case 'open': S.open = { sid: el.dataset.sid, iid: id }; renderSheet(); break;
    case 'close': S.open = null; renderSheet(); break;
    case 'viewStaff': S.viewStaff = id; S.cat = ''; render(); window.scrollTo(0, 0); break;
    case 'back': S.viewStaff = ''; render(); break;
    case 'unlock': { const v = $('t-pin').value; if (await checkPin(v)) { S.teacher = true; render(); } else $('t-err').textContent = 'PINが違います'; break; }
    case 'lock': S.teacher = false; S.viewStaff = ''; render(); break;
    case 'seed': el.disabled = true; try { await seed($('seed-pin').value); } catch (e) { toast(e.message); } el.disabled = false; break;
    case 'pracPlus': { const p = pOf(o.sid, o.iid); const pr = (p.practice || []).concat(Date.now()); await upd(o.sid, o.iid, { practice: pr, state: p.state === 'none' ? 'lectured' : p.state }, `練習 ${pr.length}回目`); toast(`練習 ${pr.length}回目を記録しました`); break; }
    case 'pracMinus': { const p = pOf(o.sid, o.iid); await upd(o.sid, o.iid, { practice: (p.practice || []).slice(0, -1) }, '練習を1回取り消し'); break; }
    case 'lecture': await upd(o.sid, o.iid, { lectureAt: Date.now(), state: pOf(o.sid, o.iid).state === 'none' ? 'lectured' : pOf(o.sid, o.iid).state }, 'レクチャー'); toast('レクチャー日を記録しました'); break;
    case 'request': await upd(o.sid, o.iid, { state: 'requested', requestedAt: Date.now(), staffNote: noteVal('note-staff') }, 'チェック申請'); toast('講師に申請しました'); break;
    case 'unrequest': await upd(o.sid, o.iid, { state: pOf(o.sid, o.iid).lectureAt || (pOf(o.sid, o.iid).practice || []).length ? 'lectured' : 'none' }, '申請を取り消し'); break;
    case 'pass': case 'redo': {
      const ok = a === 'pass', it = itemOf(o.iid), p = pOf(o.sid, o.iid), ck = (o.checks || []).slice(), tm = $('judge-time') ? parseFloat($('judge-time').value) : NaN, note = noteVal('note-teacher');
      const n = ck.filter(Boolean).length, of = (it.criteria || []).length;
      const h = { t: Date.now(), ok, n, of, time: isNaN(tm) ? null : tm, note };
      const patch = { state: ok ? 'passed' : 'redo', teacherNote: note, checks: ck, history: (p.history || []).concat([h]).slice(-20) };
      if (!isNaN(tm)) patch.timeMin = tm;
      if (ok) patch.passedAt = Date.now();
      await upd(o.sid, o.iid, patch, ok ? '合格' : 'やり直し'); toast(ok ? '合格にしました' : 'やり直しにしました');
      if (ok) { S.open = null; renderSheet(); }
      break;
    }
    case 'editItem': o.edit = !o.edit; renderSheet(); break;
    case 'saveItem': {
      const links = $('ie-links').value.split('\n').map(x => x.trim()).filter(Boolean).map(x => { const k = x.lastIndexOf('|'); return k < 0 ? { t: x, u: x } : { t: x.slice(0, k).trim(), u: x.slice(k + 1).trim() }; });
      const tm = parseFloat($('ie-time').value), yLabel = $('ie-year').value.trim();
      const data = { title: $('ie-title').value.trim() || itemOf(o.iid).title, std: $('ie-std').value, yearLabel: yLabel, year: yNum(yLabel), time: isNaN(tm) ? null : tm,
        criteria: $('ie-crit').value.split('\n').map(x => x.trim()).filter(Boolean), guide: $('ie-guide').value, links, src: 'edited' };
      try { await db.doc('cur_items/' + o.iid).update(data); o.edit = false; o.checks = null; toast('保存しました'); } catch (e) { toast(e.message); }
      renderSheet(); break;
    }
    case 'importV2': {
      el.disabled = true;
      try {
        const b = db.batch(); let n = 0;
        S.items.forEach(it => { const k = Number(String(it.id).slice(1)) - 1, d = SEED_ITEMS[k]; if (!d || d.title !== it.title || it.criteria) return; b.update(db.doc('cur_items/' + it.id), { cat: d.cat, yearLabel: d.yearLabel, year: yNum(d.yearLabel), time: d.time, criteria: d.criteria, guide: d.guide, links: d.links, src: d.src }); n++; });
        await b.commit(); toast(n + '項目に合格基準・動画を取り込みました');
      } catch (e) { toast(e.message); }
      el.disabled = false; break;
    }
    case 'unpass': await upd(o.sid, o.iid, { state: 'redo', passedAt: null }, '合格を取り消し'); break;
    case 'saveNote': { const patch = {}; if ($('note-staff')) patch.staffNote = noteVal('note-staff'); if ($('note-teacher')) patch.teacherNote = noteVal('note-teacher'); await upd(o.sid, o.iid, patch, ''); toast('保存しました'); break; }
    case 'newStaff': S.editStaff = { name: '', store: '', start: '' }; render(); break;
    case 'editStaff': S.editStaff = Object.assign({}, staffOf(id)); render(); break;
    case 'cancelStaff': S.editStaff = null; render(); break;
    case 'saveStaff': {
      const name = $('sf-name').value.trim(); if (!name) { toast('名前を入れてください'); break; }
      const data = { name, store: $('sf-store').value, start: $('sf-start').value };
      try {
        if (S.editStaff.id) await db.doc('cur_staff/' + S.editStaff.id).update(data);
        else await db.collection('cur_staff').doc().set(Object.assign(data, { hidden: false, order: S.staff.length + 1 }));
        S.editStaff = null; toast('保存しました');
      } catch (e) { toast(e.message); }
      render(); break;
    }
    case 'hideStaff': try { await db.doc('cur_staff/' + S.editStaff.id).update({ hidden: !S.editStaff.hidden }); S.editStaff = null; render(); } catch (e) { toast(e.message); } break;
  }
});
const noteVal = id => ($(id) ? $(id).value.trim() : (pOf(S.open.sid, S.open.iid)[id === 'note-staff' ? 'staffNote' : 'teacherNote'] || ''));
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.chg === 'chk' && S.open) { S.open.checks[Number(el.dataset.k)] = el.checked; const h = $('jhint'); if (h) h.textContent = `　${S.open.checks.filter(Boolean).length}/${S.open.checks.length} 達成`; }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.open) { S.open = null; renderSheet(); } });
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'login-form') return;
  ev.preventDefault();
  try { await firebase.auth().signInWithEmailAndPassword($('lg-email').value.trim(), $('lg-pass').value); }
  catch (e) { $('lg-err').textContent = 'メールアドレスかパスワードが違います'; }
});

/* ---- 接続 ---- */
let db, unsub = [];
function listen() {
  const typing = () => { const a = document.activeElement; return a && a.matches('input,textarea,select'); };
  const soft = () => { if (typing()) { if (S.open) return; return; } render(); };
  unsub.push(db.collection('cur_items').onSnapshot(s => { S.items = s.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.order || 0) - (b.order || 0)); S.ready.add('i'); soft(); }, e => { S.err = e.message; render(); }));
  unsub.push(db.collection('cur_staff').onSnapshot(s => { S.staff = s.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.order || 0) - (b.order || 0)); S.ready.add('s'); soft(); }, e => { S.err = e.message; render(); }));
  unsub.push(db.collection('cur_prog').onSnapshot(s => { const m = {}; s.docs.forEach(d => m[d.id] = d.data()); S.prog = m; S.ready.add('p'); soft(); }, e => { S.err = e.message; render(); }));
  S.ready.add('x');
}
document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if (!(a && a.matches('input,textarea,select'))) { if (S.open) renderSheet(); } }, 0));
(function init() {
  if (typeof firebaseConfig === 'undefined' || !window.firebase) { $('main').innerHTML = '<div class="empty">設定ファイル（config.js）が読み込めません。</div>'; return; }
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebase.auth().onAuthStateChanged(u => {
    S.user = u || null;
    if (u && !unsub.length) listen();
    render();
  });
})();
</script>
</body>
</html>
