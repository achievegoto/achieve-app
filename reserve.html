.kpi { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .kl { font-size: 11px; color: var(--muted); }
.kpi b { font-family: var(--font-num); font-size: 18px; font-weight: 500; } .kpi b small { font-size: 11px; margin-left: 1px; }
.kpi .ks { font-size: 11px; color: var(--muted); }
.pos { color: var(--good); } .neg { color: var(--bad); }
.pbar { position: relative; height: 6px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); margin-top: 3px; }
.pbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; } .pbar i.ok { background: var(--good); } .pbar i.ng { background: var(--warn); }
.pbar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
table.rep { border-collapse: collapse; font-size: 12px; min-width: 100%; }
table.rep th, table.rep td { padding: 6px 7px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.rep thead th { color: var(--muted); font-weight: 500; text-align: right; } table.rep thead th:first-child { text-align: left; }
table.rep tbody th { text-align: left; font-weight: 500; position: sticky; left: 0; background: var(--surface); }
table.rep td.c { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
table.rep tr.r-prev td, table.rep tr.r-prev th { color: var(--muted); }
table.rep tr.r-cur td { background: color-mix(in srgb, var(--warn-soft) 70%, transparent); }
table.rep tr.r-yoy td { background: color-mix(in srgb, var(--info-soft) 60%, transparent); }
table.rep tr.r-yoy { border-bottom: 2px solid var(--line); }
table.rep tr.r-tg td { background: var(--accent-soft); }
table.rep td.tot { font-weight: 700; }
table.rep.tg td { padding: 4px; } table.rep.tg .tgin { width: 7.5em; padding: 6px 8px; text-align: right; }
table.rep tr.grp td { color: var(--muted); font-size: 11px; padding-top: 12px; }
.ptop { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.ptop .psel { width: auto; min-width: 0; flex: 1 1 120px; max-width: 260px; font-weight: 500; }
.ptop .mnav { margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 3px; min-width: 0; color: var(--ink); font: inherit; cursor: pointer; }
.tile.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.tile .kl { font-size: 11px; color: var(--muted); }
.tile b { font-family: var(--font-num); font-size: 20px; font-weight: 500; line-height: 1.15; } .tile b small { font-size: 12px; margin-left: 1px; }
.tile .ks { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--muted); align-items: baseline; }
.dt { font-family: var(--font-num); font-weight: 600; } .dt.up { color: var(--good); } .dt.dn { color: var(--bad); }
.spark { width: 100%; height: 22px; margin-top: 2px; } .spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; opacity: .8; }
.chart { margin-top: 10px; overflow-x: auto; } .chart svg { width: 100%; min-width: 320px; max-width: 620px; margin: 0 auto; height: auto; display: block; }
.chart .b-cur { fill: color-mix(in srgb, var(--accent) 60%, transparent); } .chart .b-cur.sel { fill: var(--accent); }
.chart .b-prev { fill: color-mix(in srgb, var(--muted) 35%, transparent); }
.chart .b-tg { stroke: var(--warn); stroke-width: 2; stroke-dasharray: 3 2; }
.chart .axis { stroke: var(--line); } .chart text { font-size: 10px; fill: var(--muted); text-anchor: middle; font-family: var(--font-num); } .chart text.sel { fill: var(--ink); font-weight: 600; } .chart text.ymax { text-anchor: start; }
.legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); margin-top: 6px; } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.lg-cur { background: var(--accent); } .lg-prev { background: color-mix(in srgb, var(--muted) 35%, transparent); } .lg-tg { background: var(--warn); height: 3px !important; vertical-align: 2px !important; }
details > summary { list-style: none; } details > summary::-webkit-details-marker { display: none; }
details[open] > summary .sub { display: none; }
table.mlist { margin-top: 8px; font-size: 13px; } table.mlist th small { color: var(--muted); font-size: 10px; margin-left: 2px; }
table.mlist thead th { position: static; } table.mlist tr.here th, table.mlist tr.here td { background: var(--accent-soft); }
table.rep td.pos { color: var(--good); } table.rep td.neg { color: var(--bad); }
.lv-free { display: flex; flex-wrap: wrap; white-space: nowrap; gap: 4px 8px; align-items: baseline; margin-top: 6px; font-size: 12px; color: rgba(255,255,255,.85); } .lv-free b { font-family: var(--font-num); font-size: 18px; font-weight: 500; color: #fff; } .hero .dt.up { color: #b9f3d6; } .hero .dt.dn { color: #ffc4bd; }
@media (min-width: 641px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.cmp { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
.cmp-row { display: grid; grid-template-columns: minmax(0, 7.5em) minmax(0, 1fr) auto; gap: 10px; align-items: center; background: none; border: 0; padding: 7px 4px; border-radius: 8px; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
.cmp-row:hover { background: var(--accent-soft); }
.cmp-n { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .cmp-n i { font-style: normal; font-family: var(--font-num); color: var(--muted); font-size: 11px; display: inline-block; width: 1.6em; }
.cmp-bar { height: 10px; background: var(--bg); border-radius: 99px; overflow: hidden; } .cmp-bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.cmp-v { font-family: var(--font-num); font-size: 13px; white-space: nowrap; text-align: right; }
@media (max-width: 480px) { .cmp-row { grid-template-columns: minmax(0, 1fr) auto; } .cmp-bar { grid-column: 1 / -1; grid-row: 2; } }
.stores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } @media (max-width: 900px) { .stores { grid-template-columns: minmax(0, 1fr); } } .scard .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } @media (min-width: 901px) { .scard .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } } @media (max-width: 420px) { .scard .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
table.mlist td.tot { font-weight: 600; }
.hero { background: linear-gradient(135deg, #7a2e3b, #b2563f); }
.note { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.note.ok { border-color: var(--good); }
.group h2 small { margin-left: 8px; font-weight: 400; color: var(--muted); }
.card.list { padding: 4px 0; }
.rsv { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.rsv:last-child { border-bottom: 0; }
.rsv.cxl { opacity: .55; } .rsv.cxl .nm { text-decoration: line-through; }
.rt b { font-family: var(--font-num); font-size: 20px; font-weight: 500; display: block; line-height: 1.1; } .rt small { font-size: 11px; color: var(--muted); }
.rn { font-weight: 500; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rm { font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.tag { font-size: 10px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); font-weight: 500; text-decoration: none; display: inline-block; }
.tag.hpb { background: #fde8ee; color: #c2185b; border-color: transparent; } .tag.mnm { background: #e8f1fd; color: #1d5fa8; border-color: transparent; } .tag.sa { background: #e8f6ef; color: #1f6b4a; border-color: transparent; }
.tag.st-cxl { background: var(--bad-soft); color: var(--bad); border-color: transparent; } .tag.st-chg { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.logd { padding: 8px 14px 0; font-size: 11px; }
</style>
</head>
<body>
<header><div class="wrap head">
  <div class="brand">achieve<small>予約</small></div>
  <button type="button" class="who" id="who" data-act="whoSwitch" hidden></button>
</div></header>
<main class="wrap" id="main"><div class="empty">読み込んでいます</div></main>
<nav id="nav" hidden><div class="wrap tabs" id="tabs"></div></nav>
<div id="toast" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script src="config.js"></script>
<script src="push-config.js"></script>
<script src="who.js?v=3"></script>
<script>
/* achieve 予約通知：Gmail に届いた予約メール（HPB・minimo・サロンアンサー）を一覧にして、この端末へプッシュ通知 */
const VAPID = window.ACHIEVE_VAPID || '';
const SRC = { hpb: ['HPB', 'hpb'], minimo: ['minimo', 'mnm'], sa: ['ネット予約', 'sa'] };
const ST = { new: ['新規', 'st-new'], change: ['変更', 'st-chg'], cancel: ['キャンセル', 'st-cxl'] };
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const W = ['日', '月', '火', '水', '木', '金', '土'];
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dLabel = s => { const d = new Date(s + 'T00:00:00'); return `${d.getMonth() + 1}/${d.getDate()}(${W[d.getDay()]})`; };
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }

const S = { user: undefined, rows: [], ready: false, tab: 'up', err: '', push: 'unknown' };
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

function render() {
  const m = $('main');
  $('who').hidden = !S.user || !WHO.me;
  if (S.user === undefined) { m.innerHTML = '<div class="empty">読み込んでいます</div>'; return; }
  if (!S.user) { $('nav').hidden = true; m.innerHTML = loginView(); return; }
  if (S.err) { m.innerHTML = `<div class="card"><div class="err">${esc(S.err)}</div></div>`; return; }
  const g = WHO.gate(); if (g) { $('nav').hidden = true; m.innerHTML = g; return; }
  $('who').innerHTML = WHO.bar() + ' <span class="sw">切替</span>';
  if (!WHO.isOwner()) { $('nav').hidden = true; m.innerHTML = '<div class="card"><h3>オーナー専用です</h3><div class="sub">予約通知はオーナーだけが使えます。</div></div>'; return; }
  const tabs = [['up', 'これからの予約'], ['log', '届いた順']];
  $('nav').hidden = false;
  $('tabs').style.gridTemplateColumns = `repeat(${tabs.length}, 1fr)`;
  $('tabs').innerHTML = tabs.map(([id, l]) => `<button type="button" data-act="tab" data-id="${id}" ${S.tab === id ? 'aria-current="page"' : ''}>${l}</button>`).join('');
  if (!S.ready) { m.innerHTML = pushCard() + '<div class="empty">読み込んでいます</div>'; return; }
  m.innerHTML = pushCard() + (S.tab === 'up' ? upView() : logView());
}
function loginView() {
  return `<form class="card login" id="login-form"><h3>ログイン</h3><div class="sub">在庫アプリと同じスタッフ用アカウントでログインします。</div>
    <label class="lbl">メールアドレス<input class="field" id="lg-email" type="email" autocomplete="username" required></label>
    <label class="lbl">パスワード<input class="field" id="lg-pass" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lg-err"></div><button class="btn primary" id="lg-go">ログイン</button></form>`;
}
function pushCard() {
  if (ios && !standalone()) return `<div class="note">iPhoneで通知を受け取るには、Safariの共有ボタン →「ホーム画面に追加」でこのページを追加し、ホーム画面のアイコンから開いてください。</div>`;
  if (!('Notification' in window) || !('serviceWorker' in navigator)) return `<div class="note">この端末・ブラウザはプッシュ通知に対応していません。</div>`;
  if (!VAPID) return `<div class="note">通知の設定（VAPIDキー）がまだです。</div>`;
  if (S.push === 'on') return `<div class="note ok">この端末に予約の通知が届きます。<button type="button" class="btn small" data-act="test">テスト通知</button></div>`;
  if (Notification.permission === 'denied') return `<div class="note">通知がブロックされています。iPhoneの「設定」→「通知」からこのアプリを許可してください。</div>`;
  return `<div class="note"><span>この端末で予約の通知を受け取りますか？</span><button type="button" class="btn primary small" data-act="pushOn">通知を受け取る</button></div>`;
}
function row(r) {
  const s = SRC[r.src] || [r.src, ''], st = ST[r.status] || ST.new;
  return `<div class="rsv ${r.status === 'cancel' ? 'cxl' : ''}">
    <div class="rt"><b>${esc(r.time || '')}</b>${r.minutes ? `<small>${r.minutes}分</small>` : ''}</div>
    <div class="rb"><div class="rn"><span class="nm">${esc(r.name || '')}</span><span class="tag ${s[1]}">${s[0]}</span>${r.status !== 'new' ? `<span class="tag ${st[1]}">${st[0]}</span>` : ''}</div>
      <div class="sub">${esc(r.staff || '担当なし')} ・ ${esc(r.store || '')}</div>
      <div class="rm">${esc(r.menu || '')}</div></div></div>`;
}
function upView() {
  const t = today();
  const list = S.rows.filter(r => r.date >= t).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  if (!list.length) return '<div class="empty">これからの予約通知はまだありません。</div>';
  const by = {}; list.forEach(r => (by[r.date] ||= []).push(r));
  return Object.entries(by).map(([d, arr]) => `<div class="group"><h2>${dLabel(d)}${d === t ? ' 今日' : ''}<small>${arr.filter(r => r.status !== 'cancel').length}件</small></h2><section class="card list">${arr.map(row).join('')}</section></div>`).join('');
}
function logView() {
  const list = S.rows.slice().sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 80);
  if (!list.length) return '<div class="empty">まだ届いていません。</div>';
  return `<section class="card list">${list.map(r => `<div class="logd sub">${new Date(r.at).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })} 受信 → ${r.date ? dLabel(r.date) : ''}</div>` + row(r)).join('')}</section>`;
}

/* ---- 通知の登録 ---- */
async function swReg() { return navigator.serviceWorker.register('firebase-messaging-sw.js'); }
async function pushOn() {
  const p = await Notification.requestPermission();
  if (p !== 'granted') { toast('通知が許可されませんでした'); render(); return; }
  const reg = await swReg();
  const token = await firebase.messaging().getToken({ vapidKey: VAPID, serviceWorkerRegistration: reg });
  if (!token) { toast('通知の登録に失敗しました'); return; }
  const id = (await WHO.hash('push', token)).slice(0, 32);
  await db.doc('push_tokens/' + id).set({ token, personId: WHO.me.id, name: WHO.me.name, ua: navigator.userAgent.slice(0, 120), at: Date.now() });
  try { localStorage.setItem('achieve.push', id); } catch (x) {}
  S.push = 'on'; toast('この端末で通知を受け取ります'); render();
}
async function checkPush() {
  try {
    if (!VAPID || !('Notification' in window) || Notification.permission !== 'granted') return;
    const reg = await swReg();
    const token = await firebase.messaging().getToken({ vapidKey: VAPID, serviceWorkerRegistration: reg });
    if (!token) return;
    const id = (await WHO.hash('push', token)).slice(0, 32);
    await db.doc('push_tokens/' + id).set({ token, personId: WHO.me ? WHO.me.id : '', name: WHO.me ? WHO.me.name : '', ua: navigator.userAgent.slice(0, 120), at: Date.now() }, { merge: true });
    S.push = 'on'; render();
  } catch (e) { console.warn(e); }
}

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  try {
    if (a === 'whoSwitch') { WHO.handle('whoOut', el); return; }
    if (await WHO.handle(a, el)) return;
    if (a === 'tab') { S.tab = el.dataset.id; render(); window.scrollTo(0, 0); }
    if (a === 'pushOn') await pushOn();
    if (a === 'test') { const reg = await swReg(); await reg.showNotification('テスト通知', { body: '予約が入るとこのように届きます', icon: 'reserve-icon.png' }); }
  } catch (e) { toast('エラー：' + e.message); }
});
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'login-form') return; ev.preventDefault();
  try { await firebase.auth().signInWithEmailAndPassword($('lg-email').value.trim(), $('lg-pass').value); } catch (e) { $('lg-err').textContent = 'メールアドレスかパスワードが違います'; }
});

/* アプリを開いたらバッジを消す */
async function clearBadge() {
  try { const c = await caches.open('achieve-badge'); await c.put('n', new Response('0')); } catch (x) {}
  try { if (navigator.clearAppBadge) await navigator.clearAppBadge(); } catch (x) {}
}
clearBadge();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') clearBadge(); });

let db, started = false;
function listen() {
  WHO.init(db, () => { render(); if (WHO.me && S.push !== 'on') checkPush(); });
  const since = new Date(); since.setDate(since.getDate() - 14);
  const sd = `${since.getFullYear()}-${pad(since.getMonth() + 1)}-${pad(since.getDate())}`;
  db.collection('rsv').where('date', '>=', sd).onSnapshot(s => { S.rows = s.docs.map(d => Object.assign({ id: d.id }, d.data())); S.ready = true; render(); }, e => { S.err = e.message; render(); });
}
(function init() {
  if (typeof firebaseConfig === 'undefined' || !window.firebase) { $('main').innerHTML = '<div class="empty">設定ファイル（config.js）が読み込めません。</div>'; return; }
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebase.auth().onAuthStateChanged(u => { S.user = u || null; if (u && !started) { started = true; listen(); } render(); });
})();
</script>
</body>
</html>
