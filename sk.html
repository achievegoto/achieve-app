<script>
/* achieve 成人式予約管理
   sk_entries : 予約カード（1人1件）
   sk_req     : 変更・削除の申請（承認者が承認すると反映）
   sk_settings/main : { approvers: [名簿ID...] }  ※オーナーは常に承認者 */
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const md = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return `${m}/${d}`; };
const ymd = s => { if (!s) return ''; const [y, m, d] = s.split('-').map(Number); return `${y}/${m}/${d}`; };
const reiwa = y => y >= 2019 ? `令和${y - 2018}年` : '';
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

const VENUES = ['豊川', '豊橋', '新城', '蒲郡'];
const MENUS = ['セット', '着付け', 'メイク'];
/* 予約のきっかけ・呉服屋さん */
const ROUTES = [['self', '自身の予約'], ['parent', '親の紹介'], ['gofuku', '呉服屋さんの紹介'], ['other', 'その他']];
const GOFUKU = ['カクユウ', 'アエダム', 'マキヤス'];
const routeName = v => (ROUTES.find(r => r[0] === v) || [])[1] || '';
/* 項目の定義（表示名・種類）— 区分ごとの並び順がそのまま入力・詳細・一覧表・Excelの順になる */
const SECTIONS = [
  ['基本', [['name', '名前', 'text'], ['kana', 'ふりがな', 'text'], ['year', '成人式の年', 'year'], ['menus', 'メニュー', 'menus'], ['venue', '会場', 'venue']]],
  ['予約の受付', [['reservedAt', '予約日', 'date'], ['booker', '予約を受けたスタッフ', 'staff'], ['route', '予約のきっかけ', 'route'], ['gofuku', '呉服屋さん', 'gofuku']]],
  ['連絡先', [['tel', '自宅・保護者の電話', 'tel'], ['mobile', '本人の携帯', 'tel'], ['line', 'LINEつながり', 'bool']]],
  ['お客様情報・優先度', [['birth', '生年月日', 'date'], ['school', '出身中学', 'text'], ['selfVisit', '本人のachieve来店歴', 'visit'], ['visitSince', '通い始め（いつ頃から）', 'text'], ['parentVisited', '保護者の来店歴あり', 'bool']]],
  ['前撮り・当日までの流れ', [['maedori', '前撮り', 'maedori'], ['maedoriMeet', '前撮り打合せ日', 'date'], ['maedoriDate', '前撮り日', 'date'], ['lineJul', '7月スケジュールLINE', 'bool'], ['lineAug', '8月打合せLINE', 'bool'], ['meetDate', '打合せ日', 'date'], ['tagOk', 'タブ付けOK', 'bool']]],
  ['メモ', [['memo', 'メモ', 'area']]],
];
const FIELDS = SECTIONS.flatMap(x => x[1]);
const LABEL = Object.fromEntries(FIELDS.map(f => [f[0], f[1]]));
const fmtVal = (k, v) => {
  const t = (FIELDS.find(f => f[0] === k) || [])[2];
  if (v == null || v === '' || (Array.isArray(v) && !v.length)) return '—';
  if (t === 'bool') return v ? '○' : '—';
  if (t === 'date') return ymd(v);
  if (t === 'menus') return v.join('・');
  if (t === 'maedori') return v === 'yes' ? 'する' : v === 'no' ? 'しない' : '未定';
  if (t === 'route') return routeName(v) || '—';
  if (t === 'visit') return v === 'long' ? '昔から通っている（常連）' : v === 'yes' ? 'あり' : 'なし';
  if (t === 'year') return `${v}年（${reiwa(Number(v))}）`;
  return String(v);
};
const yearFromBirth = b => { if (!b) return null; const [y, m] = b.split('-').map(Number); return m <= 3 ? y + 20 : y + 21; };
const defaultYear = () => { const d = new Date(); return d.getMonth() >= 1 ? d.getFullYear() + 1 : d.getFullYear(); };

const S = { user: undefined, ready: new Set(), entries: [], reqs: [], settings: {}, err: '', tab: 'list', view: (()=>{try{return localStorage.getItem('sk.view')||'card'}catch(e){return 'card'}})(), year: null, q: '', venue: '', filter: '', open: null, edit: null, confirm: '' };
const approvers = () => S.settings.approvers || [];
const isApprover = () => !!WHO.me && (WHO.isOwner() || approvers().includes(WHO.me.id));
/* 優先度：本人が昔から通っている＞本人来店歴あり＞保護者のみ来店歴 */
const prio = e => (e.selfVisit === 'long' ? 3 : e.selfVisit === 'yes' ? 2 : 0) + (e.parentVisited ? 1 : 0);
const prioTag = e => e.selfVisit === 'long' ? '<span class="pill pr3">★ 常連</span>' : e.selfVisit === 'yes' ? '<span class="pill pr2">来店歴あり</span>' : e.parentVisited ? '<span class="pill pr1">保護者来店</span>' : '';
const pendingOf = id => S.reqs.filter(r => r.entryId === id && r.status === 'pending');

function render() {
  const m = $('main');
  $('who').hidden = !S.user || !WHO.me;

function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const r = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('画像を読み込めませんでした')); };
    img.src = url;
  });
}
async function addPhotos(files, cat) {

      const thumb = await shrink(f, 320, .7);

      await db.doc('sk_entries/' + id).update({ photos: firebase.firestore.FieldValue.increment(1) });

    if (t === 'staff') { const names = WHO.active().map(p => p.name); return `<label class="lbl">${l}<select class="field" id="f-${k}"><option value="">未選択</option>${names.map(n => `<option ${val === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}${val && !names.includes(val) ? `<option selected>${esc(val)}</option>` : ''}</select></label>`; }
    if (t === 'route') return `<label class="lbl">${l}<select class="field" id="f-${k}" data-chg="route"><option value="">未選択</option>${ROUTES.map(([rk, rl]) => `<option value="${rk}" ${val === rk ? 'selected' : ''}>${rl}</option>`).join('')}</select></label>`;
    if (t === 'gofuku') { const other = !!val && !GOFUKU.includes(val); return `<div class="lbl" id="w-gofuku" ${v.route === 'gofuku' ? '' : 'hidden'}>${l}<select class="field" id="f-${k}" data-chg="gofukuSel"><option value="">未選択</option>${GOFUKU.map(g => `<option ${val === g ? 'selected' : ''}>${g}</option>`).join('')}<option value="__x" ${other ? 'selected' : ''}>そのほか（名前を入力）</option></select><input class="field" id="f-gofukuX" value="${other ? esc(val) : ''}" placeholder="呉服屋さんの名前" ${other ? '' : 'hidden'}></div>`; }
    if (t === 'visit') return `<label class="lbl">${l}<select class="field" id="f-${k}"><option value="">なし</option><option value="yes" ${val === 'yes' ? 'selected' : ''}>あり</option><option value="long" ${val === 'long' ? 'selected' : ''}>昔から通っている（常連）</option></select></label>`;
    if (t === 'maedori') return `<label class="lbl">${l}<select class="field" id="f-${k}"><option value="">未定</option><option value="yes" ${val === 'yes' ? 'selected' : ''}>する</option><option value="no" ${val === 'no' ? 'selected' : ''}>しない</option></select></label>`;
    if (t === 'bool') return `<label class="chk big"><input type="checkbox" id="f-${k}" ${val ? 'checked' : ''}>${l}</label>`;
    if (t === 'year') return `<label class="lbl">${l}<input class="field" id="f-${k}" type="number" inputmode="numeric" value="${esc(val ?? '')}"></label>`;
    if (t === 'area') return `<label class="lbl">${l}<textarea class="field" id="f-${k}">${esc(val ?? '')}</textarea></label>`;
    return `<label class="lbl">${l}<input class="field" id="f-${k}" type="${t === 'date' ? 'date' : t === 'tel' ? 'tel' : 'text'}" ${t === 'tel' ? 'inputmode="tel"' : ''} value="${esc(val ?? '')}" ${k === 'birth' ? 'data-chg="birth"' : ''}></label>`;
  };
  const grp = ([title, fs]) => `<div class="fgrp"><div class="sec-t">${title}</div><div class="fgrid">${fs.map(fld).join('')}</div></div>`;
  const capY = Number((S.settings.cap || {})[v.year]) || 0, nY = S.entries.filter(x => Number(x.year) === Number(v.year)).length;
  const note = (e && !isApprover() ? '<div class="note">変更は承認者の承認後に反映されます。</div>' : '') + (!e && capY && nY >= capY ? `<div class="note">${v.year}年は最大${capY}名に達しています（満員）。</div>` : '');
  return `<section class="card"><div class="card-head"><h3>${e ? '予約を変更' : '新しい予約'}</h3>${e ? '<button type="button" class="btn small" data-act="cancelEdit">やめる</button>' : ''}</div>${note}
    ${SECTIONS.map(grp).join('')}
    <div class="err" id="f-err"></div>
    <div class="actions"><button type="button" class="btn primary" data-act="${e ? 'saveEdit' : 'saveNew'}">${e ? (isApprover() ? '変更を保存' : '変更を申請') : '登録する'}</button></div></section>`;
}
function readForm() {
  const o = {};
  for (const [k, , t] of FIELDS) {
    if (t === 'menus') { o.menus = [...document.querySelectorAll('input[name="f-menus"]:checked')].map(x => x.value); continue; }
    const el = $('f-' + k); if (!el) continue;
    if (t === 'gofuku') { o[k] = el.value === '__x' ? $('f-gofukuX').value.trim() : el.value; continue; }
    if (t === 'bool') o[k] = el.checked;
    else if (t === 'year') o[k] = Number(el.value) || null;
    else o[k] = el.value.trim();
  }
  if (o.route !== 'gofuku') o.gofuku = '';
  return o;
}

/* ---- 承認 ---- */
function diffList(before, after) {
  const keys = FIELDS.map(f => f[0]).filter(k => JSON.stringify(before[k] ?? '') !== JSON.stringify(after[k] ?? ''));
  return keys.map(k => `<div class="df"><span class="dk">${LABEL[k]}</span><span class="dv old">${esc(fmtVal(k, before[k]))}</span>→<span class="dv new">${esc(fmtVal(k, after[k]))}</span></div>`).join('');
}
function reqView() {
  const pend = S.reqs.filter(r => r.status === 'pending').sort((a, b) => a.at - b.at);
  const done = S.reqs.filter(r => r.status !== 'pending').sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 20);
  const can = isApprover();
  const card = r => {
    const e = S.entries.find(x => x.id === r.entryId) || r.before || {};
    return `<section class="card"><div class="card-head"><h3>${esc(e.name || r.before?.name || '')}</h3><span class="pill ${r.type === 'delete' ? 'p-late' : 'p-requested'}">${r.type === 'delete' ? '削除の申請' : '変更の申請'}</span></div>
      <div class="sub">${esc(r.byName || '')} ・ ${new Date(r.at).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
      ${r.type === 'delete' ? '<div class="sub">この予約カードを削除します。</div>' : `<div class="diff">${diffList(r.before || {}, r.after || {}) || '<div class="sub">変更点なし</div>'}</div>`}
      ${can ? `<div class="actions"><button type="button" class="btn good" data-act="approve" data-id="${r.id}">承認する</button><button type="button" class="btn" data-act="reject" data-id="${r.id}">却下</button></div>`
        : (WHO.me && r.by === WHO.me.id ? `<div class="actions"><button type="button" class="btn" data-act="withdraw" data-id="${r.id}">申請を取り下げる</button></div>` : '')}</section>`;
  };
  const appr = WHO.isOwner() ? `<section class="card"><h3>承認者</h3><div class="sub">変更・削除を承認できる人です（オーナーは常に承認者）。</div>
    <div class="chips">${WHO.active().filter(p => p.role !== 'owner').map(p => `<button type="button" class="chip" data-act="toggleAppr" data-id="${p.id}" aria-pressed="${approvers().includes(p.id)}">${esc(p.name)}</button>`).join('')}</div></section>` : '';
  return `<div class="note info">${can ? 'あなたは承認者です。変更はすぐ反映され、ほかの人の申請を承認できます。' : '予約の変更・削除は、承認者が承認すると反映されます。'}</div>`
    + (pend.length ? pend.map(card).join('') : '<div class="card"><div class="empty">承認待ちの申請はありません</div></div>')
    + appr
    + (done.length ? `<div class="group"><h2>これまでの申請</h2><div class="list">${done.map(r => `<div class="row"><div><div class="name">${esc(r.before?.name || r.after?.name || '')}</div><div class="sub"><span>${r.type === 'delete' ? '削除' : '変更'}</span><span>${esc(r.byName || '')}</span></div></div><span class="pill ${r.status === 'approved' ? 'p-passed' : 'p-none'}">${r.status === 'approved' ? '承認' : r.status === 'rejected' ? '却下' : '取下げ'}${r.doneByName ? '・' + esc(r.doneByName) : ''}</span></div>`).join('')}</div></div>` : '');
}

/* ---- 操作 ---- */
const me = () => ({ id: WHO.me.id, name: WHO.me.name });
const clean = o => { const r = {}; for (const [k, v] of Object.entries(o)) if (v !== undefined) r[k] = v; return r; };
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'close' && ev.target.closest('[data-stop]') && !ev.target.closest('button[data-act="close"]')) return;
  const a = el.dataset.act, id = el.dataset.id;
  try {
    if (a === 'whoSwitch') { WHO.handle('whoOut', el); return; }
    if (await WHO.handle(a, el)) return;
    switch (a) {
      case 'tab': S.tab = id; S.edit = null; S.open = null; render(); window.scrollTo(0, 0); break;
      case 'venue': S.venue = id; render(); break;
      case 'sort': S.sort = id; render(); break;
      case 'view': S.view = id; try { localStorage.setItem('sk.view', id); } catch (x) {} render(); break;
      case 'xlsx': if (isApprover()) await exportXlsx(); break;
      case 'open': S.open = id; S.confirm = ''; S.viewPhoto = null; renderSheet(); break;
      case 'ncat': if ($('n-text')) $('n-text').value = ''; S.noteCat = id; S.noteEdit = null; S.confirm = ''; renderSheet(); break;
      case 'noteAdd': {
        const t = $('n-text').value.trim(); if (!t) { toast('内容を入れてください'); break; }
        const m = me(), eid = S.open;
        await db.collection('sk_notes').add({ entryId: eid, cat: S.noteCat || 'hair', text: t, date: $('n-date').value || today(), at: Date.now(), by: m.id, byName: m.name });
        await db.doc('sk_entries/' + eid).update({ notes: firebase.firestore.FieldValue.increment(1) }).catch(() => {});
        $('n-text').value = ''; toast('記録しました'); break;
      }
      case 'noteEdit': S.noteEdit = id; S.confirm = ''; renderSheet(); break;
      case 'noteEditCancel': S.noteEdit = null; renderSheet(); break;
      case 'noteSave': {
        const n = (S.notes || []).find(x => x.id === id); if (!n || !canDelPhoto(n)) break;
        const t = $('n-edit').value.trim(); if (!t) { toast('内容を入れてください'); break; }
        await db.doc('sk_notes/' + id).update({ text: t, date: $('n-date').value || n.date || '', editedAt: Date.now() });
        S.noteEdit = null; toast('保存しました'); renderSheet(); break;
      }
      case 'noteDel': {
        const n = (S.notes || []).find(x => x.id === id); if (!n || !canDelPhoto(n)) break;
        if (S.confirm !== 'nt-' + id) { S.confirm = 'nt-' + id; renderSheet(); break; }
        await db.doc('sk_notes/' + id).delete();
        await db.doc('sk_entries/' + n.entryId).update({ notes: firebase.firestore.FieldValue.increment(-1) }).catch(() => {});
        S.confirm = ''; toast('削除しました'); break;
      }
      case 'pv': S.viewPhoto = id; S.confirm = ''; renderSheet(); break;
      case 'pvClose': S.viewPhoto = null; S.confirm = ''; renderSheet(); break;
      case 'pvDel': {
        const p = (S.photos || []).find(x => x.id === id); if (!p || !canDelPhoto(p)) break;
        if (S.confirm !== 'ph-' + id) { S.confirm = 'ph-' + id; renderSheet(); break; }
        await db.doc('sk_photos/' + id).delete();
        await db.doc('sk_entries/' + p.entryId).update({ photos: firebase.firestore.FieldValue.increment(-1) }).catch(() => {});
        S.viewPhoto = null; S.confirm = ''; toast('写真を削除しました'); renderSheet(); break;
      }
      case 'close': S.open = null; S.confirm = ''; renderSheet(); break;
      case 'edit': S.edit = Object.assign({}, S.entries.find(x => x.id === id)); S.open = null; S.tab = 'list'; render(); window.scrollTo(0, 0); break;
      case 'cancelEdit': S.edit = null; render(); break;
      case 'saveNew': {
        const o = readForm(); if (!o.name) { $('f-err').textContent = '名前を入れてください'; break; }
        if (!o.year) o.year = yearFromBirth(o.birth) || defaultYear();
        const m = me(); await db.collection('sk_entries').add(clean(Object.assign(o, { createdAt: Date.now(), createdBy: m.id, createdByName: m.name })));
        S.year = o.year; S.tab = 'list'; toast('登録しました'); render(); window.scrollTo(0, 0); break;
      }
      case 'saveEdit': {
        const o = readForm(); if (!o.name) { $('f-err').textContent = '名前を入れてください'; break; }
        const e = S.entries.find(x => x.id === S.edit.id), m = me();
        const before = {}; FIELDS.forEach(([k]) => before[k] = e[k] ?? null);
        if (!diffList(before, o)) { toast('変更はありません'); S.edit = null; render(); break; }
        if (isApprover()) {
          await db.doc('sk_entries/' + e.id).update(clean(Object.assign(o, { updatedAt: Date.now(), updatedBy: m.id, updatedByName: m.name })));
          await db.collection('sk_req').add({ entryId: e.id, type: 'edit', before, after: o, by: m.id, byName: m.name, at: Date.now(), status: 'approved', doneBy: m.id, doneByName: m.name, doneAt: Date.now(), direct: true });
          toast('変更しました');
        } else {
          await db.collection('sk_req').add({ entryId: e.id, type: 'edit', before, after: o, by: m.id, byName: m.name, at: Date.now(), status: 'pending' });
          toast('変更を申請しました（承認後に反映）');
        }
        S.edit = null; render(); break;
      }
      case 'del': {
        if (S.confirm !== 'del-' + id) { S.confirm = 'del-' + id; renderSheet(); break; }
        const e = S.entries.find(x => x.id === id), m = me();
        const before = {}; FIELDS.forEach(([k]) => before[k] = e[k] ?? null);
        if (isApprover()) {
          await db.collection('sk_req').add({ entryId: id, type: 'delete', before, by: m.id, byName: m.name, at: Date.now(), status: 'approved', doneBy: m.id, doneByName: m.name, doneAt: Date.now(), direct: true });
          await db.doc('sk_entries/' + id).delete(); delPhotosOf(id); toast('削除しました');
        } else { await db.collection('sk_req').add({ entryId: id, type: 'delete', before, by: m.id, byName: m.name, at: Date.now(), status: 'pending' }); toast('削除を申請しました'); }
        S.open = null; S.confirm = ''; renderSheet(); break;
      }
      case 'approve': case 'reject': {
        if (!isApprover()) break;
        const r = S.reqs.find(x => x.id === id), m = me();
        if (a === 'approve') {
          if (r.type === 'delete') { await db.doc('sk_entries/' + r.entryId).delete().catch(() => {}); delPhotosOf(r.entryId); }
          else await db.doc('sk_entries/' + r.entryId).update(clean(Object.assign({}, r.after, { updatedAt: Date.now(), updatedBy: r.by, updatedByName: r.byName })));
        }
        await db.doc('sk_req/' + id).update({ status: a === 'approve' ? 'approved' : 'rejected', doneBy: m.id, doneByName: m.name, doneAt: Date.now() });
        toast(a === 'approve' ? '承認して反映しました' : '却下しました'); break;
      }
      case 'withdraw': await db.doc('sk_req/' + id).update({ status: 'withdrawn', doneAt: Date.now() }); toast('取り下げました'); break;
      case 'capEdit': if (WHO.isOwner()) { S.capEdit = !S.capEdit; render(); } break;
      case 'capSave': {
        if (!WHO.isOwner()) break;
        const n = Math.max(0, Math.floor(Number($('cap-in').value) || 0)), y = S.year || defaultYear();
        await db.doc('sk_settings/main').set({ cap: { [y]: n || firebase.firestore.FieldValue.delete() } }, { merge: true });
        S.capEdit = false; toast(n ? `最大${n}名にしました` : '最大人数を解除しました'); break;
      }
      case 'toggleAppr': {
        if (!WHO.isOwner()) break;
        const list = approvers().slice(), i = list.indexOf(id); i >= 0 ? list.splice(i, 1) : list.push(id);
        await db.doc('sk_settings/main').set({ approvers: list }, { merge: true }); break;
      }
    }
  } catch (e) { toast('エラー：' + e.message); }
});
document.addEventListener('input', ev => {
  if (ev.target.dataset.inp === 'q') { S.q = ev.target.value; const pos = ev.target.selectionStart; render(); const q = $('q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
});
document.addEventListener('change', ev => {
  if (ev.target.dataset.chg === 'photo') { const fs = [...ev.target.files], c = ev.target.dataset.cat; ev.target.value = ''; addPhotos(fs, c); return; }
  if (ev.target.dataset.chg === 'filter') { S.filter = ev.target.value; render(); }
  if (ev.target.dataset.chg === 'gofukuSel') { const x = $('f-gofukuX'); if (x) x.hidden = ev.target.value !== '__x'; }
  if (ev.target.dataset.chg === 'route') { const w = $('w-gofuku'); if (w) w.hidden = ev.target.value !== 'gofuku'; }
  if (ev.target.dataset.chg === 'year') { S.year = Number(ev.target.value); render(); }
  if (ev.target.dataset.chg === 'birth') { const y = yearFromBirth(ev.target.value), yf = $('f-year'); if (y && yf && !yf.dataset.touched) yf.value = y; }
  if (ev.target.id === 'f-year') ev.target.dataset.touched = '1';
});
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'login-form') return; ev.preventDefault();
  try { await firebase.auth().signInWithEmailAndPassword($('lg-email').value.trim(), $('lg-pass').value); } catch (e) { $('lg-err').textContent = 'メールアドレスかパスワードが違います'; }
});

let db, started = false;
const typing = () => { const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.id !== 'q'; };
let pendT = null;
const soft = () => { if (typing() || S.tab === 'new' || S.edit) { if (!pendT) pendT = setInterval(() => { if (!typing() && S.tab !== 'new' && !S.edit) { clearInterval(pendT); pendT = null; render(); } }, 1000); return; } render(); };
function listen() {
  WHO.init(db, soft);
  const fail = e => { S.err = e.message; render(); };
  db.collection('sk_entries').onSnapshot(s => { S.entries = s.docs.map(d => Object.assign({ id: d.id }, d.data())); S.ready.add('e'); soft(); }, fail);
  db.collection('sk_req').orderBy('at', 'desc').limit(300).onSnapshot(s => { S.reqs = s.docs.map(d => Object.assign({ id: d.id }, d.data())); S.ready.add('r'); soft(); }, fail);
  db.doc('sk_settings/main').onSnapshot(d => { S.settings = d.exists ? d.data() : {}; S.ready.add('s'); soft(); }, fail);
}
(function init() {
  if (typeof firebaseConfig === 'undefined' || !window.firebase) { $('main').innerHTML = '<div class="empty">設定ファイル（config.js）が読み込めません。</div>'; return; }
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebase.auth().onAuthStateChanged(u => { S.user = u || null; if (u && !started) { started = true; listen(); } render(); });
})();
</script>
</body>
</html>
