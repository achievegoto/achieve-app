<style>
/* Layout: one narrow operating column, store switch pinned on top, four tabs pinned at the thumb. */
:root {
  --bg: #f4f4f7; --surface: #ffffff; --line: #e2e1e9; --ink: #1d1b26; --muted: #6a6778;
  --accent: #54347e; --accent-ink: #ffffff; --accent-soft: #eee8f6;
  --bad: #b3261e; --bad-soft: #fbe9e7; --warn: #8a5a00; --warn-soft: #fbf0d9; --good: #1f6b4a; --good-soft: #e3f2ea;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-num: "Jost", "IBM Plex Sans JP", "Hiragino Sans", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15141b; --surface: #1f1d28; --line: #33303f; --ink: #efedf5; --muted: #a29eb2;
  --accent: #c4a6ea; --accent-ink: #1d1529; --accent-soft: #2f2740;
  --bad: #ff9b90; --bad-soft: #3f2220; --warn: #eec26e; --warn-soft: #3a2e16; --good: #7fd3ab; --good-soft: #1b3429;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15141b; --surface: #1f1d28; --line: #33303f; --ink: #efedf5; --muted: #a29eb2;
  --accent: #c4a6ea; --accent-ink: #1d1529; --accent-soft: #2f2740;
  --bad: #ff9b90; --bad-soft: #3f2220; --warn: #eec26e; --warn-soft: #3a2e16; --good: #7fd3ab; --good-soft: #1b3429;
  color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.head { display: flex; flex-direction: column; gap: 10px; padding-block: 12px; }
.brand { font-family: var(--font-num); font-size: 20px; letter-spacing: .08em; display: flex; align-items: baseline; gap: 10px; }
.brand small { font-family: var(--font-body); font-size: 12px; letter-spacing: .04em; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; background: var(--bg); padding: 3px; border-radius: 10px; }
.seg button { border: 0; background: transparent; padding: 8px 2px; border-radius: 8px; font-family: var(--font-num); font-size: 13px; line-height: 1.25; color: var(--muted); min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
main { padding-block: 16px 104px; display: flex; flex-direction: column; gap: 16px; }
.summary { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--muted); }
.summary b { font-family: var(--font-num); font-size: 22px; font-weight: 500; color: var(--ink); margin-left: 6px; font-variant-numeric: tabular-nums; }
.summary b.alert { color: var(--bad); }
.tools { display: flex; flex-direction: column; gap: 8px; }
.field, select.field, textarea.field { width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.sub { padding: 8px; border-radius: 10px; background: var(--accent-soft); }
.chip .caret { margin-left: 4px; font-size: 10px; }

.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.group { display: flex; flex-direction: column; gap: 6px; }
.group h2 { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin: 0; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 11px 14px; }
.row + .row { border-top: 1px solid var(--line); }
.scan-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.scan-row { grid-template-columns: minmax(0, 1fr) 84px; }
.scan-row select.field { margin-top: 4px; }
.scan-row .qty { text-align: center; }
.jan-line { display: flex; gap: 8px; align-items: center; }
.jan-line .field { flex: 1; min-width: 0; }
.jan-line .btn { flex: none; white-space: nowrap; }
.scan-busy { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.scan-busy::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.row.has-grip { grid-template-columns: auto minmax(0, 1fr) auto; }
.grip { touch-action: none; cursor: grab; border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 8px 4px; margin: -8px 0 -8px -6px; letter-spacing: -3px; }
.row.dragging { opacity: .45; }
.row.drop-before { box-shadow: inset 0 3px 0 var(--accent); }
.row.drop-after { box-shadow: inset 0 -3px 0 var(--accent); }
body.is-dragging { user-select: none; -webkit-user-select: none; }
.name { font-weight: 500; overflow-wrap: anywhere; }
.sub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.pill.short { background: var(--bad-soft); color: var(--bad); }
.pill.ordering { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.sample { background: var(--accent-soft); color: var(--accent); }
.stepper { display: flex; align-items: center; gap: 2px; }
.lockbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; text-align: left; }
.lockbar b { font-size: 14px; color: var(--ink); }
.lockbar .sw { flex: none; padding: 5px 12px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 12px; }
.lockbar.open { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
.lockbar.open b { color: var(--warn); }
.lockbar.open .sw { background: var(--warn); color: var(--surface); }
.pinbar { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; }
.pinbar b { color: var(--ink); font-size: 14px; }
.pinbar .field { width: 8.5em; flex: none; }
.pinbar.open { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
.pinbar.open b { color: var(--warn); }
.stepper.locked button { opacity: .3; }
.stepper.locked input { color: var(--ink); opacity: 1; -webkit-text-fill-color: var(--ink); }
.stepper button { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; font-size: 19px; line-height: 1; }
.stepper input { width: 52px; height: 40px; text-align: center; border: 0; background: transparent; font-family: var(--font-num); font-size: 20px; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.card h3 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.amount { font-family: var(--font-num); font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lines .row { padding-inline: 0; }
.msg { font-size: 13px; line-height: 1.7; min-height: 180px; resize: vertical; background: var(--bg); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 8px; font-weight: 500; }
a.btn { display: inline-block; text-decoration: none; color: var(--ink); text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }
.note { padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 84px; gap: 10px; align-items: center; font-size: 13px; }
.bar-row span:first-child { font-family: var(--font-num); font-size: 14px; }
.bar-track { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); }
.bar-row .amt { text-align: right; font-family: var(--font-num); font-size: 15px; font-variant-numeric: tabular-nums; }
.month-nav { display: flex; align-items: center; gap: 8px; }
.sum-wrap { overflow-x: auto; }
.sum { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sum th, .sum td { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.sum th:first-child { text-align: left; }
.sum tr:first-child th { font-size: 12px; color: var(--muted); font-weight: 500; }
.sum .tot, .sum .foot td, .sum .foot th { font-weight: 700; }
.sum .foot td, .sum .foot th { border-bottom: 0; }
form { display: flex; flex-direction: column; gap: 12px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
label .field { font-size: 15px; color: var(--ink); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.levels { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 13px; }
.levels .lv-h { font-size: 12px; color: var(--muted); }
.levels .lv-s { font-family: var(--font-num); font-size: 15px; }
.err { color: var(--bad); font-size: 13px; }
.dealer-row { display: flex; gap: 8px; align-items: center; padding: 8px 14px; }
.dealer-row + .dealer-row { border-top: 1px solid var(--line); }
.dealer-row .field { flex: 1; }
nav { position: fixed; inset: auto 0 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { position: relative; border: 0; background: transparent; padding: 15px 0; font-size: 14px; color: var(--muted); }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; box-shadow: inset 0 2px 0 var(--accent); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--bad); color: var(--bg); font-family: var(--font-num); font-size: 12px; line-height: 18px; font-weight: 500; }
#toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; max-width: calc(100vw - 32px); }
@media (prefers-reduced-motion: no-preference) { .bar-fill { transition: width .25s ease; } }
#live { position: fixed; left: 0; right: 0; top: 0; height: 36vh; background: #000; z-index: 60; }
#live video { width: 100%; height: 100%; object-fit: cover; display: block; }
#live .live-guide { position: absolute; left: 10%; right: 10%; top: 36%; height: 28%; border: 3px solid rgba(255,255,255,.85); border-radius: 10px; pointer-events: none; transition: border-color .15s; }
#live.hit .live-guide { border-color: #4ade80; }
#live .live-msg { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px; background: linear-gradient(transparent, rgba(0,0,0,.75)); color: #fff; font-size: 14px; }
#live .live-close { position: absolute; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); }
body.is-live { padding-top: 36vh; }
.login { max-width: 420px; margin: 24px auto; display: grid; gap: 12px; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.who { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 5px 12px; font-size: 13px; white-space: nowrap; }
.who small { font-size: 10px; color: var(--muted); margin-left: 4px; } .who .sw { font-size: 11px; color: var(--accent); margin-left: 6px; }
</style>

<header><div class="wrap head">
  <div class="brand-row"><div class="brand">achieve Group <small>在庫・発注</small></div><button type="button" class="who" id="who" data-act="whoSwitch" hidden></button></div>
  <div class="seg" id="stores" role="group" aria-label="店舗"></div>
</div></header>
<main class="wrap" id="main"><div class="empty">在庫データを読み込んでいます</div></main>
<nav><div class="wrap tabs" id="tabs"></div></nav>
<div id="toast" role="status" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="who.js?v=2"></script>
<script>
const STORES = [
  { id: 'hair', short: 'hair design', full: 'achieve hair design' },
  { id: 'liss', short: 'Liss', full: 'achieve Liss' },
  { id: 'till', short: 'till', full: 'achieve till Smart Salon' },
  { id: 'tonari', short: 'TONARI在庫', full: 'TONARI在庫' },
];
const TABS = [['stock', '在庫'], ['order', '発注'], ['history', '履歴'], ['items', '商品']];
const S = {
  db: null, items: [], dealers: [], stock: {}, orders: [], ready: new Set(), readOnly: false, slow: false, failed: '',
  store: 'hair', tab: 'stock', q: '', cat: '', onlyShort: false,
  draft: {}, editing: null, formErr: '', confirm: '', dirty: false,
};
try { const v = localStorage.getItem('achieve-store'); if (STORES.some(s => s.id === v)) S.store = v; } catch (e) {}

const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const yenS = n => n ? Math.round(n).toLocaleString('ja-JP') : '-';
const num = (v, d = 0) => { const n = Number(v); return Number.isFinite(n) && n >= 0 ? n : d; };
const storeOf = id => STORES.find(s => s.id === id) || { id, short: id, full: id };
const dealerOf = id => S.dealers.find(d => d.id === id);
const dateStr = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };

let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---- 計算 ---- */
const qtyOf = (store, id) => S.stock[store + '_' + id] ?? 0;
const stockValue = store => S.items.reduce((a, it) => a + qtyOf(store, it.id) * num(it.price), 0);
function onOrder(store, id) {
  let n = 0;
  for (const o of S.orders) if (o.store === store && o.status === 'ordered')
    for (const l of o.lines || []) if (l.itemId === id) n += l.qty;
  return n;
}
const isUnset = (it, store) => it.min?.[store] === undefined && it.par?.[store] === undefined;
const carried = (it, store) => isUnset(it, store) || num(it.min?.[store]) > 0 || num(it.par?.[store]) > 0;
function statusOf(it, store) {
  if (isUnset(it, store)) return 'unset';
  const q = qtyOf(store, it.id), oo = onOrder(store, it.id), min = num(it.min?.[store]);
  if (q + oo <= min) return 'short';
  if (q <= min && oo > 0) return 'ordering';
  return 'ok';
}
function needOf(it, store) {
  if (!carried(it, store) || statusOf(it, store) !== 'short') return 0;
  return Math.max(num(it.par?.[store]) - qtyOf(store, it.id) - onOrder(store, it.id), 1);
}
const shortItems = store => S.items.filter(it => carried(it, store) && needOf(it, store) > 0);
function monthTotal(store) {
  const n = new Date();
  return S.orders.filter(o => { const d = new Date(o.orderedAt); return (!store || o.store === store) && d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth(); })
    .reduce((a, o) => a + num(o.total), 0);
}
const draftKey = did => S.store + ':' + did;
function linesFor(did) {
  const draft = S.draft[draftKey(did)] || {};
  const rows = [];
  for (const it of S.items) {
    if ((it.dealerId || '') !== did) continue;
    const need = needOf(it, S.store);
    const has = Object.prototype.hasOwnProperty.call(draft, it.id);
    if (need > 0 || has) rows.push({ it, qty: has ? num(draft[it.id]) : need });
  }
  return rows;
}
const isGoto = d => !!d && !d.url && (d.id === 'other-goto' || /後藤/.test(d.name));
const gotoIds = () => S.dealers.filter(isGoto).map(d => d.id).filter(did => linesFor(did).some(r => r.qty > 0));
function gotoText() {
  const st = storeOf(S.store);
  const parts = gotoIds().map(did => `【${dealerOf(did).name.replace(/[（(]後藤[）)]/g, '').trim()}】\n` + linesFor(did).filter(r => r.qty > 0).map(r => `・${r.it.name} × ${r.qty}${r.it.unit || ''}`).join('\n'));
  return `後藤さん\n発注お願いします。\n${st.full}\n\n${parts.join('\n\n')}`;
}
function gotoCard() {
  const g = gotoIds(); if (g.length < 2) return '';
  const total = g.reduce((a, did) => a + linesFor(did).filter(r => r.qty > 0).reduce((b, r) => b + r.qty * num(r.it.price), 0), 0);
  return `<section class="card">
    <div class="card-head"><h3>後藤さん宛て（まとめて）</h3><span class="amount">${yen(total)}</span></div>
    <div class="sub">${g.map(did => esc(dealerOf(did).name)).join('・')} の ${g.length} 件を1つの文章にしています。下のカードで数量を変えると、ここにも反映されます。</div>
    <textarea class="field msg" id="msg-__goto" readonly aria-label="後藤さん宛てのまとめた発注文">${esc(gotoText())}</textarea>
    <div class="actions">
      <button type="button" class="btn primary" id="copy-__goto" data-act="copy" data-did="__goto">まとめてコピー</button>
      <button type="button" class="btn" id="done-__goto" data-act="placedGoto" ${S.readOnly ? 'disabled' : ''}>LINEで送ったので全部発注済みにする</button>
    </div></section>`;
}
function lineText(did) {
  const d = dealerOf(did), st = storeOf(S.store);
  const body = linesFor(did).filter(r => r.qty > 0).map(r => `・${r.it.name} × ${r.qty}${r.it.unit || ''}`).join('\n');
  if (d && (d.id === 'other-goto' || /後藤/.test(d.name))) return `後藤さん\n発注お願いします。\n${st.full}\n\n${body}`;
  return `${d ? d.name : ''} ご担当者様\nいつもお世話になっております。\n${st.full}です。\n下記の発注をお願いいたします。\n\n${body}\n\n納品先：${st.full}\n納期が分かりましたらご連絡ください。\nよろしくお願いいたします。`;
}

/* ---- 保存 ---- */
function fail(e) {
  if (e && e.code === 'invalid_argument') { S.readOnly = true; render(); toast('この画面では変更を保存できません'); return; }
  if (e && e.code === 'quota_exceeded') { toast('保存容量がいっぱいです。古いデータを削除してください'); return; }
  toast('保存できませんでした。通信を確認してもう一度操作してください');
}
const pending = new Map();
function setQty(store, id, qty) {
  if (S.readOnly || !S.db) return;
  const key = store + '_' + id;
  S.stock[key] = Math.max(0, Math.round(qty));
  const p = pending.get(key) || { chain: Promise.resolve() };
  clearTimeout(p.timer);

  const sc = S.scan;
  let r = sc.rows.find(x => x.id === id);
  if (r) r.qty = num(r.qty) + n; else { r = { jan: '', id, qty: n, known: true }; sc.rows.unshift(r); }
  return r;
}
async function runBar(file) {
  const sc = S.scan; if (!sc || sc.kind !== 'bar') return;
  sc.reading = true; sc.err = ''; barDiag = ''; render();
  try {
    let got = [], raw = [];
    if (S.barMany !== 'many') {
      const codes = await decodeLocal(file);
      got = codes.map(c => ({ jan: c.replace(/\D/g, ''), qty: 1, id: '' }));
    }
    /* 端末で読めなかったとき・未登録のバーコードのときは、AIで番号と商品名を読む */
    if (!got.length || got.some(g => !itemByJan(g.jan))) {
      if (got.length) sc.guessing = true;
      render();
      let ai = { codes: [], raw: [] };
      try { ai = await aiBarcodes(file); } catch (e) { if (!got.length) throw e; }
      raw = ai.raw;
      if (!got.length) got = S.barMany === 'many' ? ai.codes : ai.codes.slice(0, 3).map(g => ({ ...g, qty: 1 }));
      else got.forEach(g => {
        const hit = ai.codes.find(a => a.jan && janKey(a.jan) === janKey(g.jan)) || (got.length === 1 && ai.codes.length === 1 ? ai.codes[0] : null);
        if (hit) g.id = hit.id || '';
      });
    }
    if (!got.length) {
      sc.err = 'バーコードが読めませんでした。バーコードに5〜10cmまで近づけて、ピントが合ってから撮ってください。'
        + (raw.length ? '（AIが読んだ数字：' + raw.join('、') + '）' : '') + (barDiag ? '［' + barDiag + '］' : '');
    } else {
      const names = got.map(g => {
        const r = g.jan ? addJan(g.jan, g.qty, g.id) : sc.mode === 'link' ? { id: g.id } : addItemRow(g.id, g.qty);
        const it = r.id && S.items.find(x => x.id === r.id);
        if (sc.mode === 'link') return g.jan ? (it ? it.name : '未登録 ' + g.jan) : (it ? it.name : '') + '（バーコードの数字が読めず）';
        return (it ? it.name : '未登録 ' + g.jan) + (g.qty > 1 ? ' ×' + g.qty : ' +1') + (g.jan ? '' : '（商品名から判定）');
      });
      sc.last = names.join('、');
    }
  } catch (e) { sc.err = (e && e.message) || 'バーコードを読めませんでした'; }
  sc.reading = false; sc.guessing = false; render();
}

async function janFromPhoto(file) {
  const btn = $('f-jan-cam'); if (btn) { btn.disabled = true; btn.textContent = '読み取り中…'; }
  try {
    let codes = await decodeLocal(file), raw = [];
    if (!codes.length) { const ai = await aiBarcodes(file); codes = ai.codes.map(g => g.jan).filter(Boolean); raw = ai.raw; }
    codes = codes.map(c => c.replace(/\D/g, '')).filter(Boolean);
    if (!codes.length) { toast('バーコードが読めませんでした。近づいて撮り直してください' + (raw.length ? '（読めた数字：' + raw.join('、') + '）' : '')); return; }
    const mine = c => { const it = itemByJan(c); return !it || (S.editing && it.id === S.editing.id); };
    const other = codes.filter(c => !mine(c)).map(itemByJan)[0];
    codes = codes.filter(mine);
    if (!codes.length) { toast(`このバーコードは「${other.name}」に登録済みです`); return; }
    const el = $('f-jan'); if (!el) return;
    const cur = el.value.split(',').map(x => x.trim()).filter(Boolean);
    codes.forEach(c => { if (!cur.some(x => janKey(x) === janKey(c))) cur.push(c); });
    el.value = cur.join(','); if (S.editing) S.editing.jan = el.value; toast('JANコードを入れました。保存を押してください');
  } catch (e) { toast((e && e.message) || '読み取れませんでした'); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '📷 撮って入れる'; } }
}

function groupOf(line) {

function sumTable(rows, t) {

function catOptions(cats, cur) {

function bumpDraft(did, id, value) {

function draftValue(did, id) {

async function markPlaced(did, quiet) {

  const d = dealerOf(did);
  const lines = active.map(r => ({ itemId: r.it.id, name: r.it.name, unit: r.it.unit || '', qty: r.qty, price: num(r.it.price) }));
  try {
    await S.db.collection('orders').doc().set({ store: S.store, dealerId: did, dealerName: d.name, lines, total: lines.reduce((a, l) => a + l.qty * l.price, 0), status: 'ordered', orderedAt: Date.now() });

const receiving = new Set();

  receiving.add(id);

    await S.db.doc('orders/' + id).update({ status: 'received', receivedAt: Date.now() });

      const key = o.store + '_' + l.itemId, next = (S.stock[key] ?? 0) + l.qty;

function clearDrop() { document.querySelectorAll('.drop-before,.drop-after').forEach(e => e.classList.remove('drop-before', 'drop-after')); }
document.addEventListener('pointerdown', ev => {
  const g = ev.target.closest('[data-grip]'); if (!g || !canEdit()) return;
  ev.preventDefault();

  S.drag = { id: g.dataset.grip, row, list, target: null, where: '', y: ev.clientY };

document.addEventListener('pointermove', ev => {
  const d = S.drag; if (!d) return;
  ev.preventDefault(); d.y = ev.clientY;
  if (ev.clientY < 70) window.scrollBy(0, -12); else if (ev.clientY > window.innerHeight - 90) window.scrollBy(0, 12);
  const rows = [...d.list.children].filter(r => r.dataset.row && r !== d.row);
  let t = null, where = '';
  for (const r of rows) { const b = r.getBoundingClientRect(); if (ev.clientY < b.top + b.height / 2) { t = r; where = 'before'; break; } }
  if (!t && rows.length) { t = rows[rows.length - 1]; where = 'after'; }
  clearDrop();
  if (t) t.classList.add(where === 'before' ? 'drop-before' : 'drop-after');
  d.target = t ? t.dataset.row : null; d.where = where;
}, { passive: false });
function endDrag(ok) {
  const d = S.drag; if (!d) return;
  S.drag = null; clearDrop(); d.row.classList.remove('dragging'); document.body.classList.remove('is-dragging');
  if (!ok || !d.target) { if (S.dirty) render(); return; }
  const from = S.items.findIndex(i => i.id === d.id); const [it] = S.items.splice(from, 1);
  let to = S.items.findIndex(i => i.id === d.target); if (d.where === 'after') to++;
  const unchanged = to === from;
  S.items.splice(to, 0, it);
  render();
  if (unchanged) return;
  if (S.db && S.db.moveItem) S.db.moveItem(d.id, d.target, d.where).then(() => toast('並び順を変えました')).catch(fail);
}

/* ---- カメラで連続読み取り ---- */
let live = null;
const liveLast = {};
let actx;
function beep(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = ok ? 1320 : 440; g.gain.value = 0.12;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (ok ? 0.09 : 0.22));
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(ok ? 40 : [60, 60, 60]); } catch (e) {}
}
function janValid(c) {
  if (!/^(\d{8}|\d{12}|\d{13})$/.test(c)) return false;
  const d = c.split('').map(Number), chk = d.pop();
  let sum = 0; d.reverse().forEach((n, i) => { sum += n * (i % 2 === 0 ? 3 : 1); });
  return (10 - sum % 10) % 10 === chk;
}
function liveCode(raw) {
  let code = String(raw || '').replace(/\D/g, '');
  if (code.length === 12) code = '0' + code;
  if (!janValid(code) || !S.scan || S.scan.kind !== 'bar') return;
  const now = Date.now();
  if (liveLast[code] && now - liveLast[code] < 1800) { liveLast[code] = now; return; }
  liveLast[code] = now;
  const r = addJan(code, 1, '');
  const it = r.id && S.items.find(x => x.id === r.id);
  const msg = it ? `✓ ${it.name}${S.scan.mode === 'link' ? '（登録済み）' : '　' + r.qty}` : `新しいバーコード ${code}：下で商品を選んでください`;
  S.scan.last = msg.replace(/^✓ /, ''); S.scan.err = '';
  const el = $('live'); if (el) { el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 300); $('live-msg').textContent = msg; }
  beep(!!it); render();
}
async function liveStart() {
  if (live) return;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch (e) {}
  const el = document.createElement('div');
  el.id = 'live';
  el.innerHTML = '<video id="live-v" playsinline muted autoplay></video><div class="live-guide"></div><div class="live-msg" id="live-msg">カメラを起動しています…</div><button type="button" class="btn small live-close" data-act="liveStop">閉じる</button>';
  document.body.appendChild(el); document.body.classList.add('is-live');
  live = { stream: null, timer: null, reader: null };
  const video = $('live-v');
  try {
    let native = false;
    if ('BarcodeDetector' in window) { try { native = (await BarcodeDetector.getSupportedFormats()).includes('ean_13'); } catch (e) {} }
    if (native) {
      live.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
      video.srcObject = live.stream; await video.play();
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
      const tick = async () => {
        if (!live) return;
        try { (await det.detect(video)).forEach(r => liveCode(r.rawValue)); } catch (e) {}
        if (live) live.timer = setTimeout(tick, 120);
      };
      tick();
    } else {
      const Z = await loadZxing();
      const hints = new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
      live.reader = new Z.BrowserMultiFormatReader(hints, 150);
      await live.reader.decodeFromConstraints({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } }, video, res => { if (res) liveCode(res.getText()); });
      live.stream = video.srcObject;
    }
    $('live-msg').textContent = 'バーコードを枠に入れてください';
    render();
  } catch (e) {
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    liveStop();
    toast(denied ? 'カメラが許可されていません。ブラウザの設定でカメラを許可してください' : 'カメラを起動できませんでした');
  }
}
function liveStop() {
  if (live) {
    clearTimeout(live.timer);
    try { live.reader && live.reader.reset(); } catch (e) {}
    if (live.stream) live.stream.getTracks().forEach(t => t.stop());
  }
  live = null;
  const el = $('live'); if (el) el.remove();
  document.body.classList.remove('is-live');
  if (S.scan) render();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && live) liveStop(); });
const liveWatch = () => { if (live && (!S.scan || S.scan.kind !== 'bar')) liveStop(); };

    <h3>ログイン</h3>
    <div class="sub">スタッフ共通のアカウントでログインします。一度ログインすれば、この端末では次から自動で開きます。</div>
    <label>メールアドレス<input class="field" id="lg-email" type="email" autocomplete="username" value="${esc(S.loginEmail || '')}"></label>
    <label>パスワード<input class="field" id="lg-pass" type="password" autocomplete="current-password"></label>
    ${S.loginErr ? `<div class="err">${esc(S.loginErr)}</div>` : ''}
    <button class="btn primary" type="submit" id="lg-go">ログイン</button>
  </form>`;
}
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'login-form') return;
  ev.preventDefault();
  const email = $('lg-email').value.trim(), pass = $('lg-pass').value;
  S.loginEmail = email;
  if (!email || !pass) { S.loginErr = 'メールアドレスとパスワードを入れてください'; render(); return; }
  $('lg-go').disabled = true;
  try { await firebase.auth().signInWithEmailAndPassword(email, pass); S.loginErr = ''; }
  catch (e) { S.loginErr = 'ログインできませんでした。メールアドレスとパスワードを確認してください'; render(); }
});

/* ---- スプレッドシートからの引っ越し（最初の1回だけ） ---- */
function importView() {
  return `<form class="card login" id="import-form" novalidate>
    <h3>データの引っ越し</h3>
    <div class="sub">まだデータが入っていません。今のスプレッドシート版から、商品・ディーラー・在庫・発注履歴・JANコードをまとめて移します。商品編集の暗証番号を入れてください。</div>
    <label>暗証番号<input class="field" id="im-pin" type="password" inputmode="numeric" autocomplete="off"></label>
    ${S.importMsg ? `<div class="${S.importErr ? 'err' : 'sub'}">${esc(S.importMsg)}</div>` : ''}
    <button class="btn primary" type="submit" id="im-go" ${S.importing ? 'disabled' : ''}>${S.importing ? '移しています…' : 'スプレッドシートから移す'}</button>
  </form>`;
}
async function importFromSheet(pin) {
  const d = await gas({ action: 'export', pin });
  const snap = d.snapshot, fs = firebase.firestore(), now = Date.now();
  const w = [];
  snap.dealers.forEach((x, i) => w.push(['dealers/' + x.id, { name: x.name, sample: !!x.sample, url: x.url || '', createdAt: i + 1 }]));
  snap.items.forEach((it, i) => w.push(['items/' + it.id, { name: it.name, category: it.category || '', unit: it.unit || '', dealerId: it.dealerId || '', price: Number(it.price) || 0, min: it.min || {}, par: it.par || {}, sample: !!it.sample, jan: it.jan || '', createdAt: (i + 1) * 1000 }]));
  Object.entries(snap.stock || {}).forEach(([k, q]) => { if (Number(q)) { const i = k.indexOf('_'); w.push(['stock/' + k, { store: k.slice(0, i), itemId: k.slice(i + 1), qty: Number(q), at: now }]); } });
  (snap.orders || []).forEach(o => w.push(['orders/' + o.id, { store: o.store, dealerId: o.dealerId || '', dealerName: o.dealerName || '', lines: o.lines || [], total: Number(o.total) || 0, status: o.status, orderedAt: Number(o.orderedAt) || now, receivedAt: Number(o.receivedAt) || null }]));
  w.push(['settings/app', { pin: String(d.pin), importedAt: now }]);
  for (let i = 0; i < w.length; i += 400) {
    const b = fs.batch();
    w.slice(i, i + 400).forEach(([path, data]) => b.set(fs.doc(path), data));
    await b.commit();
    S.importMsg = `移しています… ${Math.min(i + 400, w.length)} / ${w.length}`; render();
  }
  return { items: snap.items.length, dealers: snap.dealers.length, orders: (snap.orders || []).length };
}
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'import-form') return;
  ev.preventDefault();
  const pin = $('im-pin').value.trim(); if (!pin || S.importing) return;
  S.importing = true; S.importErr = false; S.importMsg = 'スプレッドシートを読んでいます…'; render();
  try {
    const r = await importFromSheet(pin);
    S.needImport = false; S.importing = false; S.importMsg = '';
    toast(`商品${r.items}件・ディーラー${r.dealers}件・発注${r.orders}件を移しました`); render();
  } catch (e) { S.importing = false; S.importErr = true; S.importMsg = (e && e.message) || '移せませんでした'; render(); }
});

/* ---- 接続（Firebase） ---- */
const FIREBASE = typeof firebaseConfig !== 'undefined' ? firebaseConfig : null;
const GAS = "https://script.google.com/macros/s/AKfycbzLd5HUcScSlTagl3Jt6GWBgOsWNqdW9Z6NbOzbIh3wwQzLNQ0oeRQJO2SeZbj6MZYJgw/exec";
function arrive(name, fromCache) { if (!fromCache) confirmed.add(name); S.ready.add(name); if (confirmed.size === 4 && slowT) { clearTimeout(slowT); slowT = null; S.slow = false; } scheduleRender(); }
const confirmed = new Set();
let slowT = null;
const docs = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
function onErr(e) {
  if (e && e.code === 'permission-denied') { S.failed = 'データを読む権限がありません。ログインし直してください。'; render(); }
  else { clearTimeout(slowT); S.slow = true; scheduleRender(); }
}
async function gas(body) {
  const res = await fetch(GAS, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '通信に失敗しました');
  return j.data;
}
function makeApi(fs) {
  const FV = firebase.firestore.FieldValue;
  return {
    doc: p => fs.doc(p),
    collection: c => fs.collection(c),
    async checkPin(v) {
      const s = await fs.doc('settings/app').get();
      const pin = s.exists ? String(s.data().pin || '') : '';
      return pin ? v === pin : '暗証番号がまだ設定されていません';
    },
    async moveItem(id) {
      const i = S.items.findIndex(x => x.id === id);
      const p = S.items[i - 1], n = S.items[i + 1];
      const a = p ? Number(p.createdAt) || 0 : null, b = n ? Number(n.createdAt) || 0 : null;
      const v = a === null ? b - 1000 : b === null ? a + 1000 : (a + b) / 2;
      await fs.doc('items/' + id).update({ createdAt: v });
    },
    scanPhoto: (mode, store, b64, mime) => gas({ action: 'scanPhoto', mode, store, b64, mime, items: S.items.map(it => ({ id: it.id, name: it.name, unit: it.unit })) }),
    scanBarcodes: (b64, mime) => gas({ action: 'scanBarcodes', b64, mime, items: S.items.map(it => ({ id: it.id, name: it.name, jan: it.jan || '' })) }),
    async applyScan(store, mode, lines) {
      const batch = fs.batch();
      for (const l of lines || []) {
        if (!l.id) continue;
        if (l.jan) {
          const it = S.items.find(x => x.id === l.id);
          const cur = String((it && it.jan) || '').split(',').map(x => x.trim()).filter(Boolean);
          String(l.jan).split(',').forEach(j => { if (j && !cur.some(c => janKey(c) === janKey(j))) cur.push(j); });
          batch.update(fs.doc('items/' + l.id), { jan: cur.join(',') });
        }
        if (mode === 'link') continue;
        const key = store + '_' + l.id, q = Math.max(0, Math.round(Number(l.qty) || 0));
        if (mode === 'count') { batch.set(fs.doc('stock/' + key), { store, itemId: l.id, qty: q, at: Date.now() }); S.stock[key] = q; }
        else if (q) { batch.set(fs.doc('stock/' + key), { store, itemId: l.id, qty: FV.increment(q), at: Date.now() }, { merge: true }); S.stock[key] = (S.stock[key] || 0) + q; }
      }
      await batch.commit();
    },
  };
}
let started = false;
function listen(fs) {
  if (started) return; started = true;
  WHO.init(fs, scheduleRender);
  slowT = setTimeout(() => { S.slow = true; scheduleRender(); }, 10000);
  fs.collection('items').orderBy('createdAt').onSnapshot(s => { S.items = docs(s); if (!s.metadata.fromCache && !S.importing) S.needImport = !s.docs.length; arrive('items', s.metadata.fromCache); }, onErr);
  fs.collection('dealers').onSnapshot(s => { S.dealers = docs(s); arrive('dealers', s.metadata.fromCache); }, onErr);
  fs.collection('orders').orderBy('orderedAt', 'desc').limit(300).onSnapshot(s => { S.orders = docs(s); arrive('orders', s.metadata.fromCache); }, onErr);
  fs.collection('stock').onSnapshot(s => {
    const next = {};
    s.docs.forEach(d => { next[d.id] = num(d.data().qty); });
    for (const [k, p] of pending) if (p.timer) next[k] = S.stock[k];
    S.stock = next; arrive('stock', s.metadata.fromCache);
  }, onErr);
}
function start() {
  shell();
  if (!FIREBASE) { S.failed = '設定ファイル（config.js）がまだありません。'; render(); return; }
  firebase.initializeApp(FIREBASE);
  const fs = firebase.firestore();
  try { fs.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
  S.db = makeApi(fs);
  firebase.auth().onAuthStateChanged(u => {
    if (u) { S.login = false; listen(fs); render(); }
    else { S.login = true; render(); }
  });
}
start();
</script>
