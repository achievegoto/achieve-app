<style>
/* Layout: one narrow operating column, store switch pinned on top, four tabs pinned at the thumb. */
:root {
  --bg: #f4f4f7; --surface: #ffffff; --line: #e2e1e9; --ink: #1d1b26; --muted: #6a6778;
  --accent: #54347e; --accent-ink: #ffffff; --accent-soft: #eee8f6;
  --bad: #b3261e; --bad-soft: #fbe9e7; --warn: #8a5a00; --warn-soft: #fbf0d9; --good: #1f6b4a; --good-soft: #e3f2ea;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-num: "Jost", "IBM Plex Sans JP", "Hiragino Sans", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15141b; --surface: #1f1d28; --line: #33303f; --ink: #efedf5; --muted: #a29eb2;
  --accent: #c4a6ea; --accent-ink: #1d1529; --accent-soft: #2f2740;
  --bad: #ff9b90; --bad-soft: #3f2220; --warn: #eec26e; --warn-soft: #3a2e16; --good: #7fd3ab; --good-soft: #1b3429;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15141b; --surface: #1f1d28; --line: #33303f; --ink: #efedf5; --muted: #a29eb2;
  --accent: #c4a6ea; --accent-ink: #1d1529; --accent-soft: #2f2740;
  --bad: #ff9b90; --bad-soft: #3f2220; --warn: #eec26e; --warn-soft: #3a2e16; --good: #7fd3ab; --good-soft: #1b3429;
  color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.head { display: flex; flex-direction: column; gap: 10px; padding-block: 12px; }
.brand { font-family: var(--font-num); font-size: 20px; letter-spacing: .08em; display: flex; align-items: baseline; gap: 10px; }
.brand small { font-family: var(--font-body); font-size: 12px; letter-spacing: .04em; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, .8fr); gap: 4px; background: var(--bg); padding: 3px; border-radius: 10px; }
.seg button { border: 0; background: transparent; padding: 8px 2px; border-radius: 8px; font-family: var(--font-num); font-size: 13px; line-height: 1.25; color: var(--muted); min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
main { padding-block: 16px 104px; display: flex; flex-direction: column; gap: 16px; }
.summary { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--muted); }
.summary b { font-family: var(--font-num); font-size: 22px; font-weight: 500; color: var(--ink); margin-left: 6px; font-variant-numeric: tabular-nums; }
.summary b.alert { color: var(--bad); }
.sum-btn { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 4px; }
.pend-line { display: grid; grid-template-columns: minmax(0, 1fr) 64px auto; gap: 8px; align-items: center; padding: 6px 0; }
.pend-line + .pend-line { border-top: 1px dashed var(--line); }
.pend-line .field { text-align: center; padding: 6px 4px; }
.pend-line.done .name { color: var(--muted); }
.late { color: var(--bad); font-weight: 700; }
#toast button { margin-left: 10px; border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 6px; padding: 3px 10px; font: inherit; font-weight: 700; }
.tools { display: flex; flex-direction: column; gap: 8px; }
.field, select.field, textarea.field { width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.sub { padding: 8px; border-radius: 10px; background: var(--accent-soft); }
.chip .caret { margin-left: 4px; font-size: 10px; }

.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.group { display: flex; flex-direction: column; gap: 6px; }
.group h2 { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin: 0; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 11px 14px; }
.row + .row { border-top: 1px solid var(--line); }
.scan-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opsbar { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 6px; }
.opb { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 13px; font-weight: 500; white-space: nowrap; }
.opb .sg { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
.opb.link { color: var(--muted); font-size: 12px; padding: 7px 10px; }
.opb.plus[aria-pressed="true"] { border-color: var(--good); background: var(--good-soft); }
.opb.minus[aria-pressed="true"] { border-color: var(--bad); background: var(--bad-soft); }
.opb.eq[aria-pressed="true"] { border-color: var(--info, #1d5fa8); background: var(--info-soft, #e4eefa); }
.opsub { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; margin-top: -2px; }
.opsub .obtns { display: flex; gap: 6px; }
.ops { display: flex; flex-direction: column; gap: 8px; }
.op { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.op .sg, .mhead .sg { grid-row: span 2; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; font-family: var(--font-num); }
.op b { font-size: 15px; } .op .sub { margin: 0; }
.op .obtns { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.op .obtns .btn { flex: 1 1 130px; }
.sg.plus { background: var(--good-soft); color: var(--good); } .sg.minus { background: var(--bad-soft); color: var(--bad); } .sg.eq { background: var(--info-soft, #e4eefa); color: var(--info, #1d5fa8); } .sg.link { background: var(--bg); color: var(--muted); font-size: 16px; }
.mhead { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; }
.mhead b { font-size: 16px; } .mhead .sub { margin: 0; }
.chip.m-receive[aria-pressed="true"] { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.chip.m-use[aria-pressed="true"] { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.chip.m-count[aria-pressed="true"] { border-color: var(--info, #1d5fa8); background: var(--info-soft, #e4eefa); color: var(--info, #1d5fa8); }
.after { font-family: var(--font-num); } .after .up { color: var(--good); font-weight: 700; } .after .dn { color: var(--bad); font-weight: 700; } .after .eq { color: var(--info, #1d5fa8); font-weight: 700; }
.scan-row { grid-template-columns: minmax(0, 1fr) 84px; }
.scan-row select.field { margin-top: 4px; }
.scan-row .qty { text-align: center; }
.jan-line { display: flex; gap: 8px; align-items: center; }
.jan-line .field { flex: 1; min-width: 0; }
.jan-line .btn { flex: none; white-space: nowrap; }
.scan-busy { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.scan-busy::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.row.has-grip { grid-template-columns: auto minmax(0, 1fr) auto; }
.grip { touch-action: none; cursor: grab; border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 8px 4px; margin: -8px 0 -8px -6px; letter-spacing: -3px; }
.row.dragging { opacity: .45; }
.row.drop-before { box-shadow: inset 0 3px 0 var(--accent); }
.row.drop-after { box-shadow: inset 0 -3px 0 var(--accent); }
body.is-dragging { user-select: none; -webkit-user-select: none; }
.name { font-weight: 500; overflow-wrap: anywhere; }
.sub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.pill.short { background: var(--bad-soft); color: var(--bad); }
.pill.ordering { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.sample { background: var(--accent-soft); color: var(--accent); }
.stepper { display: flex; align-items: center; gap: 2px; }
.lockbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; text-align: left; }
.lockbar b { font-size: 14px; color: var(--ink); }
.lockbar .sw { flex: none; padding: 5px 12px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 12px; }
.lockbar.open { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
.lockbar.open b { color: var(--warn); }
.lockbar.open .sw { background: var(--warn); color: var(--surface); }
.pinbar { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; }
.pinbar b { color: var(--ink); font-size: 14px; }
.pinbar .field { width: 8.5em; flex: none; }
.pinbar.open { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
.pinbar.open b { color: var(--warn); }
.stepper.locked button { opacity: .3; }
.stepper.locked input { color: var(--ink); opacity: 1; -webkit-text-fill-color: var(--ink); }
.stepper button { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; font-size: 19px; line-height: 1; }
.stepper input { width: 52px; height: 40px; text-align: center; border: 0; background: transparent; font-family: var(--font-num); font-size: 20px; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.card h3 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.amount { font-family: var(--font-num); font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lines .row { padding-inline: 0; }
.msg { font-size: 13px; line-height: 1.7; min-height: 180px; resize: vertical; background: var(--bg); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 8px; font-weight: 500; }
a.btn { display: inline-block; text-decoration: none; color: var(--ink); text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }
.note { padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 84px; gap: 10px; align-items: center; font-size: 13px; }
.bar-row span:first-child { font-family: var(--font-num); font-size: 14px; }
.bar-track { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); }
.bar-row .amt { text-align: right; font-family: var(--font-num); font-size: 15px; font-variant-numeric: tabular-nums; }
.month-nav { display: flex; align-items: center; gap: 8px; }
.sum-wrap { overflow-x: auto; }
.sum { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sum th, .sum td { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.sum th:first-child { text-align: left; }
.sum tr:first-child th { font-size: 12px; color: var(--muted); font-weight: 500; }
.sum .tot, .sum .foot td, .sum .foot th { font-weight: 700; }
.sum .foot td, .sum .foot th { border-bottom: 0; }
form { display: flex; flex-direction: column; gap: 12px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
label .field { font-size: 15px; color: var(--ink); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.levels { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 13px; }
.levels .lv-h { font-size: 12px; color: var(--muted); }
.levels .lv-s { font-family: var(--font-num); font-size: 15px; }
.bk-head, .bk-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 64px; gap: 8px; align-items: center; }
.bk-head { font-size: 12px; color: var(--muted); padding: 0 2px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 2; padding-block: 6px; }
.bk-row { padding: 6px 2px; border-bottom: 1px solid var(--line); }
.bk-row .bk-n { font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.bk-row input { text-align: center; padding-inline: 4px; font-family: var(--font-num); font-size: 16px; }
.bk-row.changed .bk-n::after { content: ' ●'; color: var(--accent); font-size: 11px; }
.bk-row.bad input { border-color: #d33; }
.bk-bar { position: sticky; bottom: 0; padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--bg); display: flex; gap: 8px; align-items: center; z-index: 3; border-top: 1px solid var(--line); }
.bk-stores { display: flex; gap: 6px; flex-wrap: wrap; }
.alltbl-w { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.alltbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.alltbl th { position: sticky; top: 0; background: var(--surface); font-size: 11px; font-weight: 600; color: var(--muted); padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.alltbl th:first-child { text-align: left; padding-left: 12px; }
.alltbl td { padding: 9px 4px; border-bottom: 1px solid var(--line); }

.alltbl .aq.low { color: var(--bad); background: var(--bad-soft); }
.alltbl .aq.na { color: var(--line); font-weight: 400; }
.alltbl tr.is-ended .an { color: var(--muted); text-decoration: line-through; }
.pill.ended { background: var(--bg); color: var(--muted); border: 1px solid var(--line); text-decoration: none; }
.row.is-ended .name { color: var(--muted); text-decoration: line-through; }
.lvreq .lvr { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.lvreq ul { margin: 6px 0; padding-left: 18px; font-size: 13px; }
.lvreq li { margin: 2px 0; }
.head-r { display: flex; align-items: center; gap: 8px; flex: none; }
.brand-row .brand { min-width: 0; }
@media (max-width: 460px) { .brand small { display: none; } .brand-row .brand { font-size: 17px; letter-spacing: .03em; } #vbtn { padding: 0 10px 0 8px; } .head-r { gap: 6px; } }
@media (max-width: 350px) { #vbtn { width: 34px; padding: 0; justify-content: center; } #vbtn #vbtn-l { display: none; } }
#vbtn { height: 34px; padding: 0 12px 0 10px; border-radius: 17px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; white-space: nowrap; }
#vbtn svg { width: 16px; height: 16px; flex: none; }

#vbtn[aria-expanded="true"] .vx { display: block; }
#vbtn[aria-expanded="true"] { background: var(--surface); color: var(--ink); border-color: var(--line); }
#vpanel .vtitle { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; margin-bottom: 8px; }
#vpanel .vtitle span { font-weight: 400; font-size: 12px; color: var(--muted); }
#vbtn.on { animation: vpulse 1.2s ease-in-out infinite; }
@keyframes vpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(84,52,126,.5); } 50% { box-shadow: 0 0 0 14px rgba(84,52,126,0); } }
#vpanel { position: fixed; left: 0; right: 0; bottom: calc(52px + env(safe-area-inset-bottom, 0px)); z-index: 14; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0,0,0,.12); max-height: 62vh; overflow-y: auto; padding-block: 14px 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#vpanel .vq { display: flex; gap: 8px; align-items: center; }

#vpanel .vqty b { font-family: var(--font-num); font-size: 18px; color: var(--ink); }
#vpanel .vqty .cur b { color: var(--accent); font-size: 22px; }
@media (prefers-reduced-motion: reduce) { #vbtn.on { animation: none; outline: 3px solid var(--accent-soft); } }

.err { color: var(--bad); font-size: 13px; }
.dealer-row { display: flex; gap: 8px; align-items: center; padding: 8px 14px; }
.dealer-row + .dealer-row { border-top: 1px solid var(--line); }
.dealer-row .field { flex: 1; }
nav { position: fixed; inset: auto 0 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { position: relative; border: 0; background: transparent; padding: 15px 0; font-size: 14px; color: var(--muted); }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; box-shadow: inset 0 2px 0 var(--accent); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--bad); color: var(--bg); font-family: var(--font-num); font-size: 12px; line-height: 18px; font-weight: 500; }

@media (prefers-reduced-motion: no-preference) { .bar-fill { transition: width .25s ease; } }

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script>
const STORES = [
  { id: 'hair', short: 'hair design', full: 'achieve hair design' },
  { id: 'liss', short: 'Liss', full: 'achieve Liss' },
  { id: 'till', short: 'till', full: 'achieve till Smart Salon' },
  { id: 'tonari', short: 'TONARI在庫', full: 'TONARI在庫' },
];
const TABS = [['stock', '在庫'], ['order', '発注'], ['history', '履歴'], ['items', '商品']];
const S = {
  db: null, items: [], dealers: [], stock: {}, orders: [], ready: new Set(), readOnly: false, slow: false, failed: '',
  store: 'hair', tab: 'stock', q: '', cat: '', onlyShort: false,
  draft: {}, editing: null, formErr: '', confirm: '', dirty: false,
};
/* TONARI在庫はオーナーだけが動かせる */
const tonariLocked = () => S.store === 'tonari' && !(window.WHO && WHO.isOwner());
S._ro = false;
Object.defineProperty(S, 'readOnly', { get() { return this._ro || tonariLocked(); }, set(v) { this._ro = v; }, configurable: true });
try { const v = localStorage.getItem('achieve-store'); if (STORES.some(s => s.id === v)) S.store = v; } catch (e) {}

const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const yenS = n => n ? Math.round(n).toLocaleString('ja-JP') : '-';
const num = (v, d = 0) => { const n = Number(v); return Number.isFinite(n) && n >= 0 ? n : d; };
const storeOf = id => STORES.find(s => s.id === id) || { id, short: id, full: id };
const XFER = '__tonari', XFER_D = { id: XFER, name: 'TONARIから移動（店舗間）' };
const dealerOf = id => id === XFER ? XFER_D : S.dealers.find(d => d.id === id);
const dateStr = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };

let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
function toastUndo(m, id) { const t = $('toast'); t.innerHTML = esc(m) + `<button type="button" data-act="undoRecv" data-id="${esc(id)}">取り消す</button>`; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 8000); }

/* ---- 計算 ---- */
const qtyOf = (store, id) => S.stock[store + '_' + id] ?? 0;
const stockValue = store => S.items.reduce((a, it) => a + qtyOf(store, it.id) * num(it.price), 0);
/* 一部入荷に対応：l.got = 入荷済みの数。残り = 発注数 − 入荷済み */
const leftOf = l => Math.max(0, num(l.qty) - num(l.got));
function onOrder(store, id) {
  let n = 0;
  for (const o of S.orders) if (o.store === store && o.status === 'ordered')
    for (const l of o.lines || []) if (l.itemId === id) n += leftOf(l);
  return n;
}
const isUnset = (it, store) => it.min?.[store] === undefined && it.par?.[store] === undefined;
const carried = (it, store) => isUnset(it, store) || num(it.min?.[store]) > 0 || num(it.par?.[store]) > 0;
function statusOf(it, store) {
  if (isUnset(it, store)) return 'unset';
  const q = qtyOf(store, it.id), oo = onOrder(store, it.id), min = num(it.min?.[store]);
  if (q + oo <= min) return 'short';
  if (q <= min && oo > 0) return 'ordering';
  return 'ok';
}
function needOf(it, store) {
  if (it.ended) return 0;
  if (!carried(it, store) || statusOf(it, store) !== 'short') return 0;
  return Math.max(num(it.par?.[store]) - qtyOf(store, it.id) - onOrder(store, it.id), 1);
}
const shortItems = store => S.items.filter(it => carried(it, store) && needOf(it, store) > 0);
/* ---- TONARI（過剰在庫）からの店舗間移動 ----
   TONARIに在庫があれば、ディーラーに発注せずTONARIから移す。
   複数店舗で同じ商品が足りないときは、在庫が少ない（発注点に対して余裕がない）店舗から1個ずつ順に割り振る。同じならLiss→hair→till。
   金額は受け取る店舗の発注金額に入れ、TONARIの在庫金額からは差し引かれる。 */
let resvCache = { orders: null, map: {} };
function tonariReserved(id) {
  if (resvCache.orders !== S.orders) {
    const m = {};
    for (const o of S.orders) if (o.dealerId === XFER && o.status === 'ordered') for (const l of o.lines || []) m[l.itemId] = (m[l.itemId] || 0) + leftOf(l);
    resvCache = { orders: S.orders, map: m };
  }
  return resvCache.map[id] || 0;
}
const tonariFree = id => Math.max(0, qtyOf('tonari', id) - tonariReserved(id));
function xferAlloc(it) {
  const stores = ['liss', 'hair', 'till'], res = {};
  stores.forEach(st => res[st] = 0);
  let left = tonariFree(it.id); if (!left) return res;
  const need = {}; stores.forEach(st => need[st] = needOf(it, st));
  const room = st => qtyOf(st, it.id) + onOrder(st, it.id) + res[st] - num(it.min?.[st]);
  while (left > 0) {
    const c = stores.filter(st => need[st] > res[st]); if (!c.length) break;
    c.sort((a, b) => room(a) - room(b) || stores.indexOf(a) - stores.indexOf(b));
    res[c[0]]++; left--;
  }
  return res;
}
const xferOf = (it, store) => store === 'tonari' || qtyOf('tonari', it.id) <= 0 ? 0 : xferAlloc(it)[store] || 0;
function monthTotal(store) {
  const n = new Date();
  return S.orders.filter(o => { const d = new Date(o.orderedAt); return (!store || o.store === store) && d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth(); })
    .reduce((a, o) => a + num(o.total), 0);
}
const draftKey = did => S.store + ':' + did;
function linesFor(did) {
  const draft = S.draft[draftKey(did)] || {};
  const rows = [];
  for (const it of S.items) {
    const x = xferOf(it, S.store);
    if (did === XFER ? x <= 0 && !Object.prototype.hasOwnProperty.call(draft, it.id) : (it.dealerId || '') !== did) continue;
    const need = did === XFER ? x : Math.max(0, needOf(it, S.store) - x);
    const has = Object.prototype.hasOwnProperty.call(draft, it.id);
    if (need > 0 || has) rows.push({ it, qty: has ? num(draft[it.id]) : need, auto: need, manual: has });
  }
  return rows;
}
/* 単位が「50個」のように数字で始まると「× 2」と続けて「250個」に見えるので、括弧で区切る */
const uTxt = u => !u ? '' : /^[0-9０-９]/.test(u) ? `（${u}）` : u;
const isGoto = d => !!d && !d.url && (d.id === 'other-goto' || /後藤/.test(d.name));
/* 在庫にない商品などの手打ち追記（ディーラーごと・order_draftsのextraに保存） */
const extraOf = did => ((S.draftExtra || {})[draftKey(did)] || '');
const extraLines = did => extraOf(did).split('\n').map(x => x.trim()).filter(Boolean).map(x => /^[・\-]/.test(x) ? x : '・' + x);
const bodyOf = did => linesFor(did).filter(r => r.qty > 0).map(r => `・${r.it.name} × ${r.qty}${uTxt(r.it.unit)}`).concat(extraLines(did)).join('\n');
/* 後藤さんへLINEで送るもの（後藤発注のディーラー＋TONARIからの移動）はすべて1つの文章にまとめる */
const isGotoDid = did => did === XFER ? S.store !== 'tonari' : isGoto(dealerOf(did));
const gotoIds = () => S.dealers.filter(isGoto).map(d => d.id).concat(S.store === 'tonari' ? [] : [XFER]).filter(did => linesFor(did).some(r => r.qty > 0) || extraLines(did).length);
function gotoText() {
  const st = storeOf(S.store);
  const g = gotoIds();
  const parts = g.map(did => `【${did === XFER ? 'TONARIの在庫から移動' : dealerOf(did).name.replace(/[（(]後藤[）)]/g, '').trim()}】\n` + bodyOf(did));
  const head = g.includes(XFER) ? (g.length > 1 ? '発注とTONARIからの移動お願いします。' : 'TONARIの在庫から移動お願いします。') : '発注お願いします。';
  return `後藤さん\n${head}\n${st.full}\n\n${parts.join('\n\n')}`;
}
function gotoCard(force) {
  const g = gotoIds(); if (!g.length) return '';
  const total = g.reduce((a, did) => a + linesFor(did).filter(r => r.qty > 0).reduce((b, r) => b + r.qty * num(r.it.price), 0), 0);
  const n = g.reduce((a, did) => a + linesFor(did).filter(r => r.qty > 0).length + extraLines(did).length, 0);
  return `<details class="card ocard" data-did="__goto" ${force || (S.oOpen ||= new Set()).has('__goto') ? 'open' : ''}>
    <summary class="card-head"><h3>後藤さん宛て（まとめて）</h3><span class="osum"><span class="ocnt">${n}品</span><span class="amount">${yen(total)}</span><span class="chev" aria-hidden="true"></span></span></summary>
    <div class="sub">${g.map(did => esc(dealerOf(did).name)).join('・')} の ${g.length} 件を1つの文章にしています。下のカードで数量を変えると、ここにも反映されます。</div>
    <textarea class="field msg" id="msg-__goto" readonly aria-label="後藤さん宛てのまとめた発注文">${esc(gotoText())}</textarea>
    <div class="actions">
      <button type="button" class="btn primary" id="copy-__goto" data-act="copy" data-did="__goto">まとめてコピー</button>
      <button type="button" class="btn" id="done-__goto" data-act="placedGoto" ${S.readOnly ? 'disabled' : ''}>LINEで送ったので全部発注済みにする</button>
    </div></details>`;
}
function lineText(did) {
  const d = dealerOf(did), st = storeOf(S.store);
  const body = bodyOf(did);
  if (d && d.id === XFER) return `後藤さん\nTONARIの在庫から移動お願いします。\n${st.full}\n\n${body}`;
  if (d && (d.id === 'other-goto' || /後藤/.test(d.name))) return `後藤さん\n発注お願いします。\n${st.full}\n\n${body}`;
  return `${d ? d.name : ''} ご担当者様\nいつもお世話になっております。\n${st.full}です。\n下記の発注をお願いいたします。\n\n${body}\n\n納品先：${st.full}\n納期が分かりましたらご連絡ください。\nよろしくお願いいたします。`;
}

/* オンライン発注サイト（ミルボン等）：AI（ブラウザ操作）にカート入れを頼む指示文。注文確定はさせない */
function aiText(did) {
  const d = dealerOf(did), st = storeOf(S.store);
  const items = linesFor(did).filter(r => r.qty > 0).map(r => `・${r.it.name}${r.it.category && !r.it.name.includes(r.it.category.split(' ')[0]) ? `（${r.it.category}）` : ''} × ${r.qty}${uTxt(r.it.unit)}`).concat(extraLines(did));
  return `${d ? d.name.replace(/[（(]オンライン発注[）)]/g, '').trim() : ''}の発注サイト${d && d.url ? `（${d.url}）` : ''}で、下の商品をカートに入れてください。

・最初に、ログイン中の店舗が「${st.full}」になっているか確認してください。違う店舗なら作業を止めて教えてください。
・商品名で検索し、名前・容量・色番号まで一致するものを選んで、指定の数量でカートに入れてください。
・見つからない、在庫切れ、候補が複数あって決められない商品はカートに入れず、最後にまとめて教えてください。
・すでにカートに入っている商品があれば、消さずに教えてください。
・注文の確定（購入・注文ボタン）は押さないでください。最後にカートの中身（商品名・数量・金額）を一覧で見せて終わってください。

【${st.full}　カートに入れる商品】
${items.join('\n')}`;
}
const msgText = did => (dealerOf(did) || {}).url ? aiText(did) : lineText(did);

/* ---- 保存 ---- */
function fail(e) {
  if (e && e.code === 'invalid_argument') { S.readOnly = true; render(); toast('この画面では変更を保存できません'); return; }
  if (e && e.code === 'quota_exceeded') { toast('保存容量がいっぱいです。古いデータを削除してください'); return; }
  toast('保存できませんでした。通信を確認してもう一度操作してください');
}
const pending = new Map();
function logChange(kind, store, itemId, from, to, note) {
  try {
    const it = S.items.find(x => x.id === itemId), me = WHO.me || {};
    S.db.collection('stock_log').doc().set({ at: Date.now(), by: me.id || '', byName: me.name || '', kind, store: store || '', itemId: itemId || '', itemName: it ? it.name : (note && note.name) || '', from: from ?? null, to: to ?? null, note: (note && note.text) || '' });
  } catch (e) {}
}
function setQty(store, id, qty) {
  if (S.readOnly || !S.db) return;
  const key = store + '_' + id;
  { const p0 = pending.get(key); if (!p0 || p0.from === undefined) { const pp = p0 || { chain: Promise.resolve() }; pp.from = S.stock[key] ?? 0; pending.set(key, pp); } }
  S.stock[key] = Math.max(0, Math.round(qty));
  const p = pending.get(key) || { chain: Promise.resolve() };
  clearTimeout(p.timer);
  p.timer = setTimeout(() => {
    p.timer = null;
    const value = S.stock[key];
    const from = p.from; p.from = undefined;
    if (from !== value) logChange('count', store, id, from, value);
    p.chain = p.chain.then(() => S.db.doc('stock/' + key).set({ store, itemId: id, qty: value, at: Date.now() })).catch(fail);
  }, 450);
  pending.set(key, p);
}

/* ---- 描画 ---- */
const BIG = [['SP・TR類', ['Aujua SP', 'Aujua TR', 'サッシェSP', 'サッシェTR', 'アウトバス', 'AujuaサロンTR', 'イーラル', 'オッジィオット', 'その他SP・TR', 'サッシェ']], ['カラー', ['アディクシー', 'オルディーブ', 'エノグ、マニキュア', 'プレトワ', 'ヴィラロドラ', 'クリスタル', 'カラー関連']], ['コスメ', ['インプレア', 'im', 'その他化粧品', 'レフィル']], ['美容器具', ['Refa', 'その他器具']], ['その他', ['その他業務', 'その他消耗品', 'その他ドリンク類']]];
let lockT;
let pinT = 0;
function armPin() { clearTimeout(pinT); if (S.pin) pinT = setTimeout(() => { S.pin = ''; S.editing = null; if (S.tab === 'items') scheduleRender(); }, 600000); }
const canEdit = () => !S._ro && WHO.isAdmin();
const isBoss = () => !!(window.WHO && WHO.isOwner && WHO.isOwner());
const canReq = () => !S._ro && !!(window.WHO && WHO.me);
const myStore = () => { const st = (WHO.me || {}).store; return STORES.some(x => x.id === st) ? st : ''; };
const lvStores = () => isBoss() ? STORES.map(x => x.id) : (myStore() ? [myStore()] : []);
const pendingLv = () => (S.lvReqs || []).filter(r => r.status === 'pending');
/* 発注点・適正の変更行 → 申請 or 即反映 */
function lvRowsText(rows) { const f = v => v === '' || v == null ? '－' : v; return rows.map(r => `${r.name}（${storeOf(r.store).short}）発注点 ${f(r.oldMin)}→${f(r.min)}／適正 ${f(r.oldPar)}→${f(r.par)}`); }
async function applyLv(rows) {
  const FV = firebase.firestore.FieldValue, by = {};
  rows.forEach(r => { const u = by[r.id] ||= {}; if (r.min === '' && r.par === '') { u['min.' + r.store] = FV.delete(); u['par.' + r.store] = FV.delete(); } else { u['min.' + r.store] = num(r.min); u['par.' + r.store] = num(r.par); } });
  const ids = Object.keys(by);
  for (let i = 0; i < ids.length; i += 400) { const b = S.db.batch(); ids.slice(i, i + 400).forEach(id => b.update(S.db.doc('items/' + id), by[id])); await b.commit(); }
  return ids.length;
}
async function requestLv(rows) {
  const me = WHO.me || {};
  await S.db.collection('item_req').add({ rows, status: 'pending', at: Date.now(), by: me.id || '', byName: me.name || '' });
}
function lvReqCard() {
  const P = pendingLv(); if (!P.length) return '';
  if (isBoss()) return `<section class="card lvreq"><div class="card-head"><h3>発注点・適正の変更申請</h3><span class="sub">${P.length}件</span></div>${P.map(r => `<div class="lvr"><div class="sub"><b>${esc(r.byName || '')}</b>　${dateStr(r.at)}</div><ul>${lvRowsText(r.rows || []).map(t => `<li>${esc(t)}</li>`).join('')}</ul><div class="actions"><button type="button" class="btn small primary" data-act="lvOk" data-id="${r.id}">承認して反映</button><button type="button" class="btn small" data-act="lvNg" data-id="${r.id}">却下</button></div></div>`).join('')}</section>`;
  const mine = P.filter(r => r.by === (WHO.me || {}).id);
  return mine.length ? `<div class="note">発注点・適正の変更を${mine.length}件申請中です（後藤さんの承認で反映されます）。</div>` : '';

let zxingP = null;
function loadZxing() {
  if (window.ZXing) return Promise.resolve(window.ZXing);
  return zxingP ||= new Promise((res, rej) => {
    const sc = document.createElement('script');
    const at = String.fromCharCode(64);
    sc.src = ['https:', '', 'cdn.jsdelivr.net', 'npm', at + 'zxing', 'library' + at + '0.21.3', 'umd', 'index.min.js'].join('/');
    sc.onload = () => window.ZXing ? res(window.ZXing) : rej(new Error('no zxing'));
    sc.onerror = () => { zxingP = null; rej(new Error('zxing load')); };
    document.head.appendChild(sc);
  });
}
function fileToCanvas(file, max) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('画像を開けませんでした')); };
    img.src = url;
  });
}
let barDiag = '';
function variants(src) {
  /* 元の写真から、縮小・中央の切り出し・90度回転の画像を作って順に試す */
  const out = [], W = src.width, H = src.height;
  const make = (sx, sy, sw, sh, max, rot) => {
    const k = Math.min(1, max / Math.max(sw, sh)), w = Math.round(sw * k), h = Math.round(sh * k);
    const c = document.createElement('canvas'), g = c.getContext('2d');
    if (rot) { c.width = h; c.height = w; g.translate(h, 0); g.rotate(Math.PI / 2); } else { c.width = w; c.height = h; }
    g.drawImage(src, sx, sy, sw, sh, 0, 0, w, h); return c;
  };
  out.push(make(0, 0, W, H, 1600, false));
  out.push(make(W * 0.2, H * 0.2, W * 0.6, H * 0.6, 1400, false));
  out.push(make(0, 0, W, H, 900, false));
  out.push(make(0, 0, W, H, 1600, true));
  out.push(make(W * 0.2, H * 0.2, W * 0.6, H * 0.6, 1400, true));
  return out;
}
async function decodeLocal(file) {
  const notes = [];
  let src;
  try { src = await fileToCanvas(file, 3000); } catch (e) { barDiag = '画像を開けませんでした'; return []; }
  const list = variants(src);
  if ('BarcodeDetector' in window) {
    try {
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
      for (const c of list) {
        const found = await det.detect(c);
        const codes = found.map(f => f.rawValue).filter(Boolean);
        if (codes.length) return codes;
      }
      notes.push('端末読取なし');
    } catch (e) { notes.push('端末読取エラー'); }
  } else notes.push('端末読取非対応');
  let Z = null;
  try { Z = await loadZxing(); } catch (e) { notes.push('ZXing読込失敗'); }
  if (Z) {
    const hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const reader = new Z.MultiFormatReader(); reader.setHints(hints);
    for (const c of list) {
      for (const Bin of [Z.HybridBinarizer, Z.GlobalHistogramBinarizer]) {
        try {
          const r = reader.decode(new Z.BinaryBitmap(new Bin(new Z.HTMLCanvasElementLuminanceSource(c))));
          if (r && r.getText()) return [r.getText()];
        } catch (e) {}
      }
    }
    notes.push('ZXingで見つからず');
  }
  barDiag = notes.join('・');
  return [];
}

async function markPlaced(did, quiet) {

const receiving = new Set();
/* 入荷：req = { 行番号: 数 }。null なら残りを全部入荷 */
async function receive(id, req) {
  const o = S.orders.find(x => x.id === id);
  if (!o || o.status !== 'ordered' || receiving.has(id)) return;
  if (S._ro || (o.store === 'tonari' && !WHO.isOwner())) { toast('TONARI在庫はオーナーだけが変更できます'); return; }
  const lines = (o.lines || []).map(l => ({ ...l })), rec = [];
  lines.forEach((l, i) => { const left = leftOf(l), want = req ? Math.min(left, Math.round(num(req[i]))) : left; if (want > 0) { rec.push({ i, qty: want }); l.got = num(l.got) + want; } });
  if (!rec.length && req) { toast('入荷する数を入れてください'); return; }
  receiving.add(id);
  try {
    const done = lines.every(l => leftOf(l) === 0), me = WHO.me || {}, at = Date.now();
    for (const r of rec) {
      const l = lines[r.i], key = o.store + '_' + l.itemId, prev = S.stock[key] ?? 0, next = prev + r.qty;
      S.stock[key] = next;
      logChange('receive', o.store, l.itemId, prev, next, { text: (o.dealerName || '') + 'の発注を入荷' });
      await S.db.doc('stock/' + key).set({ store: o.store, itemId: l.itemId, qty: next, at });
      if (o.dealerId === XFER) {
        const tk = 'tonari_' + l.itemId, tp = S.stock[tk] ?? 0, take = Math.min(tp, r.qty), tn = tp - take;
        r.tonari = take; S.stock[tk] = tn;
        logChange('receive', 'tonari', l.itemId, tp, tn, { text: storeOf(o.store).short + 'へ移動' });
        await S.db.doc('stock/' + tk).set({ store: 'tonari', itemId: l.itemId, qty: tn, at });
      }
    }
    const receipts = (o.receipts || []).concat([{ at, by: me.id || '', byName: me.name || '', lines: rec }]);
    await S.db.doc('orders/' + id).update({ lines, status: done ? 'received' : 'ordered', receivedAt: done ? at : null, receipts });
    if (S.pq) rec.forEach(r => delete S.pq[id + ':' + r.i]);
    toastUndo(done ? '入荷済みにしました' : '一部を入荷しました（残りは入荷待ち）', id); render();
  } catch (e) { fail(e); } finally { receiving.delete(id); }
}
/* 直前の入荷を取り消す：在庫から引き、TONARIから移した分は戻し、発注を入荷待ちに戻す */
async function undoReceive(id) {
  const o = S.orders.find(x => x.id === id);
  if (!o || receiving.has(id)) return;
  if (!canRecv(o)) { toast('この発注は変更できません'); return; }
  const lines = (o.lines || []).map(l => ({ ...l })), rs = (o.receipts || []).slice();
  let last = rs.pop();
  if (!last) { if (o.status !== 'received') return; last = { lines: lines.map((l, i) => ({ i, qty: num(l.qty), tonari: o.dealerId === XFER ? num(l.qty) : 0 })) }; lines.forEach(l => l.got = num(l.qty)); }
  receiving.add(id);
  try {
    const at = Date.now();
    for (const r of last.lines || []) {
      const l = lines[r.i]; if (!l) continue;
      const key = o.store + '_' + l.itemId, prev = S.stock[key] ?? 0, next = Math.max(0, prev - num(r.qty));
      S.stock[key] = next; l.got = Math.max(0, num(l.got) - num(r.qty));
      logChange('unreceive', o.store, l.itemId, prev, next, { text: (o.dealerName || '') + 'の入荷を取り消し' });
      await S.db.doc('stock/' + key).set({ store: o.store, itemId: l.itemId, qty: next, at });
      if (o.dealerId === XFER && num(r.tonari)) {
        const tk = 'tonari_' + l.itemId, tp = S.stock[tk] ?? 0, tn = tp + num(r.tonari);
        S.stock[tk] = tn;
        logChange('unreceive', 'tonari', l.itemId, tp, tn, { text: storeOf(o.store).short + 'への移動を取り消し' });
        await S.db.doc('stock/' + tk).set({ store: 'tonari', itemId: l.itemId, qty: tn, at });
      }
    }
    await S.db.doc('orders/' + id).update({ lines, status: 'ordered', receivedAt: null, receipts: rs });
    S.confirm = ''; toast('入荷を取り消しました（入荷待ちに戻しました）'); render();
  } catch (e) { fail(e); } finally { receiving.delete(id); }
}

  S.importing = true; S.importErr = false; S.importMsg = 'スプレッドシートを読んでいます…'; render();
  try {
    const r = await importFromSheet(pin);
    S.needImport = false; S.importing = false; S.importMsg = '';
    toast(`商品${r.items}件・ディーラー${r.dealers}件・発注${r.orders}件を移しました`); render();
  } catch (e) { S.importing = false; S.importErr = true; S.importMsg = (e && e.message) || '移せませんでした'; render(); }
});

/* ---- 接続（Firebase） ---- */
const FIREBASE = typeof firebaseConfig !== 'undefined' ? firebaseConfig : null;
const GAS = "https://script.google.com/macros/s/AKfycbzLd5HUcScSlTagl3Jt6GWBgOsWNqdW9Z6NbOzbIh3wwQzLNQ0oeRQJO2SeZbj6MZYJgw/exec";
function arrive(name, fromCache) { if (!fromCache) confirmed.add(name); S.ready.add(name); if (confirmed.size === 4 && slowT) { clearTimeout(slowT); slowT = null; S.slow = false; } scheduleRender(); }
const confirmed = new Set();
let slowT = null;
const docs = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
function onErr(e) {
  if (e && e.code === 'permission-denied') { S.failed = 'データを読む権限がありません。ログインし直してください。'; render(); }
  else { clearTimeout(slowT); S.slow = true; scheduleRender(); }
}
async function gas(body) {
  const res = await fetch(GAS, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '通信に失敗しました');
  return j.data;
}
function makeApi(fs) {
  const FV = firebase.firestore.FieldValue;
  return {
    doc: p => fs.doc(p),
    collection: c => fs.collection(c),
    batch: () => fs.batch(),
    async checkPin(v) {
      const s = await fs.doc('settings/app').get();
      const pin = s.exists ? String(s.data().pin || '') : '';
      return pin ? v === pin : '暗証番号がまだ設定されていません';
    },
    async moveItem(id) {
      const i = S.items.findIndex(x => x.id === id);
      const p = S.items[i - 1], n = S.items[i + 1];
      const a = p ? Number(p.createdAt) || 0 : null, b = n ? Number(n.createdAt) || 0 : null;
      const v = a === null ? b - 1000 : b === null ? a + 1000 : (a + b) / 2;
      await fs.doc('items/' + id).update({ createdAt: v });
    },
    scanPhoto: (mode, store, b64, mime) => gas({ action: 'scanPhoto', mode, store, b64, mime, items: S.items.map(it => ({ id: it.id, name: it.name, unit: it.unit })) }),
    scanBarcodes: (b64, mime) => gas({ action: 'scanBarcodes', b64, mime, items: S.items.map(it => ({ id: it.id, name: it.name, jan: it.jan || '' })) }),
    async applyScan(store, mode, lines) {
      const batch = fs.batch();
      for (const l of lines || []) {
        if (!l.id) continue;
        if (l.jan) {
          const it = S.items.find(x => x.id === l.id);
          const cur = String((it && it.jan) || '').split(',').map(x => x.trim()).filter(Boolean);
          String(l.jan).split(',').forEach(j => { if (j && !cur.some(c => janKey(c) === janKey(j))) cur.push(j); });
          batch.update(fs.doc('items/' + l.id), { jan: cur.join(',') });
        }
        if (mode === 'link') continue;
        const key = store + '_' + l.id, q = Math.max(0, Math.round(Number(l.qty) || 0));
        if (mode === 'use') { const prev = S.stock[key] ?? 0, nx = Math.max(0, prev - q); if (q) { batch.set(fs.doc('stock/' + key), { store, itemId: l.id, qty: nx, at: Date.now() }); S.stock[key] = nx; logChange('count', store, l.id, prev, nx, { text: 'バーコードで使用分を引く' }); } }
        else if (mode === 'count') { const prev = S.stock[key] ?? 0; batch.set(fs.doc('stock/' + key), { store, itemId: l.id, qty: q, at: Date.now() }); S.stock[key] = q; if (prev !== q) logChange('count', store, l.id, prev, q, { text: 'スキャン・写真で棚卸し' }); }
        else if (q) { const prev = S.stock[key] || 0; batch.set(fs.doc('stock/' + key), { store, itemId: l.id, qty: FV.increment(q), at: Date.now() }, { merge: true }); S.stock[key] = prev + q; logChange('receive', store, l.id, prev, prev + q, { text: 'スキャン・写真で入荷' }); }
      }

    },
  };
}
let started = false;
function listen(fs) {
  if (started) return; started = true;
  WHO.init(fs, scheduleRender);
  slowT = setTimeout(() => { S.slow = true; scheduleRender(); }, 10000);
  fs.collection('items').orderBy('createdAt').onSnapshot(s => { S.items = docs(s); if (!s.metadata.fromCache && !S.importing) S.needImport = !s.docs.length; arrive('items', s.metadata.fromCache); }, onErr);
  fs.collection('stock_log').orderBy('at', 'desc').limit(300).onSnapshot(s => { S.logs = docs(s); if (S.tab === 'history') scheduleRender(); }, () => {});
  fs.collection('order_drafts').onSnapshot(s => { const d = {}; const ex = {}; s.docs.forEach(x => { const v = x.data(); if (v.store && v.did) { d[v.store + ':' + v.did] = v.lines || {}; ex[v.store + ':' + v.did] = v.extra || ''; } }); S.draft = d; S.draftExtra = ex; scheduleRender(); }, () => {});
  fs.collection('item_req').where('status', '==', 'pending').onSnapshot(s => { S.lvReqs = docs(s); scheduleRender(); }, () => {});
  fs.collection('dealers').onSnapshot(s => { S.dealers = docs(s); arrive('dealers', s.metadata.fromCache); }, onErr);
  fs.collection('orders').orderBy('orderedAt', 'desc').limit(300).onSnapshot(s => { S.orders = docs(s); arrive('orders', s.metadata.fromCache); }, onErr);
  fs.collection('stock').onSnapshot(s => {
    const next = {};
    s.docs.forEach(d => { next[d.id] = num(d.data().qty); });
    for (const [k, p] of pending) if (p.timer) next[k] = S.stock[k];
    S.stock = next; arrive('stock', s.metadata.fromCache);
  }, onErr);
}
function start() {
  shell();
  if (!FIREBASE) { S.failed = '設定ファイル（config.js）がまだありません。'; render(); return; }
  firebase.initializeApp(FIREBASE);
  const fs = firebase.firestore();
  try { fs.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
  S.db = makeApi(fs);
  firebase.auth().onAuthStateChanged(u => {
    if (u) { S.login = false; listen(fs); render(); }
    else { S.login = true; render(); }
  });
}
start();

/* ---- 全店の在庫を探す（右下の虫めがね） ---- */
(function () {
  const kata = t => t.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
  const FILL = /(在庫|ざいこ|何個|なんこ|何本|なんぼん|何箱|なんはこ|何袋|いくつ|幾つ|どれくらい|どのくらい|残り|のこり|教えて|おしえて|ありますか|あります|ある|ですか|です|って|は|が|を|も|？|\?|、|。)/g;
  const STOREW = [['liss', /リス|りす|liss/i], ['till', /ティル|てぃる|till/i], ['tonari', /トナリ|となり|tonari/i], ['hair', /ヘアデザイン|へあでざいん|hair|アチーブ|あちーぶ/i]];
  const SYN = [[/リファ|りふぁ/g, ' ReFa '], [/ビューテック|びゅーてっく/g, ' BEAUTECH '], [/ドライヤー|どらいやー/g, ' DRYER '], [/アイロン|あいろん/g, ' IRON '], [/ストレート|すとれーと/g, ' STRAIGHT '], [/カール|かーる/g, ' CURL '], [/シャンプー|しゃんぷー/g, ' SP '], [/トリートメント|とりーとめんと/g, ' TR '], [/サファイア|さふぁいあ/g, ' SA '], [/アメジスト|あめじすと/g, ' AM '], [/シルバー|しるばー/g, ' SI '], [/グレーパール|ぐれーぱーる/g, ' GP '], [/エメラルド|えめらるど/g, ' EM '], [/オーシャン|おーしゃん/g, ' OC '], [/ボルドー|ぼるどー/g, ' BOR ']];
  const normName = t => kata(String(t || '').normalize('NFKC').toLowerCase()).replace(/[\s・\-‐－―ー\/／_.,()（）]/g, '').replace(/(\d)の(?=\d)/g, '$1');
  function parseQuery(raw) {
    let t = String(raw || '').normalize('NFKC');
    let store = '';
    for (const [id, re] of STOREW) if (re.test(t)) { store = id; t = t.replace(re, ' '); break; }
    SYN.forEach(([re, v]) => { t = t.replace(re, v); });
    t = t.replace(/(\d)\s*の\s*(\d)/g, '$1$2').replace(FILL, ' ');
    return { store, q: normName(t) };
  }
  const grams = s => { const g = new Map(); for (let i = 0; i < s.length - 1; i++) { const k = s.slice(i, i + 2); g.set(k, (g.get(k) || 0) + 1); } return g; };
  function score(q, n) {
    if (!q || !n) return 0;
    if (n === q) return 3;
    if (n.includes(q)) return 2 + q.length / n.length;
    const A = grams(q), B = grams(n); let hit = 0, tot = 0;
    A.forEach((v, k) => { tot += v; hit += Math.min(v, B.get(k) || 0); });
    let d = tot ? hit / tot : 0;
    const qd = (q.match(/\d+/g) || []).join(''), nd = (n.match(/\d+/g) || []).join('');
    if (qd) d += qd === nd ? .4 : nd.includes(qd) ? .15 : -.3;
    return d;
  }
  const uni = (q, n) => { const m = new Map(); for (const c of n) m.set(c, (m.get(c) || 0) + 1); let h = 0; for (const c of q) { const v = m.get(c) || 0; if (v) { h++; m.set(c, v - 1); } } return q.length ? h / q.length : 0; };
  function search(raw) {
    const { store, q } = parseQuery(raw);
    const all = S.items.map(it => { const n = normName(it.name); return { it, s: Math.max(score(q, n), .6 * uni(q, n) - .05) }; }).sort((a, b) => b.s - a.s);
    const list = all.filter(x => x.s >= .45).slice(0, 6);
    const guess = list.length ? [] : all.filter(x => x.s >= .2).slice(0, 6);
    return { store: store || S.store, list, guess, q };
  }
  const head = n => (String(n).normalize('NFKC').split(/[\s　]+/)[0] || '');
  const series = n => { const m = String(n).normalize('NFKC').match(/^(.*?\D)(\d+)[-‐ー]/); return m ? m[1].trim() + ' ' + m[2] + '-' : ''; };
  function related(base, shown) {
    const it = base.it, h = head(it.name), sr = series(it.name), nb = normName(it.name);
    return S.items.filter(x => !shown.has(x.id) && (x.category || '') === (it.category || '') && (sr ? x.name.normalize('NFKC').startsWith(sr) || head(x.name) === h : head(x.name) === h))
      .map(x => ({ it: x, s: score(nb, normName(x.name)) + (sr && x.name.normalize('NFKC').startsWith(sr) ? 1 : 0) })).sort((a, b) => b.s - a.s).slice(0, 6);
  }
  const spoken = n => String(n).replace(/(\d)-(\d)/g, '$1の$2').replace(/\//g, ' ');
  function speak() {}
  function card(it, store, top) {
    const stores = STORES, u = esc(uTxt(it.unit));
    const cells = stores.filter(sx => sx.id === store || carried(it, sx.id)).map(sx => `<span class="${sx.id === store ? 'cur' : ''}">${esc(sx.short)} <b>${qtyOf(sx.id, it.id)}</b>${u}</span>`).join('');
    return `<div class="vitem${top ? ' top' : ''}"><div class="vname">${esc(it.name)}${it.ended ? ' <span class="pill ended">取扱終了</span>' : ''}</div><div class="vqty">${cells}</div></div>`;
  }
  function show(raw, talk) {
    const r = search(raw), res = $('vres'), st = $('vstat');
    if (!r.q) { st.textContent = '商品名を入れてください（例：プレトワ 8-01）'; res.innerHTML = ''; return; }
    if (!r.list.length) {
      if (!r.guess.length) { st.textContent = `「${raw}」に近い商品が見つかりませんでした。`; res.innerHTML = ''; if (talk) speak('見つかりませんでした'); return; }
      st.textContent = `「${raw}」ははっきり特定できませんでした。もしかしてこちら？`;
      const shown = new Set(r.guess.map(x => x.it.id)), rel = related(r.guess[0], shown);
      res.innerHTML = r.guess.map(x => card(x.it, r.store, false)).join('') + (rel.length ? `<div class="vstat">関連商品</div>` + rel.map(x => card(x.it, r.store, false)).join('') : '');
      if (talk) speak(`はっきり分かりませんでした。${spoken(r.guess[0].it.name)}などを画面に出しました`);
      return;
    }
    const top = r.list[0], clear = r.list.length === 1 || top.s - r.list[1].s > .25 || (top.s >= 3 && r.list[1].s < 3);
    st.textContent = clear ? `「${raw}」` : `「${raw}」に近い商品が${r.list.length}件あります`;
    const shown = new Set(r.list.map(x => x.it.id)), rel = related(top, shown);
    res.innerHTML = r.list.map((x, i) => card(x.it, r.store, i === 0 && clear)).join('') + (rel.length ? `<div class="vstat">関連商品</div>` + rel.map(x => card(x.it, r.store, false)).join('') : '');
    if (talk) {
      if (clear) { const it = top.it; speak(`${spoken(it.name)}、${storeOf(r.store).short === 'hair design' ? 'ヘアデザイン' : storeOf(r.store).short}は${qtyOf(r.store, it.id)}${(it.unit || '').replace(/^[0-9０-９].*/, '')}です`); }
      else speak(`候補が${r.list.length}件あります。画面で選んでください`);
    }
  }
  function openPanel() { $('vpanel').hidden = false; $('vbtn').setAttribute('aria-expanded', 'true'); $('vbtn-l').textContent = '閉じる'; }
  function closePanel() { $('vpanel').hidden = true; $('vbtn').setAttribute('aria-expanded', 'false'); $('vbtn-l').textContent = '全店在庫'; }
  function listen() { if (!$('vpanel').hidden) { closePanel(); return; } openPanel(); const q = $('vq'); q.focus(); if (q.value) show(q.value, false); }
  document.addEventListener('click', ev => {
    if (ev.target.closest('#vbtn')) { listen(); return; }
    if (ev.target.closest('#vclose')) { closePanel(); return; }
  });
  document.addEventListener('keydown', ev => { if (ev.target.id === 'vq' && ev.key === 'Enter') { ev.preventDefault(); show(ev.target.value, false); ev.target.blur(); } });
  document.addEventListener('input', ev => { if (ev.target.id === 'vq') show(ev.target.value, false); });
  window.voiceSearch = search;
})();
