<body>
<header><div class="wrap head">
  <div class="brand">achieve<small>現金出納帳</small></div>
  <button type="button" class="who" id="who" data-act="whoSwitch" hidden></button>
</div></header>
<main class="wrap" id="main"><div class="empty">読み込んでいます</div></main>
<div id="sheet"></div>
<nav id="nav" hidden><div class="wrap tabs" id="tabs"></div></nav>
<div id="toast" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="who.js?v=3"></script>
<script>
/* achieve 現金出納帳（オーナー専用）
   cash_entries: { store, date:'YYYY-MM-DD', kind:'in'|'out', amount, cat, memo, at }
   cash_counts : { store, date, amount, at }  … 実際に数えた現金
   cash_settings/main : { opening: { hair:{amount,date}, ... }, cats: { in:[...], out:[...] } } */
const STORES = [['hair', 'achieve hair design'], ['liss', 'achieve Liss'], ['till', 'achieve till']];
const DEF_CATS = {
  in: ['売上から補充', '釣銭準備金', '立替の戻り', '雑収入', 'その他入金'],
  out: ['銀行へ預け入れ', '消耗品費', '事務用品費', 'ドリンク・お茶菓子', '交通費', '通信費', '修繕費', '接待交際費', '福利厚生費', '広告宣伝費', '支払手数料', '雑費'],
};
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const yen = n => (n < 0 ? '−¥' : '¥') + Math.abs(Math.round(n || 0)).toLocaleString('ja-JP');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const nowYm = () => today().slice(0, 7);
const shiftYm = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const ymLabel = ym => { const [y, m] = ym.split('-'); return `${y}年${Number(m)}月`; };
const dLabel = s => { const d = new Date(s + 'T00:00:00'); return `${d.getMonth() + 1}/${d.getDate()}(${'日月火水木金土'[d.getDay()]})`; };
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const S = {
  user: undefined, ready: new Set(), entries: [], counts: [], settings: {}, err: '',
  tab: 'book', store: lsGet('cash.store') || 'hair', ym: nowYm(), edit: null, kind: 'out',
};
const cats = kind => (S.settings.cats && S.settings.cats[kind] && S.settings.cats[kind].length ? S.settings.cats[kind] : DEF_CATS[kind]);
const opening = st => (S.settings.opening && S.settings.opening[st]) || { amount: 0, date: '' };
const storeName = st => (STORES.find(s => s[0] === st) || [, st])[1];

/* ---- 計算 ---- */
const sortE = (a, b) => a.date.localeCompare(b.date) || (a.at || 0) - (b.at || 0);
function entriesOf(st) {
  const op = opening(st);
  return S.entries.filter(e => e.store === st && (!op.date || e.date >= op.date)).sort(sortE);
}
const signed = e => e.kind === 'in' ? Number(e.amount) || 0 : -(Number(e.amount) || 0);
function balanceBefore(st, date) { // date より前の残高
  return entriesOf(st).filter(e => e.date < date).reduce((a, e) => a + signed(e), Number(opening(st).amount) || 0);
}
function monthRows(st, ym) {
  let bal = balanceBefore(st, ym + '-01');
  const carry = bal;
  const rows = entriesOf(st).filter(e => e.date.slice(0, 7) === ym).map(e => { bal += signed(e); return Object.assign({ bal }, e); });
  const tin = rows.filter(r => r.kind === 'in').reduce((a, r) => a + Number(r.amount), 0);
  const tout = rows.filter(r => r.kind === 'out').reduce((a, r) => a + Number(r.amount), 0);
  return { carry, rows, tin, tout, end: carry + tin - tout };
}
const curBalance = st => entriesOf(st).reduce((a, e) => a + signed(e), Number(opening(st).amount) || 0);
function catTotals(rows) {
  const o = { in: {}, out: {} };
  rows.forEach(r => { o[r.kind][r.cat || '未分類'] = (o[r.kind][r.cat || '未分類'] || 0) + Number(r.amount); });
  return o;
}

/* ---- 描画 ---- */
function render() {
  const m = $('main');
  $('who').hidden = !S.user || !WHO.me;
  if (S.user === undefined) { m.innerHTML = '<div class="empty">読み込んでいます</div>'; return; }
  if (!S.user) { $('nav').hidden = true; m.innerHTML = loginView(); return; }
  if (S.err) { m.innerHTML = `<div class="card"><div class="err">${esc(S.err)}</div></div>`; return; }
  const g = WHO.gate(); if (g) { $('nav').hidden = true; m.innerHTML = g; return; }
  $('who').innerHTML = WHO.bar() + ' <span class="sw">切替</span>';
  if (!WHO.isOwner()) { $('nav').hidden = true; m.innerHTML = '<div class="card"><h3>オーナー専用です</h3><div class="sub">現金出納帳はオーナーだけが使えます。</div></div>'; return; }
  if (S.ready.size < 3) { m.innerHTML = '<div class="empty">読み込んでいます</div>'; return; }
  const tabs = [['book', '記帳'], ['month', '月次・Excel'], ['set', '設定']];
  $('nav').hidden = false;
  $('tabs').innerHTML = tabs.map(([id, l]) => `<button type="button" data-act="tab" data-id="${id}" ${S.tab === id ? 'aria-current="page"' : ''}>${l}</button>`).join('');
  m.innerHTML = (S.tab === 'set' ? '' : storeChips()) + (S.tab === 'book' ? bookView() : S.tab === 'month' ? monthView() : setView());
  renderSheet();
}
function loginView() {
  return `<form class="card login" id="login-form"><h3>ログイン</h3><div class="sub">在庫アプリと同じアカウントでログインします。</div>
    <label class="lbl">メールアドレス<input class="field" id="lg-email" type="email" autocomplete="username" required></label>
    <label class="lbl">パスワード<input class="field" id="lg-pass" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lg-err"></div><button class="btn primary">ログイン</button></form>`;
}
const storeChips = () => `<div class="chips">${STORES.map(([id, l]) => `<button type="button" class="chip" data-act="store" data-id="${id}" aria-pressed="${S.store === id}">${esc(l.replace('achieve ', ''))}</button>`).join('')}${S.tab === 'month' ? `<button type="button" class="chip" data-act="store" data-id="all" aria-pressed="${S.store === 'all'}">3店舗まとめ</button>` : ''}</div>`;
const mnav = () => `<div class="mnav"><button type="button" class="btn small" data-act="ym" data-n="-1" aria-label="前の月">‹</button><b>${ymLabel(S.ym)}</b><button type="button" class="btn small" data-act="ym" data-n="1" aria-label="次の月" ${S.ym >= nowYm() ? 'disabled' : ''}>›</button></div>`;

function entryForm(e) {
  const k = e.kind;
  const list = cats(k);
  return `<div class="seg"><button type="button" data-act="kind" data-id="out" aria-pressed="${k === 'out'}">出金</button><button type="button" data-act="kind" data-id="in" aria-pressed="${k === 'in'}">入金</button></div>
    <div class="grid2">
      <label class="lbl">日付<input class="field" id="f-date" type="date" value="${esc(e.date || today())}"></label>
      <label class="lbl">金額（円）<input class="field amt" id="f-amt" type="number" inputmode="numeric" min="0" placeholder="0" value="${e.amount ?? ''}"></label>
    </div>
    <label class="lbl">勘定科目<select class="field" id="f-cat">${list.map(c => `<option ${c === e.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}${e.cat && !list.includes(e.cat) ? `<option selected>${esc(e.cat)}</option>` : ''}</select></label>
    <label class="lbl">摘要（内容・支払先）<input class="field" id="f-memo" value="${esc(e.memo || '')}" placeholder="例：ダイソー ゴム手袋"></label>`;
}
function bookView() {
  const st = S.store, bal = curBalance(st), mr = monthRows(st, S.ym);
  const lastCount = S.counts.filter(c => c.store === st).sort((a, b) => b.date.localeCompare(a.date) || b.at - a.at)[0];
  const form = `<section class="card"><div class="card-head"><h3>記帳する</h3></div>${entryForm({ kind: S.kind, date: S.draftDate || today() })}
    <button type="button" class="btn primary" data-act="add">記帳する</button></section>`;
  const hero = `<section class="hero"><div class="sub">${esc(storeName(st))} の現在の帳簿残高</div><div class="lv-big">${yen(bal)}</div>
    <div class="hrow"><span>今月 入金 ${yen(monthRows(st, nowYm()).tin)}</span><span>出金 ${yen(monthRows(st, nowYm()).tout)}</span></div>
    ${lastCount ? `<div class="hrow"><span>最後に数えた現金 ${dLabel(lastCount.date)} ${yen(lastCount.amount)}（差額 ${diffStr(lastCount.amount - balAt(st, lastCount.date))}）</span></div>` : ''}
    <button type="button" class="btn small ghost" data-act="count">現金を数えて照合する</button></section>`;
  return hero + form + `<div class="group"><h2><span>${ymLabel(S.ym)}の記帳</span><span>${mr.rows.length}件</span></h2>${mnav()}${ledger(mr, true)}</div>`;
}
const balAt = (st, date) => entriesOf(st).filter(e => e.date <= date).reduce((a, e) => a + signed(e), Number(opening(st).amount) || 0);
const diffStr = d => d === 0 ? '<b>±0</b>' : `<b class="${d < 0 ? 'neg' : 'pos'}">${d > 0 ? '+' : '−'}¥${Math.abs(d).toLocaleString('ja-JP')}</b>`;
function ledger(mr, clickable) {
  const body = mr.rows.slice().reverse().map(r => `<${clickable ? 'button type="button" data-act="open" data-id="' + r.id + '"' : 'div'} class="lrow">
      <span class="ld">${dLabel(r.date)}</span>
      <span class="lm"><span class="name">${esc(r.cat || '')}</span>${r.memo ? `<span class="sub">${esc(r.memo)}</span>` : ''}</span>
      <span class="la ${r.kind}">${r.kind === 'in' ? '+' : '−'}${Math.round(r.amount).toLocaleString('ja-JP')}</span>
      <span class="lb">${yen(r.bal)}</span></${clickable ? 'button' : 'div'}>`).join('');
  return `<div class="list ledger">${body || '<div class="empty" style="padding:18px">この月の記帳はまだありません</div>'}
    <div class="lrow foot"><span class="ld">前月繰越</span><span class="lm"></span><span class="la"></span><span class="lb">${yen(mr.carry)}</span></div></div>`;
}
function monthView() {
  const ym = S.ym, list = S.store === 'all' ? STORES.map(s => s[0]) : [S.store];
  const blocks = list.map(st => {
    const mr = monthRows(st, ym), ct = catTotals(mr.rows);
    const catList = kind => Object.entries(ct[kind]).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<div class="crow"><span>${esc(c)}</span><span class="num">${yen(v)}</span></div>`).join('') || '<div class="sub">なし</div>';
    return `<section class="card"><div class="card-head"><h3>${esc(storeName(st))}</h3></div>
      <div class="sum4"><div><span>前月繰越</span><b>${yen(mr.carry)}</b></div><div><span>入金</span><b class="pos">${yen(mr.tin)}</b></div><div><span>出金</span><b class="neg">${yen(mr.tout)}</b></div><div><span>月末残高</span><b>${yen(mr.end)}</b></div></div>
      <div class="cols"><div><div class="sec-t">出金の科目別</div>${catList('out')}</div><div><div class="sec-t">入金の科目別</div>${catList('in')}</div></div></section>`;
  }).join('');
  return mnav() + blocks + `<section class="card"><div class="card-head"><h3>Excelに書き出す</h3></div>
    <div class="sub">${S.store === 'all' ? '3店舗それぞれの出納帳と、科目別の集計をシートに分けて書き出します。' : '出納帳（日付・科目・摘要・入金・出金・残高）と科目別の集計を書き出します。'}</div>
    <div class="actions"><button type="button" class="btn primary" data-act="xlsx" data-span="month">${ymLabel(ym)}を書き出す</button><button type="button" class="btn" data-act="xlsx" data-span="year">${ym.slice(0, 4)}年1月〜${Number(ym.slice(5))}月を書き出す</button></div></section>`;
}
function setView() {
  const op = S.settings.opening || {};
  return `<section class="card"><div class="card-head"><h3>開始残高</h3></div>
    <div class="sub">出納帳を始める日と、その日の朝にあった現金を店舗ごとに入れてください。この日より前の記帳は計算に入りません。</div>
    ${STORES.map(([id, l]) => `<div class="grid2"><label class="lbl">${esc(l)}　開始日<input class="field" id="op-d-${id}" type="date" value="${esc((op[id] || {}).date || '')}"></label><label class="lbl">開始時の現金（円）<input class="field" id="op-a-${id}" type="number" inputmode="numeric" value="${(op[id] || {}).amount ?? ''}"></label></div>`).join('')}
    <button type="button" class="btn primary" data-act="saveOpening">保存</button></section>
    <section class="card"><div class="card-head"><h3>勘定科目</h3></div><div class="sub">1行に1つ。上から順に選択肢に並びます。</div>
    <label class="lbl">出金の科目<textarea class="field" id="cat-out" style="min-height:200px">${esc(cats('out').join('\n'))}</textarea></label>
    <label class="lbl">入金の科目<textarea class="field" id="cat-in" style="min-height:120px">${esc(cats('in').join('\n'))}</textarea></label>
    <button type="button" class="btn primary" data-act="saveCats">保存</button></section>`;
}
function renderSheet() {
  const box = $('sheet');
  if (!S.edit) { box.innerHTML = ''; document.body.style.overflow = ''; return; }
  const e = S.edit;
  if (e.mode === 'count') {
    const st = S.store, b = balAt(st, e.date || today());
    box.innerHTML = `<div class="sheet-bg" data-act="close"><div class="sheet" data-stop="1" role="dialog" aria-modal="true" aria-label="現金の照合">
      <h3>現金を数えて照合</h3><div class="sub">${esc(storeName(st))}</div>
      <div class="grid2"><label class="lbl">数えた日<input class="field" id="c-date" type="date" value="${esc(e.date || today())}" data-chg="cdate"></label>
      <label class="lbl">実際の現金（円）<input class="field amt" id="c-amt" type="number" inputmode="numeric" value="${e.amount ?? ''}" data-inp="camt"></label></div>
      <div class="kv"><dt>帳簿残高</dt><dd>${yen(b)}</dd><dt>差額</dt><dd id="c-diff">${e.amount != null && e.amount !== '' ? diffStr(Number(e.amount) - b) : '—'}</dd></div>
      <div class="sub">差額がある場合は、原因が分かれば記帳を直してください。分からない場合は「雑費／雑収入」で調整できます。</div>
      <div class="actions"><button type="button" class="btn primary" data-act="saveCount">記録する</button><button type="button" class="btn" data-act="adjust">差額を記帳して合わせる</button><button type="button" class="btn" data-act="close">やめる</button></div></div></div>`;
  } else {
    box.innerHTML = `<div class="sheet-bg" data-act="close"><div class="sheet" data-stop="1" role="dialog" aria-modal="true" aria-label="記帳を直す">
      <h3>記帳を直す</h3>${entryForm(e)}
      <div class="actions"><button type="button" class="btn primary" data-act="saveEdit">保存</button><button type="button" class="btn danger" data-act="del">${e.confirmDel ? '本当に削除する' : '削除'}</button><button type="button" class="btn" data-act="close">やめる</button></div></div></div>`;
  }
  document.body.style.overflow = 'hidden';
}

/* ---- 書き込み ---- */
function readForm() {
  const amount = Math.round(Number($('f-amt').value));
  const date = $('f-date').value;
  if (!date) { toast('日付を入れてください'); return null; }
  if (!amount || amount <= 0) { toast('金額を入れてください'); return null; }
  return { date, amount, cat: $('f-cat').value, memo: $('f-memo').value.trim() };
}
async function addEntry() {
  const f = readForm(); if (!f) return;
  await db.collection('cash_entries').add(Object.assign({ store: S.store, kind: S.kind, at: Date.now() }, f));
  S.draftDate = f.date;
  toast(`${S.kind === 'in' ? '入金' : '出金'} ${yen(f.amount)} を記帳しました`);
  S.ym = f.date.slice(0, 7);
}

/* ---- Excel ---- */
function xlsxExport(span) {
  if (!window.XLSX) { toast('Excelの機能を読み込めませんでした。通信を確認してください'); return; }
  const list = S.store === 'all' ? STORES.map(s => s[0]) : [S.store];
  const months = span === 'year' ? Array.from({ length: Number(S.ym.slice(5)) }, (_, i) => `${S.ym.slice(0, 4)}-${pad(i + 1)}`) : [S.ym];
  const wb = XLSX.utils.book_new();
  const short = st => storeName(st).replace('achieve ', '');
  const sum = [['店舗', '期間', '前月繰越', '入金', '出金', '月末残高']], catRows = [['店舗', '区分', '勘定科目', '金額']];
  list.forEach(st => {
    const aoa = [[`現金出納帳　${storeName(st)}`], [], ['日付', '勘定科目', '摘要', '入金', '出金', '残高']];
    const ct = { in: {}, out: {} };
    months.forEach((ym, i) => {
      const mr = monthRows(st, ym);
      if (i === 0) aoa.push([ym + '-01', '', '前月繰越', null, null, mr.carry]);
      mr.rows.forEach(r => { aoa.push([r.date, r.cat || '', r.memo || '', r.kind === 'in' ? Number(r.amount) : null, r.kind === 'out' ? Number(r.amount) : null, r.bal]); ct[r.kind][r.cat || '未分類'] = (ct[r.kind][r.cat || '未分類'] || 0) + Number(r.amount); });
      sum.push([short(st), ymLabel(ym), mr.carry, mr.tin, mr.tout, mr.end]);
    });
    const first = monthRows(st, months[0]), last = monthRows(st, months[months.length - 1]);
    const tin = months.reduce((a, ym) => a + monthRows(st, ym).tin, 0), tout = months.reduce((a, ym) => a + monthRows(st, ym).tout, 0);
    aoa.push([], ['', '', '合計', tin, tout, last.end]);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 12 }, { wch: 16 }, { wch: 32 }, { wch: 11 }, { wch: 11 }, { wch: 12 }];
    const rng = XLSX.utils.decode_range(ws['!ref']);
    for (let R = 3; R <= rng.e.r; R++) for (const C of [3, 4, 5]) { const c = ws[XLSX.utils.encode_cell({ r: R, c: C })]; if (c && c.t === 'n') c.z = '#,##0'; }
    XLSX.utils.book_append_sheet(wb, ws, short(st).slice(0, 28));
    ['out', 'in'].forEach(k => Object.entries(ct[k]).sort((a, b) => b[1] - a[1]).forEach(([c, v]) => catRows.push([short(st), k === 'in' ? '入金' : '出金', c, v])));
    void first;
  });
  const ws2 = XLSX.utils.aoa_to_sheet(sum); ws2['!cols'] = [{ wch: 14 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, ws2, '月次集計');
  const ws3 = XLSX.utils.aoa_to_sheet(catRows); ws3['!cols'] = [{ wch: 14 }, { wch: 8 }, { wch: 20 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, ws3, '科目別集計');
  const name = `現金出納帳_${S.store === 'all' ? '3店舗' : short(S.store)}_${span === 'year' ? S.ym.slice(0, 4) + '年1-' + Number(S.ym.slice(5)) + '月' : S.ym}.xlsx`;
  XLSX.writeFile(wb, name);
  toast('Excelファイルを書き出しました');
}

/* ---- 操作 ---- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'close' && ev.target.closest('[data-stop]') && !ev.target.closest('button[data-act="close"]')) return;
  const a = el.dataset.act, id = el.dataset.id;
  try {
    if (a === 'whoSwitch') { WHO.handle('whoOut', el); return; }
    if (await WHO.handle(a, el)) return;
    switch (a) {
      case 'tab': S.tab = id; if (id !== 'month' && S.store === 'all') S.store = 'hair'; render(); window.scrollTo(0, 0); break;
      case 'store': S.store = id; if (id !== 'all') lsSet('cash.store', id); render(); break;
      case 'ym': S.ym = shiftYm(S.ym, Number(el.dataset.n)); render(); break;
      case 'kind':
        if (S.edit && S.edit.mode !== 'count') { Object.assign(S.edit, keepForm(), { kind: id, cat: cats(id)[0] }); renderSheet(); }
        else { const keep = keepForm(); S.kind = id; render(); restoreForm(keep, true); }
        break;
      case 'add': el.disabled = true; await addEntry(); break;
      case 'open': { const e = S.entries.find(x => x.id === id); if (e) { S.edit = Object.assign({}, e); renderSheet(); } break; }
      case 'close': S.edit = null; renderSheet(); break;
      case 'saveEdit': { const f = readForm(); if (!f) break; await db.doc('cash_entries/' + S.edit.id).update(Object.assign({ kind: S.edit.kind }, f)); S.edit = null; renderSheet(); toast('直しました'); break; }
      case 'del': if (!S.edit.confirmDel) { Object.assign(S.edit, keepForm(), { confirmDel: true }); renderSheet(); break; } await db.doc('cash_entries/' + S.edit.id).delete(); S.edit = null; renderSheet(); toast('削除しました'); break;
      case 'count': S.edit = { mode: 'count', date: today(), amount: '' }; renderSheet(); break;
      case 'saveCount': case 'adjust': {
        const date = $('c-date').value, amount = Math.round(Number($('c-amt').value));
        if (!date || $('c-amt').value === '') { toast('日付と金額を入れてください'); break; }
        const d = amount - balAt(S.store, date);
        await db.collection('cash_counts').add({ store: S.store, date, amount, diff: d, at: Date.now() });
        if (a === 'adjust' && d !== 0) await db.collection('cash_entries').add({ store: S.store, kind: d > 0 ? 'in' : 'out', date, amount: Math.abs(d), cat: d > 0 ? '雑収入' : '雑費', memo: '現金過不足（照合で調整）', at: Date.now() });
        S.edit = null; renderSheet(); toast(d === 0 ? 'ぴったり合っています' : a === 'adjust' ? '差額を記帳して合わせました' : '照合を記録しました');
        break;
      }
      case 'saveOpening': {
        const op = {}; STORES.forEach(([s]) => { op[s] = { date: $('op-d-' + s).value, amount: Math.round(Number($('op-a-' + s).value) || 0) }; });
        await db.doc('cash_settings/main').set({ opening: op }, { merge: true }); toast('開始残高を保存しました'); break;
      }
      case 'saveCats': {
        const p = id2 => [...new Set($(id2).value.split('\n').map(x => x.trim()).filter(Boolean))];
        await db.doc('cash_settings/main').set({ cats: { out: p('cat-out'), in: p('cat-in') } }, { merge: true }); toast('勘定科目を保存しました'); break;
      }
      case 'xlsx': xlsxExport(el.dataset.span); break;
    }
  } catch (e) { toast('エラー：' + e.message); el.disabled = false; }
});
document.addEventListener('input', ev => {
  if (ev.target.dataset.inp === 'camt' && S.edit) { S.edit.amount = ev.target.value; const b = balAt(S.store, $('c-date').value || today()); $('c-diff').innerHTML = ev.target.value === '' ? '—' : diffStr(Math.round(Number(ev.target.value)) - b); }
});
document.addEventListener('change', ev => {
  if (ev.target.dataset.chg === 'cdate' && S.edit) { S.edit.date = ev.target.value; S.edit.amount = $('c-amt').value; renderSheet(); }
});
function keepForm() { return $('f-amt') ? { date: $('f-date').value, amount: $('f-amt').value, memo: $('f-memo').value } : {}; }
function restoreForm(k, skipCat) { if (!$('f-amt')) return; if (k.date) $('f-date').value = k.date; if (k.amount != null) $('f-amt').value = k.amount; if (k.memo != null) $('f-memo').value = k.memo; void skipCat; }
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'login-form') return; ev.preventDefault();
  try { await firebase.auth().signInWithEmailAndPassword($('lg-email').value.trim(), $('lg-pass').value); } catch (e) { $('lg-err').textContent = 'メールアドレスかパスワードが違います'; }
});

let db, started = false;
const typing = () => { const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && !S.edit; };
let pend = false;
const soft = () => { if (typing()) { if (!pend) { pend = true; const t = setInterval(() => { if (!typing()) { clearInterval(t); pend = false; render(); } }, 800); } return; } render(); };
function listen() {
  WHO.init(db, soft);
  const fail = e => { S.err = e.message; render(); };
  db.collection('cash_entries').onSnapshot(s => { S.entries = s.docs.map(d => Object.assign({ id: d.id }, d.data())); S.ready.add('e'); soft(); }, fail);
  db.collection('cash_counts').onSnapshot(s => { S.counts = s.docs.map(d => Object.assign({ id: d.id }, d.data())); S.ready.add('c'); soft(); }, fail);
  db.doc('cash_settings/main').onSnapshot(d => { S.settings = d.exists ? d.data() : {}; S.ready.add('s'); soft(); }, fail);
}
(function init() {
  if (typeof firebaseConfig === 'undefined' || !window.firebase) { $('main').innerHTML = '<div class="empty">設定ファイル（config.js）が読み込めません。</div>'; return; }
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebase.auth().onAuthStateChanged(u => { S.user = u || null; if (u && !started) { started = true; listen(); } render(); });
})();
</script>
</body>
</html>
