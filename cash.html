<body>
<header><div class="wrap head">
  <div class="brand">achieve<small>現金出納帳</small></div>
  <button type="button" class="who" id="who" data-act="whoSwitch" hidden></button>
</div></header>
<main class="wrap" id="main"><div class="empty">読み込んでいます</div></main>
<div id="sheet"></div>
<nav id="nav" hidden><div class="wrap tabs" id="tabs"></div></nav>
<div id="toast" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="who.js?v=3"></script>
<script>
/* achieve 現金出納帳（オーナー専用）
   cash_entries: { store, date:'YYYY-MM-DD', kind:'in'|'out', amount, cat, memo, at }
   cash_counts : { store, date, amount, at }  … 実際に数えた現金
   cash_settings/main : { opening: { hair:{amount,date}, ... }, cats: { in:[...], out:[...] } } */
const STORES = [['hair', 'achieve hair design'], ['liss', 'achieve Liss'], ['till', 'achieve till']];
const DEF_CATS = {
  in: ['売上から補充', '釣銭準備金', '立替の戻り', '雑収入', 'その他入金'],
  out: ['銀行へ預け入れ', '消耗品費', '事務用品費', 'ドリンク・お茶菓子', '交通費', '通信費', '修繕費', '接待交際費', '福利厚生費', '広告宣伝費', '支払手数料', '雑費'],
};
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const yen = n => (n < 0 ? '−¥' : '¥') + Math.abs(Math.round(n || 0)).toLocaleString('ja-JP');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const nowYm = () => today().slice(0, 7);
const shiftYm = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const ymLabel = ym => { const [y, m] = ym.split('-'); return `${y}年${Number(m)}月`; };
const dLabel = s => { const d = new Date(s + 'T00:00:00'); return `${d.getMonth() + 1}/${d.getDate()}(${'日月火水木金土'[d.getDay()]})`; };
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const S = {
  user: undefined, ready: new Set(), entries: [], counts: [], settings: {}, err: '',
  tab: 'book', store: lsGet('cash.store') || 'hair', ym: nowYm(), edit: null, kind: 'out',
};
const cats = kind => (S.settings.cats && S.settings.cats[kind] && S.settings.cats[kind].length ? S.settings.cats[kind] : DEF_CATS[kind]);
const opening = st => (S.settings.opening && S.settings.opening[st]) || { amount: 0, date: '' };
const storeName = st => (STORES.find(s => s[0] === st) || [, st])[1];

/* ---- 計算 ---- */
const sortE = (a, b) => a.date.localeCompare(b.date) || (a.at || 0) - (b.at || 0);
function entriesOf(st) {
  const op = opening(st);
  return S.entries.filter(e => e.store === st && (!op.date || e.date >= op.date)).sort(sortE);
}
const signed = e => e.kind === 'in' ? Number(e.amount) || 0 : -(Number(e.amount) || 0);
function balanceBefore(st, date) { // date より前の残高
  return entriesOf(st).filter(e => e.date < date).reduce((a, e) => a + signed(e), Number(opening(st).amount) || 0);
}
function monthRows(st, ym) {
  let bal = balanceBefore(st, ym + '-01');
  const carry = bal;
  const rows = entriesOf(st).filter(e => e.date.slice(0, 7) === ym).map(e => { bal += signed(e); return Object.assign({ bal }, e); });
  const tin = rows.filter(r => r.kind === 'in').reduce((a, r) => a + Number(r.amount), 0);
  const tout = rows.filter(r => r.kind === 'out').reduce((a, r) => a + Number(r.amount), 0);
  return { carry, rows, tin, tout, end: carry + tin - tout };
}
const curBalance = st => entriesOf(st).reduce((a, e) => a + signed(e), Number(opening(st).amount) || 0);
function catTotals(rows) {
  const o = { in: {}, out: {} };
  rows.forEach(r => { o[r.kind][r.cat || '未分類'] = (o[r.kind][r.cat || '未分類'] || 0) + Number(r.amount); });
  return o;
}

/* ---- 描画 ---- */
function render() {
  const m = $('main');
  $('who').hidden = !S.user || !WHO.me;
  if (S.user === undefined) { m.innerHTML = '<div class="empty">読み込んでいます</div>'; return; }
  if (!S.user) { $('nav').hidden = true; m.innerHTML = loginView(); return; }
  if (S.err) { m.innerHTML = `<div class="card"><div class="err">${esc(S.err)}</div></div>`; return; }
  const g = WHO.gate(); if (g) { $('nav').hidden = true; m.innerHTML = g; return; }
  $('who').innerHTML = WHO.bar() + ' <span class="sw">切替</span>';
  if (!WHO.isOwner()) { $('nav').hidden = true; m.innerHTML = '<div class="card"><h3>オーナー専用です</h3><div class="sub">現金出納帳はオーナーだけが使えます。</div></div>'; return; }
  if (S.ready.size < 3) { m.innerHTML = '<div class="empty">読み込んでいます</div>'; return; }
  const tabs = [['book', '記帳'], ['month', '月次・Excel'], ['set', '設定']];
  $('nav').hidden = false;
  $('tabs').innerHTML = tabs.map(([id, l]) => `<button type="button" data-act="tab" data-id="${id}" ${S.tab === id ? 'aria-current="page"' : ''}>${l}</button>`).join('');
  m.innerHTML = (S.tab === 'set' ? '' : storeChips()) + (S.tab === 'book' ? bookView() : S.tab === 'month' ? monthView() : setView());
  renderSheet();
}
function loginView() {
  return `<form class="card login" id="login-form"><h3>ログイン</h3><div class="sub">在庫アプリと同じアカウントでログインします。</div>
    <label class="lbl">メールアドレス<input class="field" id="lg-email" type="email" autocomplete="username" required></label>
    <label class="lbl">パスワード<input class="field" id="lg-pass" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lg-err"></div><button class="btn primary">ログイン</button></form>`;
}
const storeChips = () => `<div class="chips">${STORES.map(([id, l]) => `<button type="button" class="chip" data-act="store" data-id="${id}" aria-pressed="${S.store === id}">${esc(l.replace('achieve ', ''))}</button>`).join('')}${S.tab === 'month' ? `<button type="button" class="chip" data-act="store" data-id="all" aria-pressed="${S.store === 'all'}">3店舗まとめ</button>` : ''}</div>`;
const mnav = () => `<div class="mnav"><button type="button" class="btn small" data-act="ym" data-n="-1" aria-label="前の月">‹</button><b>${ymLabel(S.ym)}</b><button type="button" class="btn small" data-act="ym" data-n="1" aria-label="次の月" ${S.ym >= nowYm() ? 'disabled' : ''}>›</button></div>`;

function entryForm(e) {
  const k = e.kind;
  const list = cats(k);
  return `<div class="seg"><button type="button" data-act="kind" data-id="out" aria-pressed="${k === 'out'}">出金</button><button type="button" data-act="kind" data-id="in" aria-pressed="${k === 'in'}">入金</button></div>
    <div class="grid2">
      <label class="lbl">日付<input class="field" id="f-date" type="date" value="${esc(e.date || today())}"></label>
      <label class="lbl">金額（円）<input class="field amt" id="f-amt" type="number" inputmode="numeric" min="0" placeholder="0" value="${e.amount ?? ''}"></label>
    </div>
    <label class="lbl">勘定科目<select class="field" id="f-cat">${list.map(c => `<option ${c === e.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}${e.cat && !list.includes(e.cat) ? `<option selected>${esc(e.cat)}</option>` : ''}</select></label>
    <label class="lbl">摘要（内容・支払先）<input class="field" id="f-memo" value="${esc(e.memo || '')}" placeholder="例：ダイソー ゴム手袋"></label>`;
}
function bookView() {
  const st = S.store, bal = curBalance(st), mr = monthRows(st, S.ym);
  const lastCount = S.counts.filter(c => c.store === st).sort((a, b) => b.date.localeCompare(a.date) || b.at - a.at)[0];
  const rc = S.rcpt || {};
  const rcBox = rc.busy ? `<div class="note" style="background:var(--info-soft);color:var(--info)">レシートを読んでいます…</div>`
    : rc.err ? `<div class="note" style="background:var(--bad-soft);color:var(--bad)"><span>${esc(rc.err)}</span><button type="button" class="btn small" data-act="rcClear">閉じる</button></div>`

function imgToBase64(file, max = 1600) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('画像を開けませんでした（JPEG/PNGで撮り直してください）')); };
    img.src = url;
  });
}
function rcPrompt() {

async function rcRead(file) {
  S.rcpt = { busy: true }; S.draft = null; render();
  try {
    const [x, b64] = await Promise.all([aiInit(), imgToBase64(file)]);
    const want = (S.settings.ai || {}).model;
    const list = x.okModel ? [x.okModel] : want ? [want] : AI_MODELS;
    let res, lastErr;
    for (const m of list) {
      try {
        const model = x.aiM.getGenerativeModel(x.gai, { model: m, generationConfig: { responseMimeType: 'application/json', temperature: 0 } });
        res = await model.generateContent([rcPrompt(), { inlineData: { mimeType: 'image/jpeg', data: b64 } }]);
        x.okModel = m; break;
      } catch (err) { lastErr = err; if (!/not ?found|404|not supported|unsupported|is not available/i.test(String(err && err.message))) break; }
    }
    if (!res) throw lastErr || new Error('読み取りに失敗しました');
    const txt = res.response.text().replace(/^```(json)?|```$/g, '').trim();
    const j = JSON.parse(txt);
    const list2 = (j.receipts || []).filter(r => r && Number(r.amount) > 0);
    if (!list2.length) throw new Error('レシートを読み取れませんでした' + (j.reason ? '：' + j.reason : ''));
    rcFill(list2[0], list2.slice(1));
  } catch (err) {
    const m = String(err && err.message || err);
    S.rcpt = { err: /app.?check|recaptcha|403|permission|attestation/i.test(m) ? '読み取りの認証に失敗しました。App Checkの設定（サイトキー・ドメイン登録）を確認してください。' : /quota|429|resource.?exhausted/i.test(m) ? '今日の無料の読み取り回数の上限に達したようです。時間をおいて試してください。' : '読み取りに失敗しました：' + m.slice(0, 160) };
  }
  render();
}
function rcFill(r, queue) {
  const kind = r.kind === 'in' ? 'in' : 'out';
  let cat = String(r.cat || '').trim();
  if (!cats(kind).includes(cat)) { const hit = cats(kind).find(c => cat && (c.includes(cat) || cat.includes(c))); cat = hit || cats(kind)[cats(kind).length - 1]; }
  const date = /^\d{4}-\d{2}-\d{2}$/.test(r.date || '') ? r.date : today();
  S.kind = kind;
  S.draft = { date, amount: Math.round(Number(r.amount)) || '', cat, memo: String(r.memo || r.store || '').trim().slice(0, 40) };

const IMP_COLS = [['date', '日付・日'], ['cat', '勘定科目'], ['partner', '取引先'], ['memo', '摘要'], ['in', '入金（収入）'], ['out', '出金（支払）'], ['bal', '残高']];

    if (await WHO.handle(a, el)) return;
    switch (a) {
      case 'tab': S.tab = id; if (id !== 'month' && S.store === 'all') S.store = 'hair'; render(); window.scrollTo(0, 0); break;
      case 'store': S.store = id; if (id !== 'all') lsSet('cash.store', id); render(); break;
      case 'ym': S.ym = shiftYm(S.ym, Number(el.dataset.n)); render(); break;
      case 'kind':
        if (S.edit && S.edit.mode !== 'count') { Object.assign(S.edit, keepForm(), { kind: id, cat: cats(id)[0] }); renderSheet(); }
        else { const keep = keepForm(); S.kind = id; if (S.draft) delete S.draft.cat; render(); restoreForm(keep, true); }
        break;
      case 'add': el.disabled = true; await addEntry(); break;
      case 'open': { const e = S.entries.find(x => x.id === id); if (e) { S.edit = Object.assign({}, e); renderSheet(); } break; }
      case 'close': S.edit = null; renderSheet(); break;
      case 'saveEdit': { const f = readForm(); if (!f) break; await db.doc('cash_entries/' + S.edit.id).update(Object.assign({ kind: S.edit.kind }, f)); S.edit = null; renderSheet(); toast('直しました'); break; }
      case 'del': if (!S.edit.confirmDel) { Object.assign(S.edit, keepForm(), { confirmDel: true }); renderSheet(); break; } await db.doc('cash_entries/' + S.edit.id).delete(); S.edit = null; renderSheet(); toast('削除しました'); break;
      case 'count': S.edit = { mode: 'count', date: today(), amount: '' }; renderSheet(); break;
      case 'saveCount': case 'adjust': {
        const date = $('c-date').value, amount = Math.round(Number($('c-amt').value));
        if (!date || $('c-amt').value === '') { toast('日付と金額を入れてください'); break; }
        const d = amount - balAt(S.store, date);
        await db.collection('cash_counts').add({ store: S.store, date, amount, diff: d, at: Date.now() });
        if (a === 'adjust' && d !== 0) await db.collection('cash_entries').add({ store: S.store, kind: d > 0 ? 'in' : 'out', date, amount: Math.abs(d), cat: d > 0 ? '雑収入' : '雑費', memo: '現金過不足（照合で調整）', at: Date.now() });
        S.edit = null; renderSheet(); toast(d === 0 ? 'ぴったり合っています' : a === 'adjust' ? '差額を記帳して合わせました' : '照合を記録しました');
        break;
      }
      case 'saveOpening': {
        const op = {}; STORES.forEach(([s]) => { op[s] = { date: $('op-d-' + s).value, amount: Math.round(Number($('op-a-' + s).value) || 0) }; });
        await db.doc('cash_settings/main').set({ opening: op }, { merge: true }); toast('開始残高を保存しました'); break;
      }
      case 'saveCats': {
        const p = id2 => [...new Set($(id2).value.split('\n').map(x => x.trim()).filter(Boolean))];
        await db.doc('cash_settings/main').set({ cats: { out: p('cat-out'), in: p('cat-in') } }, { merge: true }); toast('勘定科目を保存しました'); break;
      }
      case 'xlsx': xlsxExport(el.dataset.span); break;
      case 'impOpen':
        if (!window.XLSX) { toast('Excelの機能を読み込めませんでした。通信を確認してください'); break; }
        S.edit = { mode: 'import', store: S.store === 'all' ? 'hair' : S.store, file: '' }; renderSheet(); impPick(); break;
      case 'impPick': impPick(); break;
      case 'rcPick': rcPick(); break;
      case 'rcClear': S.rcpt = null; S.draft = null; render(); break;
      case 'saveAi': {
        const ai = { siteKey: $('ai-key').value.trim(), provider: $('ai-prov').value, model: $('ai-model').value.trim() };
        await db.doc('cash_settings/main').set({ ai }, { merge: true }); AIX = null; toast('レシート読み取りの設定を保存しました'); break;
      }
      case 'impRows': S.edit.showRows = !S.edit.showRows; renderSheet(); break;
      case 'impSave': el.disabled = true; try { await impSave(); } catch (err) { if (S.edit) { S.edit.saving = false; renderSheet(); } throw err; } break;
    }
  } catch (e) { toast('エラー：' + e.message); el.disabled = false; }
});
document.addEventListener('toggle', ev => { if (ev.target.dataset && ev.target.dataset.impDet && S.edit) S.edit.mapOpen = ev.target.open; }, true);
const draftField = { 'f-date': 'date', 'f-amt': 'amount', 'f-cat': 'cat', 'f-memo': 'memo' };
function trackDraft(ev) { const k = draftField[ev.target.id]; if (k && !S.edit) { S.draft = Object.assign({}, S.draft, { [k]: ev.target.value }); } }
document.addEventListener('input', ev => {
  trackDraft(ev);
  if (ev.target.dataset.inp === 'camt' && S.edit) { S.edit.amount = ev.target.value; const b = balAt(S.store, $('c-date').value || today()); $('c-diff').innerHTML = ev.target.value === '' ? '—' : diffStr(Math.round(Number(ev.target.value)) - b); }
});
document.addEventListener('change', ev => {
  trackDraft(ev);
  const im = ev.target.dataset.imp;
  if (im && S.edit && S.edit.mode === 'import') {
    const e = S.edit, t = ev.target;
    if (im === 'store') e.store = t.value;
    else if (im === 'sheet') { t.checked ? e.sel.add(t.dataset.name) : e.sel.delete(t.dataset.name); }
    else if (im === 'map') { e.map[t.dataset.k] = t.value === '' ? null : Number(t.value); e.mapOpen = true; }
    else if (im === 'year') e.year = Number(t.value) || e.year;
    else if (im === 'catmap') e.catMap[t.dataset.k] = t.value;
    else if (im === 'setop') e.setOp = t.checked;
    else if (im === 'nodate') e.noDateEnd = t.checked;
    else if (im === 'fixodd') { e.fixOdd[t.dataset.name] = t.checked; if (t.checked) e.sel.add(t.dataset.name); }
    else if (im === 'opdate') e.opDate = t.value;
    else if (im === 'opamt') e.opAmt = t.value;
    if (e.file) impParse();
    renderSheet();
    return;
  }
  if (ev.target.dataset.chg === 'cdate' && S.edit) { S.edit.date = ev.target.value; S.edit.amount = $('c-amt').value; renderSheet(); }
});
function keepForm() { return $('f-amt') ? { date: $('f-date').value, amount: $('f-amt').value, memo: $('f-memo').value } : {}; }
function restoreForm(k, skipCat) { if (!$('f-amt')) return; if (k.date) $('f-date').value = k.date; if (k.amount != null) $('f-amt').value = k.amount; if (k.memo != null) $('f-memo').value = k.memo; void skipCat; }
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'login-form') return; ev.preventDefault();
  try { await firebase.auth().signInWithEmailAndPassword($('lg-email').value.trim(), $('lg-pass').value); } catch (e) { $('lg-err').textContent = 'メールアドレスかパスワードが違います'; }
});

let db, started = false;
const typing = () => { const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && !S.edit; };
let pend = false;
const soft = () => { if (typing()) { if (!pend) { pend = true; const t = setInterval(() => { if (!typing()) { clearInterval(t); pend = false; render(); } }, 800); } return; } render(); };
function listen() {
  WHO.init(db, soft);
  const fail = e => { S.err = e.message; render(); };
  db.collection('cash_entries').onSnapshot(s => { S.entries = s.docs.map(d => Object.assign({ id: d.id }, d.data())); S.ready.add('e'); soft(); }, fail);
  db.collection('cash_counts').onSnapshot(s => { S.counts = s.docs.map(d => Object.assign({ id: d.id }, d.data())); S.ready.add('c'); soft(); }, fail);
  db.doc('cash_settings/main').onSnapshot(d => { S.settings = d.exists ? d.data() : {}; S.ready.add('s'); soft(); }, fail);
}
(function init() {
  if (typeof firebaseConfig === 'undefined' || !window.firebase) { $('main').innerHTML = '<div class="empty">設定ファイル（config.js）が読み込めません。</div>'; return; }
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebase.auth().onAuthStateChanged(u => { S.user = u || null; if (u && !started) { started = true; listen(); } render(); });
})();
</script>
</body>
