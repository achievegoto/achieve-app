<style>

}

  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15141b; --surface: #1f1d28; --line: #33303f; --ink: #efedf5; --muted: #a29eb2;
  --accent: #c4a6ea; --accent-ink: #1d1529; --accent-soft: #2f2740;

  color-scheme: dark }
* { box-sizing: border-box }
html { padding: env(safe-area-inset-top, 0px) 0 0; }

.wrap { max-width: 760px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; }

<nav id="nav" hidden><div class="wrap tabs" id="tabs"></div></nav>
<div id="toast" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="who.js?v=3"></script>
<script>
const STORES = [['hair', 'achieve'], ['liss', 'Liss'], ['till', 'till'], ['free', '所属なし']];
const TYPES = { absent: '欠勤', late: '遅刻', early: '早退', paid: '有給', half: '半休' };
const KIND = { full: '全日', am: '午前半休', pm: '午後半休', absent: '欠勤', late: '遅刻', early: '早退' };
const isLeave = k => k === 'full' || k === 'am' || k === 'pm';
const GRANT = [10, 11, 12, 14, 16, 18, 20];
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addMonths = (s, n) => { const d = parse(s); const t = new Date(d.getFullYear(), d.getMonth() + n, d.getDate()); if (t.getDate() !== d.getDate()) t.setDate(0); return iso(t); };
const today = () => iso(new Date());
const md = s => { if (!s) return ''; const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}（${'日月火水木金土'[d.getDay()]}）`; };
const ymd = s => { if (!s) return ''; const d = parse(s); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };
const daysUntil = s => Math.round((parse(s) - parse(today())) / 864e5);
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

const S = { user: undefined, ready: new Set(), staff: [], recs: [], reqs: [], pin: null, me: lsGet('att.me') || '', tab: 'me', admin: false,
  month: today().slice(0, 7), pickingMe: false, editStaff: null, err: '' };

/* ---- 計算 ---- */
const staffOf = id => S.staff.find(s => s.id === id);
const active = () => S.staff.filter(s => !s.hidden);
const workers = () => active().filter(s => !s.noLeave);
const byStore = list => STORES.map(([id, l]) => [l, list.filter(s => s.store === id)]).concat([['店舗未設定', list.filter(s => !STORES.some(x => x[0] === s.store))]]).filter(g => g[1].length);
const grpRow = (l, n) => `<tr class="grp"><td colspan="${n}">${esc(l)}</td></tr>`;
const storeName = id => (STORES.find(x => x[0] === id) || [, ''])[1];
function leave(st, on) {
  on = on || today();
  if (!st || !st.start) return null;
  const first = addMonths(st.start, 6);
  if (on < first) return { grant: 0, from: null, to: first, used: 0, left: 0, next: first, before: true };
  let k = 0; while (addMonths(first, 12 * (k + 1)) <= on) k++;
  const from = addMonths(first, 12 * k), to = addMonths(first, 12 * (k + 1));
  const grant = st.grant ? Number(st.grant) : GRANT[Math.min(k, GRANT.length - 1)];
  const used = S.recs.filter(r => r.staffId === st.id && r.date >= from && r.date < to && (r.type === 'paid' || r.type === 'half')).reduce((a, r) => a + (r.type === 'half' ? .5 : 1), 0);
  return { grant, from, to, used, left: grant - used, next: to };
}
const pendingReqs = () => S.reqs.filter(r => r.status === 'pending' && staffOf(r.staffId)).sort((a, b) => a.date < b.date ? -1 : 1);
const monthRecs = (m, sid) => S.recs.filter(r => r.date.startsWith(m) && (!sid || r.staffId === sid));
function counts(list) { const c = { absent: 0, late: 0, early: 0, paid: 0, half: 0 }; list.forEach(r => c[r.type] = (c[r.type] || 0) + 1); return c; }
const monthLabel = m => { const [y, mo] = m.split('-'); return `${y}年${Number(mo)}月`; };
const shiftMonth = (m, n) => addMonths(m + '-01', n).slice(0, 7);

/* ---- 表示 ---- */
function render() {
  const m = $('main');
  $('who').hidden = !S.user || !WHO.me;
  if (S.user === undefined) { m.innerHTML = '<div class="empty">読み込んでいます</div>'; return; }
  if (!S.user) { $('nav').hidden = true; m.innerHTML = loginView(); return; }
  if (S.err) { m.innerHTML = `<div class="card"><div class="err">${esc(S.err)}</div></div>`; return; }
  if (S.ready.size < 3) { m.innerHTML = '<div class="empty">読み込んでいます</div>'; return; }
  const g = WHO.gate();
  if (g) { $('nav').hidden = true; m.innerHTML = g; return; }
  S.me = WHO.me.id; S.admin = WHO.isAdmin(); S.owner = WHO.isOwner();
  if (S.tab === 'admin' && !S.admin) S.tab = 'me';
  $('nav').hidden = false;
  const n = pendingReqs().length;
  $('tabs').style.gridTemplateColumns = `repeat(${S.admin ? 3 : 2}, 1fr)`;
  $('tabs').innerHTML = [['me', '自分'], ['cal', '休みの予定']].concat(S.admin ? [['admin', '管理']] : []).map(([id, l]) => `<button type="button" id="tab-${id}" data-act="tab" data-id="${id}" ${S.tab === id ? 'aria-current="page"' : ''}>${l}${id === 'admin' && n ? `<span class="badge">${n}</span>` : ''}</button>`).join('');
  $('who').innerHTML = WHO.bar() + ' <span class="sw">切替</span>';
  m.innerHTML = S.tab === 'me' ? meView() : S.tab === 'cal' ? calView() : adminView();
  WHO.badge(S.admin ? pendingReqs().length : S.reqs.filter(r => r.staffId === S.me && r.status !== 'pending' && r.status !== 'cancelled' && (r.decidedAt || 0) > Number(lsGet('att.seen') || 0)).length);
  if (S.tab === 'me' && !S.admin) lsSet('att.seen', String(Date.now()));
}
function loginView() {
  return `<form class="card login" id="login-form"><h3>ログイン</h3>
    <div class="sub">在庫アプリと同じスタッフ用アカウントでログインします。</div>
    <label class="lbl">メールアドレス<input class="field" id="lg-email" type="email" autocomplete="username" required></label>
    <label class="lbl">パスワード<input class="field" id="lg-pass" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lg-err"></div><button class="btn primary" id="lg-go">ログイン</button></form>`;
}
function picker() {
  if (!active().length) return `<section class="card"><h3>スタッフがまだ登録されていません</h3><div class="sub">「管理」タブからスタッフを追加してください。</div></section>`;
  const groups = byStore(active());
  return `<section class="card"><h3>あなたの名前を選んでください</h3><div class="sub">この端末では次から自動で選ばれます。</div>
    ${groups.map(([l, arr]) => `<div class="group"><h2>${esc(l)}</h2><div class="chips">${arr.map(s => `<button type="button" class="chip" id="me-${s.id}" data-act="setMe" data-id="${s.id}" aria-pressed="${S.me === s.id}">${esc(s.name)}</button>`).join('')}</div></div>`).join('')}
    ${S.me ? '<button type="button" class="btn small" data-act="cancelPick">閉じる</button>' : ''}</section>`;
}
function leaveCard(st) {
  const l = leave(st);
  if (!l) return `<section class="hero"><div class="hero-name">${esc(st.name)}</div><div class="sub">入社日が未設定のため、有給日数を計算できません。管理者に入社日の登録を頼んでください。</div></section>`;
  if (l.before) return `<section class="hero"><div class="hero-name">${esc(st.name)}</div><div class="sub">有給は ${ymd(l.next)} に付与されます（入社6か月後）。</div></section>`;
  const pct = l.grant ? Math.min(100, l.used / l.grant * 100) : 0;
  return `<section class="hero">
    <div class="hero-top"><div class="hero-name">${esc(st.name)}</div><div class="sub">${esc(storeName(st.store))}</div></div>
    <div class="lv"><div><span class="lv-l">使用</span><b class="lv-big">${l.used}</b><span class="lv-u">日</span></div>
      <div class="lv-side"><span>付与 <b>${l.grant}</b>日</span></div></div>
    <div class="hbar"><i style="width:${pct}%"></i></div>
    <div class="sub">今期 ${ymd(l.from)} 〜 ${ymd(iso(new Date(parse(l.to) - 864e5)))}　｜　${ymd(l.to)} にリセットして新しく付与</div>
  </section>`;
}
const stPill = r => stPill0(r);
function reqForm() {
  const min = addMonths(today(), 1);
  return `<section class="card"><h3>有給を申請する</h3>
    <div class="sub">原則として<b>1か月前まで</b>に申請してください（${md(min)}以降の日付）。</div>
    <div class="grid2">
      <label class="lbl">日付<input class="field" id="rq-date" type="date" min="${today()}" value="${min}" data-chg="rqdate"></label>
      <label class="lbl">種類<select class="field" id="rq-kind">${Object.entries(KIND).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
    </div>
    <div id="rq-warn"></div>
    <label class="lbl">理由・メモ（任意）<input class="field" id="rq-note" placeholder="例：家族の用事"></label>
    <button type="button" class="btn primary" data-act="request">申請する</button></section>`;
}
const stPill0 = r => `<span class="pill s-${r.status}">${{ pending: '承認待ち', approved: '承認', rejected: '却下', cancelled: '取り消し' }[r.status]}</span>`;
function reportForm() {
  return `<section class="card"><h3>欠勤・遅刻・早退を報告する</h3>
    <div class="sub">LINEで連絡したあと、ここにも入れてください。管理者が承認すると記録になります。</div>
    <div class="grid2"><label class="lbl">日付<input class="field" id="rp-date" type="date" value="${today()}"></label>
    <label class="lbl">種類<select class="field" id="rp-kind" data-chg="rpkind"><option value="late">遅刻</option><option value="early">早退</option><option value="absent">欠勤</option></select></label></div>
    <div class="grid2"><label class="lbl" id="rp-time-w"><span id="rp-time-l">出勤した時刻（必須）</span><input class="field" id="rp-time" type="time" step="300"></label>
    <label class="lbl">理由（任意）<input class="field" id="rp-note" placeholder="例：電車遅延"></label></div>
    <button type="button" class="btn primary" data-act="report">報告する</button></section>`;
}
function reqRow(r, admin) {
  const st = staffOf(r.staffId), lead = Math.round((parse(r.date) - new Date(r.requestedAt).setHours(0, 0, 0, 0)) / 864e5);
  return `<div class="row"><div><div class="name">${admin ? esc(st ? st.name : '') + '：' : ''}${md(r.date)} ${KIND[r.kind]}${r.time ? ` ${r.time}${r.kind === 'late' ? '出勤' : '退勤'}` : ''}</div>
    <div class="sub">${stPill(r)}<span>${new Date(r.requestedAt).getMonth() + 1}/${new Date(r.requestedAt).getDate()} 申請</span>${isLeave(r.kind) && lead < 30 ? `<span class="pill late">1か月前ルール外（${lead}日前）</span>` : ''}${r.note ? `<span>${esc(r.note)}</span>` : ''}</div></div>
    <div class="row-act">${admin && r.status === 'pending' ? `<button type="button" class="btn small good" data-act="approve" data-id="${r.id}">承認</button><button type="button" class="btn small" data-act="reject" data-id="${r.id}">却下</button>`
      : !admin && r.status === 'pending' ? `<button type="button" class="btn small" data-act="cancelReq" data-id="${r.id}">取り消す</button>` : ''}</div></div>`;
}
function recList(list, withName, admin) {
  if (!list.length) return '<div class="empty" style="padding:14px">記録はありません</div>';
  return `<div class="list">${list.slice().sort((a, b) => a.date < b.date ? 1 : -1).map(r => `<div class="row"><div><div class="name">${md(r.date)} <span class="tp t-${r.type}">${TYPES[r.type]}</span>${withName ? ' ' + esc((staffOf(r.staffId) || {}).name || '') : ''}</div>
    ${r.note || r.time || r.min ? `<div class="sub">${r.time ? `<span>${r.time} ${r.type === 'late' ? '出勤' : '退勤'}</span>` : ''}${r.min ? `<span>${r.min}分</span>` : ''}${r.note ? `<span>${esc(r.note)}</span>` : ''}</div>` : ''}</div>
    ${admin ? `<button type="button" class="btn small danger" data-act="delRec" data-id="${r.id}" aria-label="削除">削除</button>` : ''}</div>`).join('')}</div>`;
}
function monthNav() {
  return `<div class="mnav"><button type="button" class="btn small" data-act="month" data-id="-1" aria-label="前の月">‹</button><b>${monthLabel(S.month)}</b><button type="button" class="btn small" data-act="month" data-id="1" aria-label="次の月">›</button></div>`;
}
function meView() {
  const st = staffOf(S.me);
  if (!st) return '<div class="empty">読み込んでいます</div>';
  if (st.noLeave) return `<section class="card"><h3>${esc(st.name)}さん</h3><div class="sub">オーナーの有給は管理していません。「管理」タブから全体を見られます。</div></section>`;
  if (st.noPaid) { const mr0 = monthRecs(S.month, st.id); return `<section class="hero"><div class="hero-top"><div class="hero-name">${esc(st.name)}</div><div class="sub">${esc(storeName(st.store))}</div></div></section>${reportForm()}${myReqCard(st)}<section class="card"><div class="card-head"><h3>自分の記録</h3></div>${monthNav()}${tiles(counts(mr0))}${recList(mr0, false, false)}</section>`; }
  const mr = monthRecs(S.month, st.id), c = counts(mr);
  return leaveCard(st) + reqForm() + reportForm() + myReqCard(st)
    + `<section class="card"><div class="card-head"><h3>自分の記録</h3></div>${monthNav()}${tiles(c)}${recList(mr, false, false)}</section>`;
}
function myReqCard(st) {
  const myReqs = S.reqs.filter(r => r.staffId === st.id && r.status !== 'cancelled' && (r.status === 'pending' || r.date >= addMonths(today(), -2))).sort((a, b) => a.date < b.date ? 1 : -1);
  return `<section class="card"><h3>自分の申請・報告</h3>${myReqs.length ? `<div class="list">${myReqs.map(r => reqRow(r, false)).join('')}</div>` : '<div class="empty" style="padding:14px">申請はありません</div>'}</section>`;
}
function tiles(c) {
  return `<div class="tiles">${Object.entries(TYPES).map(([k, v]) => `<div class="tile t-${k}"><span>${v}</span><b>${c[k] || 0}</b></div>`).join('')}</div>`;
}
function calView() {
  const list = monthRecs(S.month).filter(r => r.type !== 'late' && r.type !== 'early');
  const pend = S.reqs.filter(r => r.status === 'pending' && isLeave(r.kind) && r.date.startsWith(S.month));
  const days = {};
  list.forEach(r => (days[r.date] ||= []).push({ name: (staffOf(r.staffId) || {}).name || '', label: TYPES[r.type], cls: 't-' + r.type }));
  pend.forEach(r => (days[r.date] ||= []).push({ name: (staffOf(r.staffId) || {}).name || '', label: KIND[r.kind] + '（承認待ち）', cls: 't-pend' }));
  const keys = Object.keys(days).sort();
  return `<section class="card"><h3>休みの予定</h3><div class="sub">有給・半休・欠勤と、承認待ちの申請を日付順に表示します。</div>${monthNav()}
    ${keys.length ? `<div class="list">${keys.map(d => `<div class="row cal${d === today() ? ' today' : ''}"><div class="cal-d">${md(d)}</div><div class="cal-n">${days[d].map(x => `<span class="tp ${x.cls}">${esc(x.name)} ${esc(x.label)}</span>`).join('')}</div></div>`).join('')}</div>` : '<div class="empty" style="padding:14px">この月の予定はありません</div>'}</section>`;
}
function adminView() {
  if (!S.admin) return '<div class="empty">管理者だけが使える画面です。</div>';
  const pend = pendingReqs();
  const opts = byStore(workers()).map(([l, arr]) => `<optgroup label="${esc(l)}">${arr.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</optgroup>`).join('');
  const recent = S.reqs.filter(r => r.status !== 'pending' && r.status !== 'cancelled').sort((a, b) => (b.decidedAt || 0) - (a.decidedAt || 0)).slice(0, 5);
  return WHO.badgeOffer() + `<section class="card"><div class="card-head"><h3>承認待ちの申請・報告</h3><span class="sub">${pend.length}件</span></div>
      ${pend.length ? `<div class="list">${pend.map(r => reqRow(r, true)).join('')}</div>` : '<div class="empty" style="padding:14px">承認待ちはありません</div>'}
      ${recent.length ? `<details><summary class="sub" style="cursor:pointer">最近の承認・却下</summary><div class="list" style="margin-top:8px">${recent.map(r => reqRow(r, true)).join('')}</div></details>` : ''}</section>
    <section class="card"><h3>欠勤・遅刻・早退を記録</h3>
      <div class="grid2"><label class="lbl">スタッフ<select class="field" id="rc-staff">${opts}</select></label>
      <label class="lbl">日付<input class="field" id="rc-date" type="date" value="${today()}"></label></div>
      <div class="seg3" role="radiogroup" aria-label="種類">${Object.entries(TYPES).map(([k, v], i) => `<label><input type="radio" name="rc-type" value="${k}" ${i === 1 ? 'checked' : ''}><span>${v}</span></label>`).join('')}</div>
      <div class="grid2"><label class="lbl" id="rc-time-w"><span id="rc-time-l">出勤した時刻（必須）</span><input class="field" id="rc-time" type="time" step="300"></label>
      <label class="lbl">メモ（任意）<input class="field" id="rc-note" placeholder="例：電車遅延"></label></div>
      <button type="button" class="btn primary" data-act="addRec">記録する</button></section>
    ${summaryCard()}${S.owner ? leaveTable() : ''}${staffAdmin()}`;
}
function summaryCard() {
  return `<section class="card"><h3>月のまとめ</h3>${monthNav()}<div class="tbl-wrap"><table class="mx"><thead><tr><th>名前</th>${Object.values(TYPES).map(v => `<th>${v}</th>`).join('')}</tr></thead>
    <tbody>${byStore(workers()).map(([l, arr]) => grpRow(l, 6) + arr.map(s => { const c = counts(monthRecs(S.month, s.id)); return `<tr><td>${esc(s.name)}</td>${Object.keys(TYPES).map(k => `<td class="cell ${c[k] ? 'hot t-' + k : 'h0'}">${c[k] || '·'}</td>`).join('')}</tr>`; }).join('')).join('')}</tbody></table></div>
    <details><summary class="sub" style="cursor:pointer">この月の記録を全部見る（${monthRecs(S.month).length}件）</summary><div style="margin-top:8px">${recList(monthRecs(S.month), true, true)}</div></details></section>`;
}
function leaveTable() {
  if (!S.owner) return '';
  return `<section class="card"><h3>有給の状況 <span class="rank-o">オーナーのみ</span></h3><div class="tbl-wrap"><table class="mx"><thead><tr><th>名前</th><th>付与</th><th>使用</th><th>リセット日</th></tr></thead>
    <tbody>${byStore(workers().filter(x => !x.noPaid)).map(([gl, arr]) => grpRow(gl, 4) + arr.map(s => { const l = leave(s); if (!l) return `<tr><td>${esc(s.name)}</td><td colspan="3" class="h0">入社日未設定</td></tr>`; if (l.before) return `<tr><td>${esc(s.name)}</td><td colspan="3" class="h0">${ymd(l.next)} 付与予定</td></tr>`;
      return `<tr><td>${esc(s.name)}</td><td class="cell">${l.grant}</td><td class="cell"><b>${l.used}</b></td><td class="cell">${ymd(l.to)}</td></tr>`; }).join('')).join('')}</tbody></table></div>
  </section>`;
}
function staffAdmin() {
  const e = S.editStaff;
  const form = e ? `<div class="card" style="background:var(--bg)">
      <label class="lbl">名前<input class="field" id="sf-name" value="${esc(e.name || '')}"></label>
      <div class="grid2"><label class="lbl">店舗<select class="field" id="sf-store"><option value="">未設定</option>${STORES.map(([id, l]) => `<option value="${id}" ${e.store === id ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="lbl">入社日<input class="field" id="sf-start" type="date" value="${esc(e.start || '')}"></label></div>
      <label class="lbl" style="flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px"><input type="checkbox" id="sf-nopaid" ${e.noPaid ? 'checked' : ''} style="width:20px;height:20px">パート・アルバイト（有給の表示なし）</label>
      <label class="lbl">付与日数（パートなど法定と違う人だけ）<input class="field" id="sf-grant" type="number" inputmode="numeric" min="0" value="${esc(e.grant || '')}" placeholder="空欄なら自動"></label>
      <div class="grid2"><label class="lbl">権限<select class="field" id="sf-role" ${S.owner ? '' : 'disabled'}>${Object.entries(WHO.ROLE).map(([k, v]) => `<option value="${k}" ${(e.role || 'staff') === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label class="lbl">${e.pinHash ? 'PINを変える（4〜8桁）' : 'PINを発行（4〜8桁）'}<input class="field" id="sf-pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" placeholder="${e.pinHash ? '変えないなら空欄' : '本人に伝えるPIN'}"></label></div>
      ${S.owner ? '' : '<div class="sub">権限の変更はオーナーだけができます。</div>'}
      <div class="actions"><button type="button" class="btn primary" data-act="saveStaff">保存</button><button type="button" class="btn" data-act="cancelStaff">やめる</button>
      ${e.id ? `<button type="button" class="btn danger" data-act="hideStaff">${e.hidden ? '表示に戻す' : '一覧から外す（退職など）'}</button>` : ''}</div></div>` : '';
  return `<section class="card"><div class="card-head"><h3>スタッフ</h3><button type="button" class="btn small" data-act="newStaff">＋ 追加</button></div>${form}
    <details ${e ? 'open' : ''}><summary class="sub" style="cursor:pointer">スタッフ一覧（${S.staff.length}名）・店舗・入社日・PIN・権限</summary>${byStore(S.staff).map(([gl, arr]) => `<div class="group" style="margin-top:10px"><h2>${esc(gl)}</h2><div class="list">${arr.map(s => `<button type="button" class="row" data-act="editStaff" data-id="${s.id}" ${WHO.canManage(s) ? '' : 'disabled'}><div><div class="name">${esc(s.name)}${s.hidden ? '（非表示）' : ''}</div><div class="sub"><span>${esc(storeName(s.store) || '店舗未設定')}</span>${s.start ? `<span>入社 ${ymd(s.start)}</span>` : (s.noPaid ? '' : '<span>入社日未設定</span>')}${s.grant ? `<span>付与 ${s.grant}日</span>` : ''}${s.noPaid ? '<span class="pill p-std">パート・アルバイト</span>' : ''}${s.role && s.role !== 'staff' ? `<span class="pill p-std">${WHO.ROLE[s.role]}</span>` : ''}${s.pinHash ? '' : '<span class="pill late">PIN未発行</span>'}</div></div><span class="sub">${WHO.canManage(s) ? '編集' : ''}</span></button>`).join('')}</div></div>`).join('')}</details>
  </section>`;
}

/* ---- 書き込み ---- */
async function checkPin(v) {
  if (S.pin == null) { const d = await db.doc('settings/app').get(); S.pin = d.exists ? String(d.data().pin || '') : ''; }
  return !!S.pin && String(v).trim() === S.pin;
}
const radio = n => (document.querySelector(`input[name="${n}"]:checked`) || {}).value;
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  try {
    if (a === 'whoSwitch') { WHO.handle('whoOut', el); window.scrollTo(0, 0); return; }
    if (await WHO.handle(a, el)) return;
    switch (a) {
      case 'tab': S.tab = id; render(); window.scrollTo(0, 0); break;
      case 'month': S.month = shiftMonth(S.month, Number(id)); render(); break;
      case 'request': {
        const date = $('rq-date').value, kind = $('rq-kind').value;
        if (!date) { toast('日付を選んでください'); break; }
        if (date < today()) { toast('過去の日付は申請できません'); break; }
        if (S.reqs.some(r => r.staffId === S.me && r.date === date && (r.status === 'pending' || r.status === 'approved'))) { toast('その日はもう申請しています'); break; }
        el.disabled = true;
        await db.collection('att_req').doc().set({ staffId: S.me, date, kind, note: $('rq-note').value.trim(), status: 'pending', requestedAt: Date.now() });
        toast(daysUntil(date) < 30 ? '申請しました（1か月前を過ぎているので、管理者に一言伝えてください）' : '申請しました'); break;
      }
      case 'report': {
        const date = $('rp-date').value, kind = $('rp-kind').value, time = $('rp-time').value;
        if (!date) { toast('日付を選んでください'); break; }
        if (kind !== 'absent' && !time) { toast(kind === 'late' ? '出勤した時刻を選んでください' : '退勤した時刻を選んでください'); $('rp-time').focus(); break; }
        if (S.reqs.some(r => r.staffId === S.me && r.date === date && r.kind === kind && r.status === 'pending')) { toast('同じ報告がもう出ています'); break; }
        el.disabled = true;
        await db.collection('att_req').doc().set({ staffId: S.me, date, kind, time: kind === 'absent' ? null : time, note: $('rp-note').value.trim(), status: 'pending', requestedAt: Date.now() });
        toast('報告しました（管理者の承認で記録になります）'); break;
      }
      case 'cancelReq': await db.doc('att_req/' + id).update({ status: 'cancelled', decidedAt: Date.now() }); toast('取り消しました'); break;
      case 'approve': {
        const r = S.reqs.find(x => x.id === id); if (!r) break;
        const b = db.batch();
        b.update(db.doc('att_req/' + id), { status: 'approved', decidedAt: Date.now() });
        if (isLeave(r.kind)) b.set(db.collection('att_rec').doc('req_' + id), { staffId: r.staffId, date: r.date, type: r.kind === 'full' ? 'paid' : 'half', note: (r.kind === 'full' ? '' : KIND[r.kind]) + (r.note ? (r.kind === 'full' ? '' : '・') + r.note : ''), reqId: id, at: Date.now() });
        else b.set(db.collection('att_rec').doc('req_' + id), { staffId: r.staffId, date: r.date, type: r.kind, time: r.time || null, note: r.note || '', reqId: id, at: Date.now() });
        await b.commit(); toast('承認しました'); break;
      }
      case 'reject': await db.doc('att_req/' + id).update({ status: 'rejected', decidedAt: Date.now() }); toast('却下しました'); break;
      case 'addRec': {
        const staffId = $('rc-staff').value, date = $('rc-date').value, type = radio('rc-type');
        if (!staffId || !date || !type) { toast('スタッフ・日付・種類を選んでください'); break; }
        const time = $('rc-time').value;
        if ((type === 'late' || type === 'early') && !time) { toast(type === 'late' ? '出勤した時刻を選んでください' : '退勤した時刻を選んでください'); $('rc-time').focus(); break; }
        await db.collection('att_rec').doc().set({ staffId, date, type, time: type === 'late' || type === 'early' ? time : null, note: $('rc-note').value.trim(), at: Date.now() });
        $('rc-time').value = ''; $('rc-note').value = '';
        toast(`${(staffOf(staffId) || {}).name} ${md(date)} ${TYPES[type]}を記録しました`); break;
      }
      case 'delRec': {
        if (S.confirmDel !== id) { S.confirmDel = id; el.textContent = 'もう一度押すと削除'; break; }
        const r = S.recs.find(x => x.id === id);
        const b = db.batch(); b.delete(db.doc('att_rec/' + id));
        if (r && r.reqId) b.update(db.doc('att_req/' + r.reqId), { status: 'cancelled', decidedAt: Date.now() });
        await b.commit(); S.confirmDel = null; toast('削除しました'); break;
      }
      case 'newStaff': S.editStaff = { name: '', store: '', start: '' }; render(); break;
      case 'editStaff': S.editStaff = Object.assign({}, staffOf(id)); render(); break;
      case 'cancelStaff': S.editStaff = null; render(); break;
      case 'saveStaff': {
        const name = $('sf-name').value.trim(); if (!name) { toast('名前を入れてください'); break; }
        const g = parseFloat($('sf-grant').value);
        const data = { name, store: $('sf-store').value, start: $('sf-start').value, grant: isNaN(g) ? null : g, noPaid: $('sf-nopaid').checked };
        const pin = String($('sf-pin').value).trim();
        if (pin && !/^\d{4,8}$/.test(pin)) { toast('PINは4〜8桁の数字にしてください'); break; }
        if (S.owner) { const r = $('sf-role').value; if (S.editStaff.id === S.me && r !== 'owner') { toast('自分のオーナー権限は外せません'); break; } data.role = r; }
        const ref = S.editStaff.id ? db.doc('att_staff/' + S.editStaff.id) : db.collection('att_staff').doc();
        if (S.editStaff.id) await ref.update(data);
        else await ref.set(Object.assign(data, { role: data.role || 'staff', hidden: false, order: S.staff.length + 1 }));
        if (pin) await WHO.setPin(ref.id, pin);
        S.editStaff = null; toast(pin ? '保存しました。PINを本人に伝えてください' : '保存しました'); render(); break;
      }
      case 'hideStaff': await db.doc('att_staff/' + S.editStaff.id).update({ hidden: !S.editStaff.hidden }); S.editStaff = null; render(); break;
      case 'importStaff': {
        const q = await db.collection('cur_staff').get(); const b = db.batch(); let n = 0;
        q.docs.forEach(d => { const v = d.data(); if (v.hidden) return; b.set(db.collection('att_staff').doc(d.id), { name: v.name, store: v.store || '', start: v.start || '', grant: null, hidden: false, order: v.order || ++n }); n++; });
        await b.commit(); toast(n + '名を取り込みました'); break;
      }
    }
  } catch (e) { toast('保存できませんでした：' + e.message); el.disabled = false; }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'rp-kind') { const k = ev.target.value; $('rp-time-w').style.visibility = k === 'absent' ? 'hidden' : 'visible'; $('rp-time-l').textContent = k === 'early' ? '退勤した時刻（必須）' : '出勤した時刻（必須）'; }
  if (ev.target.name === 'rc-type') { const t = ev.target.value, w = $('rc-time-w'); if (!w) return; w.style.visibility = t === 'late' || t === 'early' ? 'visible' : 'hidden'; $('rc-time-l').textContent = t === 'early' ? '退勤した時刻（必須）' : '出勤した時刻（必須）'; }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'rq-date') { const d = ev.target.value, w = $('rq-warn'); if (!w) return; const n = d ? daysUntil(d) : 99; w.innerHTML = d && n < 30 ? `<div class="note">${n}日前の申請です。原則1か月前までなので、申請したら管理者に一言伝えてください。</div>` : ''; }
});
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'login-form') return; ev.preventDefault();
  try { await firebase.auth().signInWithEmailAndPassword($('lg-email').value.trim(), $('lg-pass').value); } catch (e) { $('lg-err').textContent = 'メールアドレスかパスワードが違います'; }
});

/* ---- 接続 ---- */
let db, started = false;
function listen() {
  const typing = () => { const a = document.activeElement; return a && a.matches('input,textarea,select'); };
  const soft = () => { if (!typing()) render(); else S.dirty = true; };
  const fail = e => { S.err = e.message; render(); };
  WHO.init(db, soft);
  db.collection('att_staff').onSnapshot(s => { S.staff = s.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.order || 0) - (b.order || 0)); S.ready.add('s'); soft(); }, fail);
  db.collection('att_rec').onSnapshot(s => { S.recs = s.docs.map(d => Object.assign({ id: d.id }, d.data())); S.ready.add('r'); soft(); }, fail);
  db.collection('att_req').onSnapshot(s => { S.reqs = s.docs.map(d => Object.assign({ id: d.id }, d.data())); S.ready.add('q'); soft(); }, fail);
}
document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if (S.dirty && !(a && a.matches('input,textarea,select'))) { S.dirty = false; render(); } }, 0));
(function init() {
  if (typeof firebaseConfig === 'undefined' || !window.firebase) { $('main').innerHTML = '<div class="empty">設定ファイル（config.js）が読み込めません。</div>'; return; }
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebase.auth().onAuthStateChanged(u => { S.user = u || null; if (u && !started) { started = true; listen(); } render(); });
})();
</script>
