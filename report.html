* { box-sizing: border-box }
html { padding: env(safe-area-inset-top, 0px) 0 0; }

.wrap { max-width: 760px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; }
.brand { font-family: var(--font-num); font-size: 20px; letter-spacing: .08em; display: flex; align-items: baseline; gap: 10px; min-width: 0; }

.who { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 5px 12px; font-size: 13px; white-space: nowrap; }

.legend .lg::before { background: var(--good); } .legend .lw::before { background: var(--warn); } .legend .lb::before { background: var(--info); }

<body>
<header><div class="wrap head">
  <div class="brand">achieve<small>月報</small></div>
  <button type="button" class="who" id="who" data-act="whoSwitch" hidden></button>
</div></header>
<main class="wrap" id="main"><div class="empty">読み込んでいます</div></main>
<nav id="nav" hidden><div class="wrap tabs" id="tabs"></div></nav>
<div id="toast" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="who.js?v=3"></script>
<script>
const STORES = [['hair', 'achieve'], ['liss', 'Liss'], ['till', 'till'], ['free', '所属なし']];
const M = [
  ['tech', '指名技術売上', 'yen', 'sum'], ['free', 'フリー技術売上', 'yen', 'sum'], ['retail', '店販売上', 'yen', 'sum'], ['cust', '客数', 'n', 'sum'], ['unit', '客単価', 'yen', 'calc'],
  ['buyers', '購入者', 'n', 'sum'], ['repeat', 'リピート率', 'pct', 'avg'], ['next', '次予率', 'pct', 'avg'], ['newc', '新規入客', 'n', 'sum'],
  ['over', '時間超過人数', 'n', 'sum', 'noyoy'], ['overRate', '時間超過率', 'pct', 'avg', 'noyoy'],
];
const TG = [['tech', '指名技術売上'], ['free', 'フリー技術売上'], ['retail', '店販売上'], ['cust', '客数'], ['newc', '新規入客'], ['next', '次予率']];
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const nowYm = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const shiftYm = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const ymLabel = ym => { const [y, m] = ym.split('-'); return `${y}年${Number(m)}月`; };
const fmt = (v, t) => v == null || isNaN(v) ? '' : t === 'yen' ? Math.round(v).toLocaleString() : t === 'pct' ? Number(v).toFixed(1) : Math.round(v).toLocaleString();
const yoy = (c, p) => c == null || !p ? null : (c / p - 1) * 100;
const yoyCell = v => v == null ? '<td class="c h0">—</td>' : `<td class="c ${v < 0 ? 'neg' : 'pos'}">${v < 0 ? `(${Math.abs(v).toFixed(1)})` : v.toFixed(1)}</td>`;
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

const S = { user: undefined, ready: new Set(), people: [], data: {}, targets: {}, meta: {}, tab: 'month', ym: nowYm(), pid: '', year: new Date().getFullYear(), err: '', editTg: false, metric: 'tech' };

/* ---- 計算 ---- */
const D0 = (pid, ym) => S.data[pid + '_' + ym] || null;
const AGG = [['ALL', '全員']].concat([['hair', 'achieve'], ['liss', 'Liss'], ['till', 'till']].map(([id, l]) => ['S:' + id, l + ' 全体']));
const GROUP = id => id === 'ALL' ? active() : String(id).startsWith('S:') ? active().filter(p => p.store === id.slice(2)) : null;
const SUMK = ['tech', 'free', 'retail', 'cust', 'buyers', 'newc', 'over'], WK = ['repeat', 'next', 'overRate'];
function D(pid, ym) {
  const g = GROUP(pid); if (!g) return D0(pid, ym);
  const rows = g.map(p => D0(p.id, ym)).filter(Boolean); if (!rows.length) return null;
  const o = { pid, ym };
  SUMK.forEach(k => { const r = rows.filter(d => d[k] != null); if (r.length) o[k] = r.reduce((a, d) => a + d[k], 0); });
  WK.forEach(k => { const r = rows.filter(d => d[k] != null && d.cust); const w = r.reduce((a, d) => a + d.cust, 0); if (w) o[k] = r.reduce((a, d) => a + d[k] * d.cust, 0) / w; });
  return o;
}
function val(d, k) {
  if (!d) return null;
  if (k === 'unit') return d.unit != null ? d.unit : d.tech != null && d.cust ? (d.tech + (d.free || 0)) / d.cust : null;
  return d[k] ?? null;
}
const T0 = (pid, ym) => S.targets[pid + '_' + ym] || {};
function T(pid, ym) {
  const g = GROUP(pid); if (!g) return T0(pid, ym);
  const o = {}; g.forEach(p => { const t = T0(p.id, ym); ['tech', 'free', 'retail', 'cust', 'newc'].forEach(k => { if (Number(t[k])) o[k] = (o[k] || 0) + Number(t[k]); }); }); return o;
}
const active = () => S.people.filter(p => !p.hidden);
const byStore = list => STORES.map(([id, l]) => [l, list.filter(s => s.store === id)]).concat([['店舗未設定', list.filter(s => !STORES.some(x => x[0] === s.store))]]).filter(g => g[1].length);
function pace(ym) {
  const m = S.meta[ym]; const [y, mo] = ym.split('-').map(Number); const days = new Date(y, mo, 0).getDate();
  if (!m || !m.asOf) return { ratio: 1, label: '' };
  const d = new Date(m.asOf); if (d.getFullYear() !== y || d.getMonth() + 1 !== mo) return { ratio: 1, label: '' };
  return { ratio: d.getDate() / days, label: `${mo}/${d.getDate()}時点（${d.getDate()}/${days}日）` };
}
function yearAgg(pid, y, k, kind) {
  const vals = []; for (let m = 1; m <= 12; m++) { const d = D(pid, `${y}-${pad(m)}`); const v = val(d, k); if (v != null) vals.push([v, d]); }
  if (!vals.length) return null;
  if (k === 'unit') { let t = 0, c = 0; vals.forEach(([, d]) => { t += d.tech || 0; c += d.cust || 0; }); return c ? t / c : null; }
  const s = vals.reduce((a, x) => a + x[0], 0);
  return kind === 'avg' ? s / vals.length : s;
}

/* ---- 表示 ---- */
function render() {
  const m = $('main');
  $('who').hidden = !S.user || !WHO.me;
  if (S.user === undefined) { m.innerHTML = '<div class="empty">読み込んでいます</div>'; return; }
  if (!S.user) { $('nav').hidden = true; m.innerHTML = loginView(); return; }
  if (S.err) { m.innerHTML = `<div class="card"><div class="err">${esc(S.err)}</div></div>`; return; }
  if (S.ready.size < 4) { m.innerHTML = '<div class="empty">読み込んでいます</div>'; return; }
  const g = WHO.gate(); if (g) { $('nav').hidden = true; m.innerHTML = g; return; }
  $('who').innerHTML = WHO.bar() + ' <span class="sw">切替</span>';
  const tabs = [['month', '今月の進捗'], ['person', '個人の月報']].concat(WHO.isAdmin() ? [['target', '目標']] : []);
  if (!tabs.some(t => t[0] === S.tab)) S.tab = 'month';
  $('nav').hidden = false;
  $('tabs').style.gridTemplateColumns = `repeat(${tabs.length}, 1fr)`;
  $('tabs').innerHTML = tabs.map(([id, l]) => `<button type="button" id="tab-${id}" data-act="tab" data-id="${id}" ${S.tab === id ? 'aria-current="page"' : ''}>${l}</button>`).join('');
  if (!S.pid) { const mine = active().find(p => WHO.me && p.personId === WHO.me.id); S.pid = (mine || active()[0] || {}).id || ''; }
  m.innerHTML = S.tab === 'month' ? monthView() : S.tab === 'person' ? personView() : targetView();
}
function loginView() {
  return `<form class="card login" id="login-form"><h3>ログイン</h3><div class="sub">在庫アプリと同じスタッフ用アカウントでログインします。</div>
    <label class="lbl">メールアドレス<input class="field" id="lg-email" type="email" autocomplete="username" required></label>
    <label class="lbl">パスワード<input class="field" id="lg-pass" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lg-err"></div><button class="btn primary" id="lg-go">ログイン</button></form>`;
}
const mnav = (act) => `<div class="mnav"><button type="button" class="btn small" data-act="${act}" data-id="-1" aria-label="前">‹</button><b>${act === 'ym' ? ymLabel(S.ym) : S.year + '年'}</b><button type="button" class="btn small" data-act="${act}" data-id="1" aria-label="次">›</button></div>`;
function progBar(cur, tgt, ratio) {
  if (!tgt) return '';
  const pct = Math.min(130, cur / tgt * 100), mark = Math.min(100, ratio * 100);
  const ok = cur >= tgt * ratio;
  return `<div class="pbar"><i class="${ok ? 'ok' : 'ng'}" style="width:${Math.min(100, pct).toFixed(1)}%"></i>${ratio < 1 ? `<b style="left:${mark}%" title="ペース"></b>` : ''}</div>`;
}
function monthView() {
  const ym = S.ym, py = shiftYm(ym, -12), pc = pace(ym);
  const people = active().filter(p => D(p.id, ym) || D(p.id, py) || Object.keys(T(p.id, ym)).length);
  const tot = k => people.reduce((a, p) => a + (val(D(p.id, ym), k) || 0), 0), totP = k => people.reduce((a, p) => a + (val(D(p.id, py), k) || 0), 0) * pc.ratio;
  const tTot = people.reduce((a, p) => a + (Number(T(p.id, ym).tech) || 0), 0);
  const head = `<section class="hero"><div class="hero-top"><div><div class="sub">${ymLabel(ym)}の指名技術売上（全員）</div><div class="lv-big">¥${fmt(tot('tech'), 'yen')}</div>${tot('free') ? `<div class="lv-free"><span>フリー技術売上</span><b>¥${fmt(tot('free'), 'yen')}</b>${totP('free') ? diffTag(tot('free'), totP('free'), 'free') : ''}</div>` : ''}</div>
      <div class="lv-side"><span>前年同月${pc.ratio < 1 ? '（同じ日数分）' : ''} ¥${fmt(totP('tech'), 'yen')}</span><span>昨対 <b>${yoy(tot('tech'), totP('tech')) == null ? '—' : yoy(tot('tech'), totP('tech')).toFixed(1) + '%'}</b></span>${tTot ? `<span>目標達成 <b>${(tot('tech') / tTot * 100).toFixed(0)}%</b></span>` : ''}</div></div>
      ${tTot ? `<div class="hbar"><i style="width:${Math.min(100, tot('tech') / tTot * 100)}%"></i></div>` : ''}
      <div class="sub">${pc.label ? pc.label + 'のデータです。売上・客数の昨対は、前年同月を同じ日数分に換算して比べています。' : (S.meta[ym] && S.meta[ym].asOf ? '月末までのデータです。' : '')}${S.meta[ym] && S.meta[ym].src ? ' 取り込み元：' + esc(S.meta[ym].src) : ''}</div></section>`;
  if (!people.length) return mnav('ym') + head + '<div class="empty">この月のデータはまだありません。</div>';
  const cards = byStore(people).map(([l, arr]) => `<div class="group"><h2>${esc(l)}</h2>${arr.map(p => {
    const d = D(p.id, ym) || {}, q = D(p.id, py) || {}, t = T(p.id, ym);
    const k = (key, label, type) => { const c = val(d, key), pv0 = val(q, key), pv = pv0 != null && ['tech', 'free', 'retail', 'cust', 'newc', 'buyers'].includes(key) ? pv0 * pc.ratio : pv0, y = yoy(c, pv), tg = Number(t[key]) || 0;
      return `<div class="kpi"><span class="kl">${label}</span><b>${fmt(c, type) || '—'}${type === 'pct' && c != null ? '<small>%</small>' : ''}</b>
        <span class="ks">${y == null ? '' : `<span class="${y < 0 ? 'neg' : 'pos'}">昨対 ${y.toFixed(0)}%</span>`}${tg ? ` 目標 ${fmt(tg, type)}${type === 'pct' ? '%' : ''}` : ''}</span>${key !== 'next' && tg ? progBar(c || 0, tg, pc.ratio) : ''}</div>`; };
    return `<button type="button" class="card pcard" data-act="openP" data-id="${p.id}"><div class="card-head"><h3>${esc(p.name)}</h3><span class="sub">${t.tech ? `達成 ${((val(d, 'tech') || 0) / t.tech * 100).toFixed(0)}%` : ''}</span></div>
      <div class="kpis">${k('tech', '指名技術', 'yen')}${k('free', 'フリー技術', 'yen')}${k('retail', '店販売上', 'yen')}${k('cust', '客数', 'n')}${k('unit', '客単価', 'yen')}${k('next', '次予率', 'pct')}${k('newc', '新規', 'n')}</div></button>`;
  }).join('')}</div>`).join('');
  return mnav('ym') + head + cards + (WHO.isAdmin() ? `<div class="sub">数字の取り込みは、Claudeに「月報を更新して」と頼んでください（サロンアンサーから取得します）。</div>` : '');
}
const RATE = k => k === 'repeat' || k === 'next' || k === 'overRate';
const last12 = ym => Array.from({ length: 12 }, (_, i) => shiftYm(ym, i - 11));
function diffTag(c, p, k) {
  if (c == null || p == null) return '';
  const inv = k === 'over' || k === 'overRate', cls = d => (d < 0) !== inv ? 'dn' : 'up';
  if (RATE(k)) { const d = c - p; return `<span class="dt ${cls(d)}">${d < 0 ? '▼' : '▲'}${Math.abs(d).toFixed(1)}pt</span>`; }
  const y = yoy(c, p); return y == null ? '' : `<span class="dt ${cls(y)}">${y < 0 ? '▼' : '▲'}${Math.abs(y).toFixed(0)}%</span>`;
}
function spark(pid, ym, k) {
  const v = last12(ym).map(m => val(D(pid, m), k)), nums = v.filter(x => x != null);
  if (nums.length < 2) return '';
  const mx = Math.max(...nums), mn = Math.min(...nums), r = mx - mn || 1;
  const pts = v.map((x, i) => x == null ? null : `${(i / 11 * 100).toFixed(1)},${(22 - (x - mn) / r * 20).toFixed(1)}`).filter(Boolean).join(' ');
  return `<svg class="spark" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}"/></svg>`;
}
function chart(pid, ym, k, type) {
  const ms = last12(ym), cur = ms.map(m => val(D(pid, m), k)), prev = ms.map(m => val(D(pid, shiftYm(m, -12)), k)), tg = ms.map(m => Number(T(pid, m)[k]) || 0);
  const mx = Math.max(1, ...cur.filter(x => x != null), ...prev.filter(x => x != null), ...tg) * 1.08;
  const H = 150, top = 14, h = y => top + (H - top) * (1 - y / mx), W = 30;
  const unit = v => type === 'pct' ? v.toFixed(1) + '%' : type === 'yen' ? '¥' + fmt(v, 'yen') : fmt(v, 'n');
  const bars = ms.map((m, i) => { const x = i * W; let o = '';
    if (prev[i] != null) o += `<rect class="b-prev" x="${x + 4}" y="${h(prev[i])}" width="9" height="${H - h(prev[i])}" rx="2"><title>${ymLabel(shiftYm(m, -12))} ${unit(prev[i])}</title></rect>`;
    if (cur[i] != null) o += `<rect class="b-cur${i === 11 ? ' sel' : ''}" x="${x + 13}" y="${h(cur[i])}" width="13" height="${H - h(cur[i])}" rx="2"><title>${ymLabel(m)} ${unit(cur[i])}</title></rect>`;
    if (tg[i]) o += `<line class="b-tg" x1="${x + 2}" x2="${x + 28}" y1="${h(tg[i])}" y2="${h(tg[i])}"/>`;
    const mo = Number(m.slice(5)); o += `<text x="${x + 15}" y="${H + 14}" class="${i === 11 ? 'sel' : ''}">${mo === 1 ? m.slice(2, 4) + '/' : ''}${mo}</text>`; return o; }).join('');
  return `<div class="chart"><svg viewBox="0 0 360 ${H + 20}" role="img" aria-label="${esc(M.find(x => x[0] === k)[1])}の12か月の推移">
    <line class="axis" x1="0" x2="360" y1="${H}" y2="${H}"/><text class="ymax" x="0" y="10">${unit(mx / 1.08)}</text>${bars}</svg></div>
    <div class="legend"><span><i class="lg-cur"></i>今年</span><span><i class="lg-prev"></i>前年同月</span>${tg.some(Boolean) ? '<span><i class="lg-tg"></i>目標</span>' : ''}</div>`;
}
function compare(gid, ym, mk) {
  const [k, label, type] = mk, pc = pace(ym);
  const rows = GROUP(gid).map(p => { const c = val(D0(p.id, ym), k), q0 = val(D0(p.id, shiftYm(ym, -12)), k); return { p, c, q: q0 != null && !RATE(k) && k !== 'unit' ? q0 * pc.ratio : q0 }; }).filter(r => r.c != null).sort((a, b) => b.c - a.c);
  if (!rows.length) return '';
  const mx = Math.max(...rows.map(r => r.c)) || 1;
  return `<section class="card"><div class="card-head"><h3>${label}のスタッフ比較</h3><span class="sub">${ymLabel(ym)}</span></div><div class="cmp">${rows.map((r, i) => `<button type="button" class="cmp-row" data-act="pick" data-id="${r.p.id}">
    <span class="cmp-n"><i>${i + 1}</i>${esc(r.p.name)}</span><span class="cmp-bar"><i style="width:${(r.c / mx * 100).toFixed(1)}%"></i></span>
    <span class="cmp-v">${type === 'yen' ? '¥' : ''}${fmt(r.c, type)}${type === 'pct' ? '%' : ''} ${diffTag(r.c, r.q, k)}</span></button>`).join('')}</div></section>`;
}
function personView() {
  const ag = AGG.find(a => a[0] === S.pid);
  const p = ag ? { id: ag[0], name: ag[1], store: '' } : S.people.find(x => x.id === S.pid) || active()[0];
  if (!p) return '<div class="empty">データがありません。</div>';
  const ym = S.ym, py = shiftYm(ym, -12), d = D(p.id, ym), q = D(p.id, py), t = T(p.id, ym), pc = pace(ym);
  const sel = `<select class="field psel" data-chg="pickSel" aria-label="スタッフを選ぶ"><optgroup label="まとめて見る">${AGG.filter(a => GROUP(a[0]).length).map(([id, l]) => `<option value="${id}" ${id === p.id ? 'selected' : ''}>${l}</option>`).join('')}</optgroup>${byStore(active()).map(([l, arr]) => `<optgroup label="${esc(l)}">${arr.map(x => `<option value="${x.id}" ${x.id === p.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</optgroup>`).join('')}</select>`;
  const storeL = ag ? ag[1] + `（${GROUP(ag[0]).length}名）` : (STORES.find(s => s[0] === p.store) || [, '店舗未設定'])[1];
  // 年間累計（1月〜選んだ月）
  const y = ym.slice(0, 4), mo = Number(ym.slice(5));
  const cum = (yr, k) => { let s = 0, n = 0; for (let m = 1; m <= mo; m++) { const v = val(D(p.id, `${yr}-${pad(m)}`), k); if (v != null) { s += v; n++; } } return n ? s : null; };
  const ct = cum(y, 'tech'), pt = cum(y - 1, 'tech');
  const tech = val(d, 'tech'), techP = q && q.tech != null ? q.tech * pc.ratio : null;
  const hero = `<section class="hero"><div class="hero-top"><div style="min-width:0"><div class="sub">${esc(storeL)} ・ ${ymLabel(ym)}の指名技術売上</div>
      <div class="lv-big">${tech == null ? '—' : '¥' + fmt(tech, 'yen')}</div>
      <div class="lv-free"><span>フリー技術売上</span><b>${val(d, 'free') == null ? '—' : '¥' + fmt(val(d, 'free'), 'yen')}</b>${q && q.free != null && val(d, 'free') != null ? diffTag(val(d, 'free'), q.free * pc.ratio, 'free') : ''}</div></div>
      <div class="lv-side">${techP != null ? `<span>前年同月 ¥${fmt(techP, 'yen')}</span><span>昨対 <b>${tech == null ? '—' : (yoy(tech, techP) >= 0 ? '+' : '') + yoy(tech, techP).toFixed(1) + '%'}</b></span>` : '<span>前年同月のデータなし</span>'}${t.tech ? `<span>目標 ¥${fmt(t.tech, 'yen')}・達成 <b>${((tech || 0) / t.tech * 100).toFixed(0)}%</b></span>` : ''}</div></div>
      ${t.tech ? `<div class="hbar"><i style="width:${Math.min(100, (tech || 0) / t.tech * 100)}%"></i></div>` : ''}
      ${ct != null ? `<div class="sub">${y}年1〜${mo}月の累計 ¥${fmt(ct, 'yen')}${pt ? `（前年同期 ¥${fmt(pt, 'yen')}・${(yoy(ct, pt) >= 0 ? '+' : '') + yoy(ct, pt).toFixed(1)}%）` : ''}</div>` : ''}
      ${pc.label ? `<div class="sub">${pc.label}のデータ。前年は同じ日数分に換算しています。</div>` : ''}</section>`;
  const tiles = M.filter(([k]) => k !== 'tech' && k !== 'free' && k !== 'over').map(([k, label, type, , noyoy]) => {
    const c = val(d, k), pv0 = noyoy ? val(D(p.id, shiftYm(ym, -1)), k) : val(q, k), pv = pv0 != null && !RATE(k) && k !== 'unit' && !noyoy ? pv0 * pc.ratio : pv0, tg = Number(t[k]) || 0;
    return `<button type="button" class="tile${S.metric === k ? ' on' : ''}" data-act="metric" data-id="${k}"><span class="kl">${label}</span>
      <b>${c == null ? '—' : (type === 'yen' ? '¥' : '') + fmt(c, type)}${type === 'pct' && c != null ? '<small>%</small>' : ''}</b>
      <span class="ks">${diffTag(c, pv, k)}<span>${pv0 == null ? '' : noyoy ? '前月比' : '昨対'}</span>${tg ? `<span>目標 ${fmt(tg, type)}${type === 'pct' ? '%' : ''}</span>` : ''}</span>${spark(p.id, ym, k)}</button>`;
  }).join('');
  const mk = M.find(x => x[0] === S.metric) || M[0];
  const metricChips = `<div class="chips">${M.map(([k, l]) => `<button type="button" class="chip" data-act="metric" data-id="${k}" aria-pressed="${k === mk[0]}">${l}</button>`).join('')}</div>`;
  const list = last12(ym).reverse().map(m => { const a = D(p.id, m), b = D(p.id, shiftYm(m, -12)); if (!a) return '';
    const c = (k, type) => `<td class="c">${val(a, k) == null ? '' : fmt(val(a, k), type)}</td>`;
    const yv = yoy(val(a, 'tech'), val(b, 'tech'));
    return `<tr${m === ym ? ' class="here"' : ''}><th>${Number(m.slice(5))}月${m.slice(0, 4) !== y ? `<small>${m.slice(2, 4)}</small>` : ''}</th>${c('tech', 'yen')}<td class="c ${yv == null ? '' : yv < 0 ? 'neg' : 'pos'}">${yv == null ? '—' : (yv >= 0 ? '+' : '') + yv.toFixed(0) + '%'}</td>${c('free', 'yen')}${c('cust', 'n')}${c('unit', 'yen')}${c('next', 'pct')}${c('newc', 'n')}</tr>`; }).join('');
  return `<div class="ptop">${sel}${mnav('ym')}</div>${hero}
    <div class="tiles">${tiles}</div>
    <section class="card"><div class="card-head"><h3>${mk[1]}の推移</h3><span class="sub">直近12か月</span></div>${metricChips}${chart(p.id, ym, mk[0], mk[2])}</section>
    ${ag ? compare(ag[0], ym, mk) : ''}
    <section class="card"><details><summary class="card-head" style="cursor:pointer"><h3>月ごとの数字</h3><span class="sub">開く</span></summary>
    <div class="tbl-wrap"><table class="rep mlist"><thead><tr><th></th><th>指名技術</th><th>昨対</th><th>フリー技術</th><th>客数</th><th>客単価</th><th>次予率</th><th>新規</th></tr></thead><tbody>${list}</tbody></table></div></details></section>`;
}
function targetView() {
  if (!WHO.isAdmin()) return '<div class="empty">管理者・オーナーだけが使える画面です。</div>';
  const ym = S.ym, py = shiftYm(ym, -12);
  return mnav('ym') + `<section class="card"><h3>${ymLabel(ym)}の目標</h3><div class="sub">空欄の項目は目標なしとして扱います。参考に前年同月の実績を薄く表示しています。</div>
    <div class="tbl-wrap"><table class="rep tg"><thead><tr><th>名前</th>${TG.map(([, l]) => `<th>${l}${l === '次予率' ? '(%)' : ''}</th>`).join('')}</tr></thead><tbody>
    ${byStore(active()).map(([l, arr]) => `<tr class="grp"><td colspan="${TG.length + 1}">${esc(l)}</td></tr>` + arr.map(p => `<tr><th>${esc(p.name)}</th>${TG.map(([k]) => `<td><input class="field tgin" inputmode="numeric" data-pid="${p.id}" data-k="${k}" value="${esc(T(p.id, ym)[k] ?? '')}" placeholder="${fmt(val(D(p.id, py), k), k === 'next' ? 'pct' : 'n')}"></td>`).join('')}</tr>`).join('')).join('')}
    </tbody></table></div>
    <div class="actions"><button type="button" class="btn primary" data-act="saveTg">保存</button><button type="button" class="btn" data-act="copyTg">前月の目標をコピー</button></div></section>
    ${peopleAdmin()}`;
}
function peopleAdmin() {
  return `<section class="card"><details><summary class="sub" style="cursor:pointer">月報の対象者（${S.people.length}名）・店舗・名簿とのつなぎ</summary><div class="list" style="margin-top:8px">${S.people.map(p => `<div class="row"><div><div class="name">${esc(p.name)}${p.hidden ? '（非表示）' : ''}</div>
      <div class="sub"><select class="field" style="width:auto;padding:4px 8px" data-chg="pstore" data-id="${p.id}"><option value="">店舗未設定</option>${STORES.map(([id, l]) => `<option value="${id}" ${p.store === id ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <select class="field" style="width:auto;padding:4px 8px" data-chg="plink" data-id="${p.id}"><option value="">名簿：未設定</option>${WHO.active().map(w => `<option value="${w.id}" ${p.personId === w.id ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}</select></div></div>
      <button type="button" class="btn small" data-act="hideP" data-id="${p.id}">${p.hidden ? '表示' : '非表示'}</button></div>`).join('')}</div></details></section>`;
}

/* ---- 操作 ---- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  try {
    if (a === 'whoSwitch') { WHO.handle('whoOut', el); return; }
    if (await WHO.handle(a, el)) return;
    switch (a) {
      case 'tab': S.tab = id; render(); window.scrollTo(0, 0); break;
      case 'ym': S.ym = shiftYm(S.ym, Number(id)); render(); break;
      case 'year': S.year += Number(id); render(); break;
      case 'pick': S.pid = id; render(); break;
      case 'metric': S.metric = id; render(); break;
      case 'openP': S.pid = id; S.tab = 'person'; render(); window.scrollTo(0, 0); break;
      case 'saveTg': {
        const b = db.batch(); const by = {};
        document.querySelectorAll('.tgin').forEach(i => { (by[i.dataset.pid] ||= {})[i.dataset.k] = i.value.replace(/[,，]/g, '').trim(); });
        Object.entries(by).forEach(([pid, o]) => { const d = {}; Object.entries(o).forEach(([k, v]) => { if (v !== '' && !isNaN(Number(v))) d[k] = Number(v); }); b.set(db.doc(`mr_target/${pid}_${S.ym}`), Object.assign({ pid, ym: S.ym }, d)); });
        await b.commit(); toast('目標を保存しました'); break;
      }
      case 'copyTg': { const prev = shiftYm(S.ym, -1); document.querySelectorAll('.tgin').forEach(i => { const v = T(i.dataset.pid, prev)[i.dataset.k]; if (v != null) i.value = v; }); toast('前月の目標を入れました。保存を押してください'); break; }
      case 'hideP': { const p = S.people.find(x => x.id === id); await db.doc('mr_people/' + id).update({ hidden: !p.hidden }); break; }
    }
  } catch (e) { toast('保存できませんでした：' + e.message); }
});
document.addEventListener('change', async ev => {
  const el = ev.target, c = el.dataset.chg; if (!c) return;
  try {
    if (c === 'pickSel') { S.pid = el.value; el.blur(); render(); return; }
    if (c === 'pstore') await db.doc('mr_people/' + el.dataset.id).update({ store: el.value });
    if (c === 'plink') await db.doc('mr_people/' + el.dataset.id).update({ personId: el.value });
  } catch (e) { toast(e.message); }
});
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'login-form') return; ev.preventDefault();
  try { await firebase.auth().signInWithEmailAndPassword($('lg-email').value.trim(), $('lg-pass').value); } catch (e) { $('lg-err').textContent = 'メールアドレスかパスワードが違います'; }
});

/* ---- 接続 ---- */
let db, started = false;
function listen() {
  const typing = () => { const a = document.activeElement; return a && a.matches('input,textarea,select'); };
  const soft = () => { if (!typing()) render(); };
  const fail = e => { S.err = e.message; render(); };
  WHO.init(db, soft);
  db.collection('mr_people').onSnapshot(s => { S.people = s.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.order || 0) - (b.order || 0)); S.ready.add('p'); soft(); }, fail);
  db.collection('mr_month').onSnapshot(s => { const o = {}; s.docs.forEach(d => o[d.id] = d.data()); S.data = o; S.ready.add('d'); soft(); }, fail);
  db.collection('mr_target').onSnapshot(s => { const o = {}; s.docs.forEach(d => o[d.id] = d.data()); S.targets = o; S.ready.add('t'); soft(); }, fail);
  db.collection('mr_meta').onSnapshot(s => { const o = {}; s.docs.forEach(d => o[d.id] = d.data()); S.meta = o; S.ready.add('m'); soft(); }, fail);
}
(function init() {
  if (typeof firebaseConfig === 'undefined' || !window.firebase) { $('main').innerHTML = '<div class="empty">設定ファイル（config.js）が読み込めません。</div>'; return; }
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebase.auth().onAuthStateChanged(u => { S.user = u || null; if (u && !started) { started = true; listen(); } render(); });
})();
</script>
</body>
