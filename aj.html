<!doctype html>
<html lang="ja">

<style>
:root {
  --bg: #f5f4f1; --surface: #ffffff; --line: #e4e1da; --ink: #1c1f26; --muted: #6b6a66;
  --accent: #1f2b45; --accent-ink: #ffffff; --accent-soft: #e8ebf2;
  --gold: #9a7a48; --gold-soft: #f4ede1;
  --good: #1f6b4a; --good-soft: #e3f2ea; --warn: #8a5a00; --warn-soft: #fbf0d9;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-brand: "Cormorant Garamond", "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121419; --surface: #1b1e25; --line: #2e323c; --ink: #eceae5; --muted: #a3a19b;
  --accent: #b9c6e4; --accent-ink: #141a28; --accent-soft: #252c3b;
  --gold: #d6b884; --gold-soft: #2f2a20;
  --good: #7fd3ab; --good-soft: #1b3429; --warn: #eec26e; --warn-soft: #3a2e16;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121419; --surface: #1b1e25; --line: #2e323c; --ink: #eceae5; --muted: #a3a19b;
  --accent: #b9c6e4; --accent-ink: #141a28; --accent-soft: #252c3b;
  --gold: #d6b884; --gold-soft: #2f2a20;
  --good: #7fd3ab; --good-soft: #1b3429; --warn: #eec26e; --warn-soft: #3a2e16;
  color-scheme: dark }
* { box-sizing: border-box }
html { padding: env(safe-area-inset-top, 0px) 0 0; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 760px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; }
.brand { font-family: var(--font-brand); font-size: 24px; letter-spacing: .18em; color: var(--accent); display: flex; align-items: baseline; gap: 10px; }
.brand small { font-family: var(--font-body); font-size: 12px; letter-spacing: .04em; color: var(--muted); }
main { padding-block: 16px 104px; display: flex; flex-direction: column; gap: 14px; }
main.has-bar { padding-bottom: 170px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h3 { margin: 0; font-size: 16px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.step-t { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.step-t i { font-style: normal; font-family: var(--font-brand); font-size: 22px; color: var(--gold); min-width: 1.1em; }
.sub { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; border: 1px solid var(--line); background: var(--surface); padding: 8px 13px; border-radius: 99px; font-size: 14px; color: var(--ink); text-align: left; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; padding-left: 34px; }
.chip .no { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 12px; display: grid; place-items: center; font-weight: 700; }
.grp { display: flex; flex-direction: column; gap: 8px; }
.grp + .grp { padding-top: 12px; border-top: 1px dashed var(--line); }
.grp-t { font-size: 12px; font-weight: 700; color: var(--gold); letter-spacing: .06em; }
.search { position: relative; }
.search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--line); border-radius: 99px; background: var(--bg); }
.search::before { content: ""; position: absolute; left: 14px; top: 50%; width: 11px; height: 11px; border: 2px solid var(--muted); border-radius: 99px; transform: translateY(-62%); }
.search::after { content: ""; position: absolute; left: 25px; top: 58%; width: 6px; height: 2px; background: var(--muted); transform: rotate(45deg); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; background: var(--bg); border: 1px solid var(--line); padding: 3px; border-radius: 10px; }
.seg button { border: 0; background: transparent; padding: 8px 4px; border-radius: 7px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.q { display: flex; flex-direction: column; gap: 6px; }
.q > span { font-size: 12px; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 9px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }
/* 下に固定のボタン */
.gobar { position: fixed; inset: auto 0 calc(53px + env(safe-area-inset-bottom, 0px)); z-index: 8; background: linear-gradient(to top, var(--bg) 70%, transparent); padding-block: 14px 10px; }
.gobar .btn { width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; box-shadow: 0 4px 14px rgba(31,43,69,.25); }
/* 結果 */
.rtop { display: flex; flex-direction: column; gap: 10px; }
.rtop-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sel { display: flex; flex-wrap: wrap; gap: 6px; }
.sel span { font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 3px 10px; }
.sel span b { margin-right: 4px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px 5px 6px; }
.toggle i { width: 34px; height: 20px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; }
.toggle i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 99px; background: #fff; transition: left .15s; }
.toggle[aria-pressed="true"] i { background: var(--gold); } .toggle[aria-pressed="true"] i::after { left: 16px; }
.ptabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.ptabs::-webkit-scrollbar { display: none; }
.ptabs button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 14px; text-align: left; display: flex; flex-direction: column; gap: 0; max-width: 240px; }
.ptabs button b { font-size: 13px; } .ptabs button span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ptabs button[aria-selected="true"] span { color: var(--accent-ink); opacity: .8; }
.plan { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
.plan-h { padding: 14px 16px; background: var(--accent); color: var(--accent-ink); display: flex; flex-direction: column; gap: 2px; }
.plan-h b { font-size: 17px; line-height: 1.4; } .plan-h span { font-size: 12px; opacity: .85; }
.plan-b { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.why { font-size: 13px; background: var(--bg); border-radius: 9px; padding: 10px 12px; }
.slots { display: grid; gap: 8px; }
.slot { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.slot-k { font-size: 11px; letter-spacing: .08em; color: var(--gold); font-weight: 700; }
.slot-n { font-size: 16px; font-weight: 700; line-height: 1.45; overflow-wrap: anywhere; }
.slot-p { font-size: 12px; color: var(--muted); }
.slot details { margin-top: 4px; font-size: 13px; }
.slot details summary { cursor: pointer; color: var(--accent); font-size: 12px; list-style: none; }
.slot details summary::-webkit-details-marker { display: none; }
.slot details summary::before { content: "＋ "; } .slot details[open] summary::before { content: "− "; }
.slot details div { padding: 6px 0 0; display: flex; flex-direction: column; gap: 4px; }
.slot details div span small { color: var(--muted); margin-left: 6px; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--gold-soft); font-size: 13px; }
.total b { font-size: 18px; font-variant-numeric: tabular-nums; }
.talk30 { display: flex; flex-direction: column; gap: 0; border-radius: 14px; background: var(--gold-soft); padding: 6px 14px; }
.talk30 div { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 10px; padding: 9px 0; font-size: 14px; }
.talk30 div + div { border-top: 1px dashed rgba(154,122,72,.35); }
.talk30 dt, .talk30 .k { font-size: 11px; font-weight: 700; color: var(--gold); letter-spacing: .04em; padding-top: 3px; }
.recipe { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; }
.recipe div { border-radius: 8px; padding: 6px 2px; text-align: center; font-size: 11px; color: #fff; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.recipe div b { font-size: 13px; letter-spacing: .02em; }
.recipe div small { font-size: 10px; opacity: .9; overflow-wrap: anywhere; line-height: 1.3; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; background: var(--c); vertical-align: -1px; }
.salon { display: flex; flex-direction: column; gap: 8px; }
.salon + .salon { padding-top: 12px; border-top: 1px dashed var(--line); }
.salon > b { font-size: 15px; }
.notes { margin: 0; padding-left: 1.1em; font-size: 12px; color: var(--muted); }
.lcard { display: flex; flex-direction: column; gap: 10px; }
.lname { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.lname b { font-size: 17px; }
.tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--gold-soft); color: var(--gold); white-space: nowrap; }
.tag.s { background: var(--accent-soft); color: var(--accent); }
.talk { position: relative; background: var(--gold-soft); border-radius: 12px; padding: 12px 14px 12px 40px; font-size: 14px; }
.talk::before { content: "“"; position: absolute; left: 12px; top: 2px; font-family: var(--font-brand); font-size: 38px; color: var(--gold); line-height: 1; }
.ing { display: flex; flex-direction: column; }
.ing div { display: grid; grid-template-columns: minmax(0, 9em) minmax(0, 1fr); gap: 2px 10px; font-size: 13px; padding: 8px 0; border-top: 1px dashed var(--line); }
.ing b { font-size: 13px; } .ing span.r { display: block; font-size: 11px; color: var(--gold); font-weight: 500; }
.tips { margin: 0; padding-left: 1.2em; font-size: 13px; }
details.more > summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 500; list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "＋ "; }
details.more[open] > summary::before { content: "− "; }
details.more[open] > summary { margin-bottom: 10px; }
.items { display: grid; grid-template-columns: 6em minmax(0, 1fr); gap: 8px 10px; font-size: 14px; margin: 0; }
.items dt { font-size: 11px; letter-spacing: .06em; color: var(--gold); font-weight: 700; padding-top: 2px; }
.items dd { margin: 0; display: flex; flex-direction: column; gap: 3px; min-width: 0; overflow-wrap: anywhere; }
.items dd small { color: var(--muted); font-size: 12px; }
.sec { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin: 6px 0 -4px; }
.diag { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 16px; width: 100%; text-align: left; border: 0; background: transparent; }
.row + .row { border-top: 1px solid var(--line); }
.ol { margin: 0; padding-left: 1.3em; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.memo { width: 100%; min-height: 160px; font-size: 13px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); resize: vertical; }
.field { width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
label.lbl { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.err { color: #b3261e; font-size: 13px; }
.login { max-width: 420px; margin: 24px auto; }
nav { position: fixed; inset: auto 0 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); }
.tabs button { border: 0; background: transparent; padding: 15px 0; font-size: 14px; color: var(--muted); }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; box-shadow: inset 0 2px 0 var(--gold); }
#toast { position: fixed; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px); }
.foot { font-size: 11px; color: var(--muted); text-align: center; }
/* お客さまに見せるモード：専門的な説明・価格を隠し、文字を大きく */
body.cust .staff { display: none !important; }
body.cust main { font-size: 17px; }
body.cust .slot-n { font-size: 19px; }
body.cust .talk30 div { font-size: 16px; }
body.cust .plan-h b { font-size: 19px; }
.cust-only { display: none; }
body.cust .cust-only { display: block; }
@media (max-width: 420px) { .items { grid-template-columns: 1fr; gap: 2px; } .items dt { padding-top: 6px; } .ing div { grid-template-columns: 1fr; } .talk30 div { grid-template-columns: 1fr; gap: 2px; } }
</style>

</div></header>
<main class="wrap" id="main"><div class="empty">読み込んでいます</div></main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="config.js"></script>
<script>
/* achieve Aujua カウンセリング
   商品知識はFirestore aj_kb/v1 { json } に置き、ログインしたスタッフだけが読み込む（ページ自体には持たない）。
   ① お悩みを選ぶ画面 → ② 提案の画面（案をタブで切替・30秒トーク・サロンのSTEP図・お客さまに見せるモード） */
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let toastT;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

const S = { user: undefined, kb: null, err: '', tab: 'c', view: 'pick', hair: [], scalp: [], aging: false, thick: 'normal', finish: 'soft', open: null, pi: 0, q: '', cust: false };
const L = id => S.kb.lines[id];
const C = id => S.kb.concerns.find(c => c.id === id);
const STEP4 = ['QU', 'FM', 'AQ', 'ST', 'RP'], STEP5 = ['DI', 'AL', 'IM', 'TS', 'EQ'];
const W = { light: 0, mid: 1, heavy: 2 };
/* お悩みのグループ分けと、お客さまの言葉での検索用キーワード（アプリ側の整理） */
const GROUPS = [
  ['ダメージ', 'hair', ['dry', 'hard', 'bleach', 'breakage', 'tangle']],
  ['くせ・まとまり', 'hair', ['frizz', 'yugami']],
  ['年齢による変化', 'hair', ['agedry', 'highage', 'volume']],
  ['紫外線・汚れ', 'hair', ['uv', 'pollution']],
  ['地肌の状態', 'scalp', ['itch', 'oily', 'stiff', 'yellow', 'red']],
  ['抜け毛・ボリューム・白髪', 'scalp', ['thin', 'part', 'gray', 'multi']],
];
const WORDS = {
  dry: 'パサパサ パサつき ぱさ 乾燥 カラー パーマ ツヤがない', hard: '硬い かたい ゴワゴワ ごわ コテ アイロン 熱 ブロー',
  bleach: 'ブリーチ ハイトーン スカスカ ケアブリーチ', breakage: '枝毛 切れ毛 傷みやすい ちぎれる ダメージ',
  tangle: 'からまる 絡まる 指通り 引っかかる ひっかかる きしむ', frizz: '広がる 膨らむ くせ うねり 湿気 はねる 梅雨 雨',
  yugami: 'ゆがみ くせ ダメージ ツヤが出ない チリチリ 縮毛矯正', agedry: 'まとまらない 年齢 うねりが出てきた 乾燥 トリートメント効かない',
  highage: 'ハリ コシ ツヤ 物足りない 年齢 弾力', volume: 'ボリューム ペタンこ ぺたんこ 立ち上がらない 根元 トップ 分け目',
  uv: '紫外線 日焼け 夏 色落ち 外', pollution: '表面 ザラザラ ザラつき 花粉 ほこり',
  itch: 'かゆい かゆみ フケ ふけ 乾燥 しみる', oily: 'ベタベタ ベタつき におい 臭い 脂 泡立たない',
  stiff: '硬い 地肌 ペタン 肩こり つっぱる', thin: '抜け毛 細く やせ 薄毛 薄く', part: '分け目 つむじ 地肌が見える 薄く',
  yellow: '黄色 黄ばみ くすみ', red: '赤い 赤み', gray: '白髪 しらが', multi: 'いろいろ 全部 たくさん 年齢',
};
const COLOR = { QU: '#3f7cb3', FM: '#c0504d', AQ: '#4aa3a6', ST: '#8a8fa0', RP: '#9a6bb5', DI: '#7b5a3c', AL: '#c08a3e', IM: '#b0546f', TS: '#5d8a4a', EQ: '#6d7fb8', IN: '#2f4a7a', EX: '#7a7a6a', DL: '#b8a03a' };

/* ---------- 提案ロジック ---------- */
function linesFor(ids) {
  const out = [];
  ids.forEach(id => { const c = C(id); (S.aging ? c.aging : c.young).forEach(l => { if (!out.includes(l)) out.push(l); }); });
  return out;
}
const nm = s => s.split('｜')[0];
const pr = s => s.includes('｜') ? s.split('｜').slice(1).join('｜') : '';
const yen = s => { const m = String(s).match(/¥([\d,]+)/); return m ? Number(m[1].replace(/,/g, '')) : 0; };
function pickLi(lid) {
  const li = (L(lid).items.li || []); if (!li.length) return -1;
  const want = S.finish === 'light' ? /さら|軽/ : S.finish === 'moist' ? /しっとり|まとま/ : /やわらか|うるお/;
  const i = li.findIndex(x => want.test(x)); return i >= 0 ? i : 0;
}
function trPick(lid) {
  const tr = L(lid).items.tr || [], mi = tr.findIndex(x => /モイスト/.test(x));
  return mi >= 0 && (S.finish === 'moist' || S.thick === 'thick') ? mi : 0;
}
/* スロット：{k:種類, list:[商品], i:おすすめの位置} */
const slot = (k, list, i = 0) => list && list.length ? { k, list, i: Math.max(0, i) } : null;
function priceOf(sl) { let p = yen(sl.list[sl.i]); if (!p) for (let j = sl.i; j >= 0 && !p; j--) p = yen(sl.list[j]); return p; }

function plans() {
  const hairL = linesFor(S.hair), scalpL = linesFor(S.scalp);
  const extras = hairL.filter(l => ['EX', 'DL'].includes(l)), core = hairL.filter(l => !['EX', 'DL'].includes(l));
  const m = core[0], m2 = core[1], sc = scalpL[0], res = [];
  if (m) res.push({ t: `${L(m).name}でそろえる`, s: 'いちばん気になるお悩みに合わせた基本セット', lines: [m],
    why: `「${C(S.hair[0]).label}」には${L(m).name}。${L(m).catch}。`,
    slots: [slot('シャンプー', L(m).items.sp), slot('トリートメント', L(m).items.tr, trPick(m)), slot('集中ケア（週2〜3回）', L(m).items.nt), slot('アウトバス', L(m).items.li, pickLi(m))].filter(Boolean) });
  if (m && m2) {
    const heavier = W[L(m2).w] > W[L(m).w] ? m2 : m, softish = ['FM', 'RP', 'QU'].includes(m2) ? m2 : m;
    const tr = S.finish === 'moist' ? heavier : S.finish === 'soft' ? softish : (W[L(m).w] <= W[L(m2).w] ? m : m2), sp = tr === m ? m2 : m;
    res.push({ t: `${L(sp).name} × ${L(tr).name}`, s: 'お悩み2つをシャンプーとトリートメントで掛け合わせ', lines: [m, m2],
      why: `シャンプーは${L(sp).name}、仕上がりの好み（${{ light: 'さらさら', moist: 'しっとりまとまる', soft: 'やわらか' }[S.finish]}）に近い${L(tr).name}をトリートメントに。逆（${L(tr).name}のシャンプー×${L(sp).name}のトリートメント）もOK。`,
      slots: [slot('シャンプー', L(sp).items.sp), slot('トリートメント', L(tr).items.tr, trPick(tr)), slot('アウトバス', [...(L(tr).items.li || []), ...(L(sp).items.li || [])], pickLi(tr))].filter(Boolean) });
  }
  if (sc) {
    const sl = L(sc);
    res.push({ t: m ? `${sl.name} × ${L(m).name}` : `${sl.name}で地肌ケア`, s: m ? '地肌のシャンプー × 髪のトリートメント' : '地肌のお悩みに合わせた基本セット', lines: m ? [sc, m] : [sc],
      why: m ? `シャンプーは地肌の悩み（${C(S.scalp[0]).label}）に合わせて${sl.name}、トリートメントは髪の悩みに合わせて${L(m).name}。地肌用ローションで毎日の地肌ケアを。` : `「${C(S.scalp[0]).label}」には${sl.name}。${sl.catch}。`,
      slots: [slot('シャンプー', sl.items.sp), m ? slot('トリートメント', L(m).items.tr, trPick(m)) : null, slot('地肌用マスク（週2〜3回）', sl.items.tr), slot('地肌用ローション（毎日）', sl.items.li), m ? slot('アウトバス', L(m).items.li, pickLi(m)) : null].filter(Boolean) });
  }
  if (m === 'ST' && S.thick === 'thick') res.push({ t: 'スムース × アクアヴィア モイスト', s: '硬い・多い髪でスムースだと軽すぎるとき', lines: ['ST', 'AQ'],
    why: 'お悩み（からまり）にはシャンプーでスムース。仕上がりの重さは髪質に合わせてトリートメントで調整します。',
    slots: [slot('シャンプー', L('ST').items.sp), slot('トリートメント', L('AQ').items.tr, 1), slot('アウトバス', L('AQ').items.li, 1)] });
  else if (m && S.thick === 'fine' && W[L(m).w] === 2) res.push({ t: `${L(m).name}を軽めに使う`, s: '細い髪で重く感じるとき', lines: [m],
    why: `シャンプー・トリートメントは${L(m).name}のまま。トリートメントは毛先中心に少なめ、アウトバスは軽い方を。`,
    slots: [slot('シャンプー', L(m).items.sp), slot('トリートメント', L(m).items.tr), slot('アウトバス', L(m).items.li, 0)].filter(Boolean) });
  extras.forEach(e => res.push({ t: `＋ ${L(e).name}`, s: '普段のケアにプラス', lines: [e], why: L(e).catch + '。',
    slots: [slot('プラスするアイテム', [...(L(e).items.sp || []), ...(L(e).items.li || [])])].filter(Boolean) }));
  return { res, salon: salonFor(hairL, scalpL) };
}

/* サロントリートメント：STEPごとのブロックと補足 */
function salonFor(hairL, scalpL) {
  const out = [];
  const aging = hairL.find(l => STEP5.includes(l)), four = hairL.filter(l => STEP4.includes(l));
  const blk = (l, sm) => ({ l, sm });
  if (hairL.includes('IN')) out.push({ t: '7STEP インメトリィ', d: 'くせ×ダメージのゆがみを整える、いちばん手厚いコース', steps: Array.from({ length: 7 }, () => blk('IN')) });
  else if (aging) {
    const second = four[0]; let steps = [1, 2, 3, 4, 5].map(() => blk(aging)); const notes = [];
    if (aging === 'IM' && hairL.includes('EQ')) { steps = [blk('IM'), blk('EQ', '根元EQ／毛先IM'), blk('IM'), blk('IM', '毛先IM／根元EQ'), blk('IM')]; notes.push('根元の立ち上がりもケア。4thのチャージは根元をエクイアルで。'); }
    if (second) { steps[2] = blk(aging, `＋${L(second).name}2nd重ね付け`); notes.push(`2つ目の悩み（${L(second).name}）は、3rdの上から${L(second).name}の2nd STEPを重ね付け（合計量はレングスの規定量に）。`); }
    notes.push('手触りを変えたいときは、5thを4STEPの4thに置き換え（アクアヴィア・スムースはツルっと）。');
    if (aging !== 'AL') notes.push('さらに保湿感・ツヤ・持ちがほしいときは、4th・5thをアルティールに。');
    out.push({ t: `5STEP ${L(aging).name}`, d: 'エイジングの悩みでラインを選ぶ', steps, notes });
  } else if (four.length) {
    const main = four[0], second = four[1], notes = [];
    let steps = [1, 2, 3, 4].map(() => blk(main));
    if (main === 'QU' && (S.finish === 'moist' || hairL.includes('AQ'))) { steps = steps.map(() => blk('QU', 'M')); notes.push('クエンチは1M〜4M（パサついて広がる髪をまとまりやすく）。'); }
    if (second) { if (second === 'ST') steps[3] = blk('ST', 'からまり'); else steps[0] = blk(second, '2つ目の悩み'); }
    notes.push('仕上がりの質感を変えたいときは、4thを組み替え。');
    notes.push('さらに保湿感・ツヤ・持ちがほしいときは、3rd・4thをアルティールに（4thの前に補水となめし）。');
    out.push({ t: `4STEP ${L(main).name}`, d: '最も気になる悩みでラインを選び、2つ目の悩みは1st STEPで', steps, notes });
  }
  if (hairL.includes('EX')) out.push({ t: 'スペシャルケア：エクスシールド', d: 'シャンプー前にクリアジェルで汚れを落とし、最後にエクスシールド＋でキューティクルを補強。' });
  if (scalpL.length) out.push({ t: 'スカルプケア：スパオイル＋頭筋リリース', d: 'トリートメントの途中に地肌マッサージ（約10分）を組み込む複合メニュー。香りは4種類から気分で。' });
  return out;
}

/* 30秒トーク：上から順に読めば説明になる */
function talk30(p) {
  const main = L(p.lines[0]);
  const cid = [...S.hair, ...S.scalp].find(id => (S.aging ? C(id).aging : C(id).young).includes(p.lines[0])) || S.hair[0] || S.scalp[0];
  const mech = l => l.mech.replace(/（[^）]*）$/, '');
  const rows = [
    ['今の状態', `「${C(cid).label}」が気になっている状態ですね。`],
    ['原因', `${main.cause}。`],
    ['たとえると', main.talk],
    ['このアイテム', `${main.name}は、${mech(main)}ので、`],
    ['こう変わる', `${main.goal || main.catch}なります。`.replace(/にになります/, 'になります').replace(/へなります/, 'へ導きます')],
  ];
  if (p.lines[1] && p.lines[1] !== p.lines[0]) { const l2 = L(p.lines[1]); rows.push(['もう1つ', `${l2.name}も合わせると、${l2.goal || l2.catch}なります。`]); }
  return rows;
}

/* ---------- 画面 ---------- */

  const m = $('main');
  document.body.classList.toggle('cust', S.cust && S.tab === 'c' && S.view === 'result');
  $('gobar').hidden = true; m.classList.remove('has-bar');
  if (S.user === undefined) { m.innerHTML = '<div class="empty">読み込んでいます</div>'; return; }
  if (!S.user) { $('nav').hidden = true; m.innerHTML = loginView(); return; }
  if (S.err) { m.innerHTML = `<div class="card"><div class="err">${esc(S.err)}</div></div>`; return; }
  if (!S.kb) { m.innerHTML = '<div class="empty">商品データを読み込んでいます</div>'; return; }
  $('nav').hidden = false;
  $('reset').hidden = S.tab !== 'c' || !(S.hair.length || S.scalp.length);
  $('tabs').innerHTML = [['c', 'カウンセリング'], ['l', 'ライン図鑑'], ['f', '進め方']].map(([id, l]) => `<button type="button" data-act="tab" data-id="${id}" ${S.tab === id ? 'aria-current="page"' : ''}>${l}</button>`).join('');
  if (S.tab === 'l') m.innerHTML = libView();
  else if (S.tab === 'f') m.innerHTML = flowView();

function lineCard(id, compact) {

function memoText(res) {
  const out = ['本日のおすすめホームケア（オージュア）'];
  res.slice(0, 2).forEach((x, i) => { out.push(''); out.push(`【${i === 0 ? 'おすすめ' : '案2'}】${x.t}`); x.slots.forEach(sl => out.push(`・${sl.k}：${nm(sl.list[sl.i])}`)); });
  const tips = [...new Set(res[0].lines.flatMap(id => L(id).tips))];
  if (tips.length) { out.push(''); out.push('【おうちでのポイント】'); tips.forEach(t => out.push('・' + t)); }
  return out.join('\n');
}

  const box = (t, arr) => `<section class="card"><h3>${t}</h3><ol class="ol">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ol></section>`;
  return box('① 悩みを聞く（ヒアリング）', f.hearing) +
    `<section class="card"><h3>質問のコツ</h3><dl class="items">${f.questions.map(q => `<dt>${esc(q.t)}</dt><dd>${esc(q.e)}</dd>`).join('')}</dl></section>` +
    box('② 提案する', f.propose) + box('③ 不安を解消する', f.worry) + box('④ 決めていただく', f.close) + box('⑤ ホームケアの提案（仕上げのとき）', f.home) + box('ソムリエの心がまえ', f.mind);
}

/* ---------- 操作 ---------- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const { act, id, k } = el.dataset;
  if (act === 'tab') { S.tab = id; S.open = null; render(); window.scrollTo(0, 0); }
  if (act === 'set') { S[k] = id === 'true' ? true : id === 'false' ? false : id; render(); }
  if (act === 'pick') { const a = S[k], i = a.indexOf(id); i >= 0 ? a.splice(i, 1) : a.push(id); const y = window.scrollY; render(); window.scrollTo(0, y); }
  if (act === 'go') { S.view = 'result'; S.pi = 0; S.q = ''; render(); window.scrollTo(0, 0); }
  if (act === 'back2') { S.view = 'pick'; S.cust = false; render(); window.scrollTo(0, 0); }
  if (act === 'plan') { S.pi = Number(id); render(); }
  if (act === 'cust') { S.cust = !S.cust; render(); window.scrollTo(0, 0); }
  if (act === 'reset') { Object.assign(S, { hair: [], scalp: [], aging: false, thick: 'normal', finish: 'soft', view: 'pick', pi: 0, q: '', cust: false }); render(); window.scrollTo(0, 0); }
  if (act === 'open') { S.open = id; render(); window.scrollTo(0, 0); }
  if (act === 'back') { S.open = null; render(); }
  if (act === 'copy') { const t = $('memo'); try { await navigator.clipboard.writeText(t.value); toast('コピーしました'); } catch (e) { t.focus(); t.select(); toast('選択された文章をコピーしてください'); } }
});
/* 検索は一覧だけ書き換える（入力中のフォーカスを保つ） */
document.addEventListener('input', ev => { if (ev.target.id === 'q') { S.q = ev.target.value; $('clist').innerHTML = concernsHtml(); } });
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'login-form') return; ev.preventDefault();
  try { await firebase.auth().signInWithEmailAndPassword($('lg-email').value.trim(), $('lg-pass').value); } catch (e) { $('lg-err').textContent = 'メールアドレスかパスワードが違います'; }
});
(function init() {
  if (typeof firebaseConfig === 'undefined' || !window.firebase) { $('main').innerHTML = '<div class="empty">設定ファイル（config.js）が読み込めません。</div>'; return; }
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  firebase.auth().onAuthStateChanged(async u => {
    S.user = u || null; render();
    if (u && !S.kb) {
      try { const d = await db.doc('aj_kb/v1').get(); if (!d.exists) throw new Error('商品データがまだありません'); S.kb = JSON.parse(d.data().json); }
      catch (e) { S.err = '商品データを読み込めません：' + e.message; }
      render();
    }
  });
})();
</script>
